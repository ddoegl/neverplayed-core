<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Pandino - Basic Browser JS</title>
  </head>
  <body>
    <h1 id="root">Hello!</h1>
    <p>Please check the console for demo content!</p>
    <script type="pandino-manifests">
      [
        "./bundle-a-manifest.json",
      ];
    </script>
    <script type="module">
      import loaderConfiguration from "https://esm.sh/@pandino/loader-configuration-dom@0.8.33";
      import Pandino from "https://esm.sh/@pandino/pandino@0.8.33";

      const pandino = new Pandino({
        ...loaderConfiguration,
      });

      await pandino.init();
      await pandino.start();
      const context = pandino.getBundleContext();

      window.setTimeout(async () => {
        await context.installBundle(
          "./bundle-a-manifest.json",
        );
        await context.installBundle(
          "./bundle-b-manifest.json",
        );
      }, 1000);
    </script>
  </body>
</html>
