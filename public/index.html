<!DOCTYPE html>
<html>
  <head>
    <title>Never Played - Secure Bridge</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="importmap">
      {
        "imports": {
          "@pandino/pandino": "https://esm.sh/@pandino/pandino@0.8.33",
          "@pandino/pandino-api": "https://esm.sh/@pandino/pandino-api@0.8.33",
          "@pandino/persistence-manager-api": "https://esm.sh/@pandino/persistence-manager-api@0.8.33",
          "@pandino/event-api": "https://esm.sh/@pandino/event-api@0.8.33",
          "@pandino/log-api": "https://esm.sh/@pandino/log-api@0.8.33",
          "alpinejs": "https://esm.sh/alpinejs@3.13.5",
          "core-types": "./core-types.js",
          "osgi-base": "./osgi-base.js",
          "alpine-base": "./alpine-base.js",
          "@shoelace-style/shoelace/": "https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/",
          "org.neverplayed.shared-ui/": "./bundles/org.neverplayed.shared-ui/",
          "org.neverplayed.toast/": "./bundles/org.neverplayed.toast/",
          "org.neverplayed.selection-service/": "./bundles/org.neverplayed.selection-service/",
          "org.neverplayed.do-registry/": "./bundles/org.neverplayed.do-registry/",
          "org.neverplayed.realm.real-life/": "./bundles/org.neverplayed.realm.real-life/",
          "org.neverplayed.visual-editor/": "./bundles/org.neverplayed.visual-editor/",
          "org.neverplayed.showcase/": "./bundles/org.neverplayed.showcase/",
          "org.neverplayed.config-admin/": "./bundles/org.neverplayed.config-admin/",
          "org.neverplayed.event-monitor/": "./bundles/org.neverplayed.event-monitor/"
        }
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"
    ></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <style>
      [x-cloak] {
        display: none !important;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
    </style>
  </head>

  <body
    class="h-screen w-screen bg-slate-950 flex flex-col overflow-hidden"
    x-data="shellLoader"
  >
    <!-- Global Header (Managed by org.neverplayed.shell-header) -->
    <header id="shell-header" x-show="kernelReady"></header>

    <!-- App Container -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar managed by org.neverplayed.shell-sidebar -->
      <aside
        id="shell-sidebar-root"
        class="w-auto bg-white z-20 overflow-hidden flex flex-col"
      >
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto relative bg-slate-50">
        <div id="shell-host-root" x-show="kernelReady" class="h-full w-full">
        </div>

        <!-- Kernel Boot Progress -->
        <div
          x-show="!kernelReady"
          class="h-full flex flex-col items-center justify-center space-y-4"
        >
          <i class="fas fa-shield-alt fa-spin text-blue-400 text-2xl"></i>
          <span
            class="text-slate-400 text-[10px] font-mono uppercase tracking-widest text-center"
            x-text="bootStatus"
          ></span>
          <template x-if="error">
            <div class="text-red-500 text-xs font-mono mt-4 text-center px-10">
              <p class="font-bold uppercase tracking-wider">Kernel Panic</p>
              <p x-text="error"></p>
            </div>
          </template>
        </div>
      </main>
    </div>

    <script type="module">
      import loaderConfiguration from "https://esm.sh/@pandino/loader-configuration-dom@0.8.33";
      import Pandino from "https://esm.sh/@pandino/pandino@0.8.33";
      import Alpine from "https://esm.sh/alpinejs@3.13.5";
      import { REALM_MANAGER_SERVICE } from "core-types";

      // Initialize Central State
      Alpine.store("platform", { kernelReady: false });

      Alpine.data("shellLoader", () => ({
        kernelReady: false,
        bootStatus: "Shielding Phase: Core Initialization...",
        error: null,

        async init() {
          try {
            const pandino = new Pandino({ ...loaderConfiguration });
            await pandino.init();
            await pandino.start();

            const context = pandino.getBundleContext();
            globalThis.Alpine = Alpine;
            globalThis.pandinoContext = context;

            const coreBundles = [
              // 1. Core Platform
              "https://unpkg.com/@pandino/event-admin@0.8.33/dist/@pandino/event-admin-manifest.json",
              "./bundles/org.neverplayed.system-logger/manifest.json",
              "./bundles/org.neverplayed.yaml-service/manifest.json",
              "./bundles/org.neverplayed.alpine-bridge/manifest.json",

              // 2. Strategic Persistence Stratum
              "./bundles/org.neverplayed.persistence-localstorage/manifest.json",
              "./bundles/org.neverplayed.persistence-resolver/manifest.json",
              "./bundles/org.neverplayed.persistence-selector/manifest.json",

              // 3. Session & Security
              "./bundles/org.neverplayed.session-service/manifest.json",
              "./bundles/org.neverplayed.session-service-dom/manifest.json",
              "./bundles/org.neverplayed.auth-shield/manifest.json",
              "./bundles/org.neverplayed.limes/manifest.json",
              "./bundles/org.neverplayed.plexus-core/manifest.json",

              "./bundles/org.neverplayed.persistence-firebase/manifest.json",

              // 4. Universe Managers
              "./bundles/org.neverplayed.realm-manager/manifest.json",
              "./bundles/org.neverplayed.realm-manager-dom/manifest.json",
              "./bundles/org.neverplayed.perceiver-service/manifest.json",
              "./bundles/org.neverplayed.being-service/manifest.json",

              // 5. Strata & Senses
              "./bundles/org.neverplayed.stratum-core/manifest.json",
              "./bundles/org.neverplayed.stratum-core-dom/manifest.json",
              "./bundles/org.neverplayed.stratum-cli/manifest.json",
              "./bundles/org.neverplayed.stratum-hud/manifest.json",

              // 6. Diagnostic Lobby Utilities
              "./bundles/org.neverplayed.stratographer/manifest.json",

              // 7. Core Shell & Layout
              "./bundles/org.neverplayed.toast/manifest.json",
              "./bundles/org.neverplayed.shared-ui/manifest.json",
              "./bundles/org.neverplayed.shell-host/manifest.json",
              "./bundles/org.neverplayed.shell-header/manifest.json",
              "./bundles/org.neverplayed.shell-sidebar/manifest.json",

              // 8. Shell CLI & Tools
              "./bundles/org.neverplayed.shell-cli/manifest.json",
              "./bundles/org.neverplayed.shell-cli-ext/manifest.json",
              "./bundles/org.neverplayed.shell-cli-dom/manifest.json",
              "./bundles/org.neverplayed.system-reset/manifest.json",
              "./bundles/org.neverplayed.config-admin/manifest.json",
              "./bundles/org.neverplayed.event-monitor/manifest.json",
              "./bundles/org.neverplayed.alpine-inspector/manifest.json",

              // 9. Plexus Sensation Engine
              "./bundles/org.neverplayed.plexus-enricher/manifest.json",
              "./bundles/org.neverplayed.plexus/manifest.json",
              "./bundles/org.neverplayed.plexus-sensor/manifest.json",
              "./bundles/org.neverplayed.plexus-tracing/manifest.json",
              "./bundles/org.neverplayed.plexus-test/manifest.json",
            ];

            for (const url of coreBundles) {
              this.bootStatus = `Loading: ${url.split("/").pop()}...`;
              try {
                const b = await context.installBundle(url);
                if (
                  b.state === 2 || b.state === 4 ||
                  (b.getState && b.getState() < 32)
                ) {
                  await b.start();
                }
              } catch (err) {
                console.error(`Boot failed for bundle ${url}:`, err);
                this.error = `Boot failure for ${url}: ${err.message}`;
                throw err;
              }
            }

            // 3. Handshake with Realm Manager
            const rmRef = context.getServiceReference(
              REALM_MANAGER_SERVICE,
            );
            let realmManager = null;
            if (rmRef) {
              realmManager = context.getService(rmRef);
              await realmManager.waitReady();
            }

            // 4. Dynamic External Realm & Bundle Injection (ADR-0035)
            const queryParams = new URLSearchParams(window.location.search);
            const dynamicTargets = [];
            const directBundles = [];
            const realmIndexUrls = [];

            // Parse ?realms= parameters (discovery indexes e.g. http://localhost:8009/realms/index.json)
            const realmsParams = queryParams.getAll("realms");
            for (const p of realmsParams) {
              for (const r of p.split(",")) {
                const trimmed = r.trim();
                if (trimmed) realmIndexUrls.push(trimmed);
              }
            }

            // Parse ?realm= parameters (can be composite realm JSONs or bundles)
            const realmParams = queryParams.getAll("realm");
            for (const p of realmParams) {
              for (const r of p.split(",")) {
                const trimmed = r.trim();
                if (trimmed) dynamicTargets.push(trimmed);
              }
            }

            // Parse ?bundle= parameters (explicit standalone bundles)
            const bundleParams = queryParams.getAll("bundle");
            for (const p of bundleParams) {
              for (const b of p.split(",")) {
                const trimmed = b.trim();
                if (trimmed) directBundles.push(trimmed);
              }
            }

            // Support ?manifests=http://.../manifests.json
            const manifestsUrl = queryParams.get("manifests");
            if (manifestsUrl) {
              try {
                this.bootStatus = `Fetching remote manifests: ${manifestsUrl}...`;
                const resp = await fetch(manifestsUrl);
                if (resp.ok) {
                  const urls = await resp.json();
                  if (Array.isArray(urls)) {
                    dynamicTargets.push(...urls);
                  }
                }
              } catch (err) {
                console.warn(`[Core Harness] Failed to load remote manifests from ${manifestsUrl}:`, err);
              }
            }

            // 4a. Install explicit standalone bundles
            for (const bundleUrl of directBundles) {
              try {
                this.bootStatus = `Installing bundle: ${bundleUrl.split("/").pop()}...`;
                console.log(`[Core Harness] Installing external bundle from ${bundleUrl}`);
                const b = await context.installBundle(bundleUrl);
                if (
                  b.state === 2 || b.state === 4 ||
                  (b.getState && b.getState() < 32)
                ) {
                  await b.start();
                  console.log(`[Core Harness] Bundle started: ${b.symbolicName || bundleUrl}`);
                }
              } catch (err) {
                console.warn(`[Core Harness] Failed to install bundle ${bundleUrl}:`, err);
              }
            }

            // 4b. Ingest Remote Realm Discovery Indexes (?realms=...)
            const registeredRealmIds = [];
            for (const idxTarget of realmIndexUrls) {
              try {
                let idxUrl = new URL(idxTarget, window.location.href).href;
                if (!idxUrl.endsWith(".json")) {
                  idxUrl = new URL(idxUrl.endsWith("/") ? "realms/index.json" : "/realms/index.json", idxUrl).href;
                }
                this.bootStatus = `Discovering universes from: ${idxUrl.split("/").slice(-2).join("/")}...`;
                console.log(`[Core Harness] Discovering remote realms from index: ${idxUrl}`);
                if (realmManager) {
                  const discovered = await realmManager.discoverFromIndex(idxUrl);
                  registeredRealmIds.push(...discovered);
                }
              } catch (err) {
                console.warn(`[Core Harness] Failed discovery from index ${idxTarget}:`, err);
              }
            }

            // 4c. Polymorphic Ingestion for ?realm= targets
            for (const target of dynamicTargets) {
              try {
                const targetUrl = new URL(target, window.location.href).href;
                this.bootStatus = `Inspecting payload: ${targetUrl.split("/").pop()}...`;
                console.log(`[Core Harness] Inspecting dynamic target from ${targetUrl}`);

                const resp = await fetch(targetUrl);
                if (!resp.ok) {
                  throw new Error(`HTTP ${resp.status} fetching ${targetUrl}`);
                }
                const payload = await resp.json();

                if (Array.isArray(payload) && realmManager) {
                  // Payload is an index list (e.g. index.json passed to ?realm=)
                  this.bootStatus = `Discovering universes from list: ${targetUrl}...`;
                  const discovered = await realmManager.discoverFromIndex(targetUrl);
                  registeredRealmIds.push(...discovered);
                } else {
                  // Check if payload is a Realm Descriptor
                  const isRealmDescriptor = payload && payload.id && (
                    Array.isArray(payload.bundles) ||
                    Array.isArray(payload.extends) ||
                    payload.seedData ||
                    payload.domainObjects ||
                    payload.startupFlow ||
                    payload.recognizedSurrogates
                  );

                  if (isRealmDescriptor && realmManager) {
                    this.bootStatus = `Registering realm: ${payload.title || payload.id}...`;
                    console.log(`[Core Harness] Admitting composite realm '${payload.id}' from ${targetUrl}`);
                    await realmManager.registerRealm(payload, { baseUrl: targetUrl });
                    registeredRealmIds.push(payload.id);
                  } else {
                    // Standard Pandino bundle manifest
                    this.bootStatus = `Admitting external bundle: ${targetUrl.split("/").pop()}...`;
                    console.log(`[Core Harness] Admitting external bundle manifest from ${targetUrl}`);
                    const b = await context.installBundle(targetUrl);
                    if (
                      b.state === 2 || b.state === 4 ||
                      (b.getState && b.getState() < 32)
                    ) {
                      await b.start();
                      console.log(`[Core Harness] Bundle started: ${b.symbolicName || targetUrl}`);
                    }
                  }
                }
              } catch (err) {
                console.warn(`[Core Harness] Non-fatal error loading dynamic target ${target}:`, err);
              }
            }

            // 4c. Auto-switch to newly registered realm if requested
            const switchParam = queryParams.get("switch");
            if (realmManager && (switchParam === "true" || switchParam === "" || (switchParam && registeredRealmIds.includes(switchParam)))) {
              const targetRealmId = (switchParam && switchParam !== "true") ? switchParam : registeredRealmIds[0];
              if (targetRealmId) {
                try {
                  this.bootStatus = `Transitioning into universe '${targetRealmId}'...`;
                  console.log(`[Core Harness] Auto-switching to realm '${targetRealmId}'`);
                  await realmManager.switchRealm(targetRealmId);
                } catch (err) {
                  console.warn(`[Core Harness] Failed to auto-switch to realm '${targetRealmId}':`, err);
                }
              }
            }

            this.kernelReady = true;
            Alpine.store("platform").kernelReady = true;
          } catch (err) {
            this.error = err.message;
          }
        },
      }));

      Alpine.start();
    </script>
  </body>
</html>
