<div class="flex justify-center h-full">
    <div
        class="w-full max-w-sm bg-gray-900 rounded-3xl overflow-hidden shadow-xl border-4 border-gray-800 relative"
        style="height: 700px"
    >
        <!-- Phone Bezel/Header -->
        <div
            class="absolute top-0 w-full h-8 bg-gray-800 flex justify-center items-center z-10"
        >
            <div class="w-16 h-4 bg-black rounded-b-xl"></div>
        </div>

        <!-- Screen Content -->
        <div class="bg-gray-100 h-full overflow-y-auto pt-10 pb-20 relative">
            <!-- Store Image Simulation -->
            <div class="w-full">
                <!-- Fallback if images missing, simulate structure -->
                <div
                    class="bg-blue-600 h-40 flex items-center justify-center text-white"
                >
                    <h2 class="text-2xl font-bold">Store</h2>
                </div>

                <div class="p-4 grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded shadow h-32"></div>
                    <div class="bg-white p-4 rounded shadow h-32"></div>

                    <!-- The Clickable Card -->
                    <div
                        class="bg-white p-2 rounded shadow cursor-pointer border-2 border-transparent hover:border-blue-500 transition"
                        @click="loadStep('step4')"
                    >
                        <div
                            class="h-20 bg-gradient-to-r from-blue-400 to-blue-600 rounded mb-2"
                        >
                        </div>
                        <p class="text-xs font-bold text-center">
                            Business Virtual Card
                        </p>
                    </div>

                    <div class="bg-white p-4 rounded shadow h-32"></div>
                </div>
            </div>

            <!-- Absolute Bottom Menu -->
            <div
                class="absolute bottom-0 w-full h-16 bg-white border-t flex justify-around items-center"
            >
                <div class="flex flex-col items-center text-gray-400">
                    <i class="fas fa-home"></i>
                    <span class="text-xs">Home</span>
                </div>
                <div class="flex flex-col items-center text-blue-600">
                    <i class="fas fa-compass"></i>
                    <span class="text-xs">Discover</span>
                </div>
                <div class="flex flex-col items-center text-gray-400">
                    <i class="fas fa-user"></i>
                    <span class="text-xs">Profile</span>
                </div>
            </div>
        </div>
    </div>
</div>
