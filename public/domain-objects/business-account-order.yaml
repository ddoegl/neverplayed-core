id: business-account-order
label: Business Account Order
domainObject:
  strategyId: ACCOUNT_ORDER_STRATEGY
  label: Business Account Order
  properties:
    "Product": "Business Bank Account"
    "Status": "Draft"
  actions:
    - id: view
      label: Open Flow
      icon: fas fa-university

permissionKeys:
  BUSINESS_VIEW:
    id: BUSINESS_VIEW
    label: "business:view"
    value: "business:view"

features:
  BUSINESS_FLOWS:
    id: BUSINESS_FLOWS
    label: "business:flows"
    description: "Access to Business Atomic Flows"
    keys:
      - BUSINESS_VIEW

capabilities:
  - id: BUSINESS_USER
    operator: "OR"
    matchers:
      - type: "matchRole"
        value: "ADMINISTRATOR"
      - type: "matchRole"
        value: "LEGALREPS"
    features:
      - id: "BUSINESS_FLOWS"
        keys:
          - BUSINESS_VIEW

guards:
  - id: BUSINESS_VIEW
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "BUSINESS_FLOWS"
        keys:
          - BUSINESS_VIEW

ui:
  initialStep: step_init
  steps:
    step_init:
      order: 1
      title: "Select License Member"
      parts:
        intro:
          type: "text"
          value: "Please select the customer from license **${this.activeLicense.id}** for which you want to open a business account."
        member_select:
          kind: "select-input"
          id: "selectedMemberId"
          label: "License Member"
          optionSource: "${this.currentMembers}"
        next_btn:
          kind: "command-button"
          variant: "primary"
          label: "Continue"
          call: "NEXT_STEP"

    step_fellow:
      order: 2
      title: "Select Card Holder"
      parts:
        intro:
          type: "text"
          value: "Choose a fellow from **${this.selectedMemberId}** who will hold the new business card."
        fellow_select:
          kind: "select-input"
          id: "fellowId"
          label: "Account Signee"
          optionSource: "${this.currentFellows}"
        btn_row:
          type: "row"
          parts:
            back_btn:
              kind: "command-button"
              variant: "default"
              label: "Back"
              call: "PREV_STEP"
            next_btn:
              kind: "command-button"
              variant: "primary"
              label: "Configure Account"
              call: "NEXT_STEP"

    step_summary:
      order: 3
      title: "Order Summary"
      parts:
        summary:
          type: "text"
          value: |
            ### Almost done!
            You are about to order a **Business Account** for:
            - **License:** ${this.activeLicense.id}
            - **Member:** ${this.selectedMemberId}
            - **Holder:** ${this.fellowId}
        btn_row:
          type: "row"
          parts:
            back_btn:
              kind: "command-button"
              variant: "default"
              label: "Back"
              call: "PREV_STEP"
            submit_btn:
              kind: "command-button"
              variant: "success"
              label: "Place Order"
              call: "synthetic.case.create"
              params:
                caseTypeId: "business-account-order"
                companyId: "${this.selectedMemberId}"
                targetPersonId: "${this.fellowId}"
                successMessage: "Your order has been placed! A signing case has been created for ${this.selectedMemberId}. ✅"
                onSuccess: "REDIRECT"
                redirectFlowId: "cases"
                redirectParams:
                  companyId: "${this.selectedMemberId}"

caseTypes:
  business-account-order:
    id: "business-account-order"
    name: "Business Account Enrollment"
    strategyId: "JOINT_SIGNATURE"
    description: "Enrollment for a business account, requiring signatures from Company LRs and the Individual."

actions:
  synthetic.case.create:
    type: "LOCAL"
    params:
      caseTypeId: "business-account-order"
      companyId: "${this.selectedMemberId}"
      targetPersonId: "${this.fellowId}"
      successMessage: "Your order has been placed! A signing case has been created for ${this.selectedMemberId}. ✅"
      onSuccess: "REDIRECT"
      redirectFlowId: "cases"
      redirectParams:
        companyId: "${this.selectedMemberId}"
