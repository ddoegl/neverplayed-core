id: sample-do
label: Sample Remote DO
domainObject:
  strategyId: LOCAL_STRATEGY
  label: Remote Strategy
  limesPrefix: REMOTE
  properties:
    "Source": "Server"
    "Version": "1.0.0"
  actions:
    - id: view
      label: View Details
      icon: fas fa-eye
    - id: edit
      label: Edit Metadata
      icon: fas fa-edit

permissionKeys:
  REMOTE_VIEW:
    id: REMOTE_VIEW
    label: "remote:view"
    value: "remote:view"
  REMOTE_EDIT:
    id: REMOTE_EDIT
    label: "remote:edit"
    value: "remote:edit"

features:
  REMOTE_ATOMIC:
    id: REMOTE_ATOMIC
    label: "remote:atomic"
    description: "Access to Atomic Remote features"
    keys:
      - REMOTE_VIEW
      - REMOTE_EDIT

capabilities:
  - id: REMOTE_WORLD_ADMIN
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "REMOTE_ATOMIC"
        keys:
          - REMOTE_VIEW
          - REMOTE_EDIT

guards:
  - id: REMOTE_VIEW
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "REMOTE_ATOMIC"
        keys:
          - REMOTE_VIEW
  - id: REMOTE_EDIT
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "REMOTE_ATOMIC"
        keys:
          - REMOTE_EDIT

ui:
  initialStep: step_intro
  steps:
    step_intro:
      order: 1
      title: "Atomic vNext: Multi-step Flow"
      parts:
        welcome_msg:
          type: "text"
          value: "Welcome to the future of Atomic UI! This flow now uses native **Shoelace** Web Components and is fully aligned with **W3C uiSpec**."
        next_btn:
          kind: "command-button"
          variant: "primary"
          label: "Explore Features"
          call: "NEXT_STEP"
          pulse: true

    step_input:
      order: 2
      title: "Standardized Data Entry"
      parts:
        instruction:
          type: "text"
          value: "Please enter a User ID. The input below is a native '<sl-input>' wrapped in our 'atomic-input' contract."
        user_id:
          kind: "text-input"
          label: "Global User ID"
          placeholder: "e.g. 7"
          value: "1"
        nav_row:
          type: "row"
          parts:
            back_btn:
              kind: "command-button"
              variant: "default"
              label: "Back"
              call: "PREV_STEP"
            next_btn:
              kind: "command-button"
              variant: "success"
              label: "Confirm ID"
              call: "NEXT_STEP"

    step_confirm:
      order: 3
      title: "Action Orchestration"
      parts:
        summary:
          type: "text"
          value: "You have selected User ID: **${this.user_id}**. Ready to dispatch the magic greeting?"
        action_btn:
          kind: "command-button"
          variant: "danger"
          label: "Send Magic Greeting"
          call: "synthetic.server.sample-do"
          params:
            userId: "${this.user_id}"
        result_area:
          type: "result"
        back_btn:
          kind: "command-button"
          variant: "neutral"
          label: "Modify ID"
          call: "PREV_STEP"

actions:
  synthetic.server.sample-do:
    type: "API"
    params:
      endpoint: "https://jsonplaceholder.typicode.com/users/${userId}"
      method: "GET"
