<div
  class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden border border-gray-200"
>
  <div class="p-8">
    <div class="flex items-center space-x-6 mb-8">
      <div
        class="w-24 h-24 rounded-full bg-teal-100 flex items-center justify-center text-teal-600 font-bold text-3xl"
      >
        <i class="fas fa-building"></i>
      </div>
      <div>
        <h2
          class="text-3xl font-bold text-gray-800"
          x-text="selectedCompany ? selectedCompany.name : ''"
        >
        </h2>
        <div class="text-gray-500 mt-1 flex items-center space-x-2">
          <i class="fas fa-id-card"></i>
          <span x-text="selectedCompany?.regNr || 'No registration info'"></span
          >
        </div>
        <div class="text-gray-500 mt-1 flex items-center space-x-2">
          <i class="fas fa-fingerprint text-sm"></i>
          <span
            class="font-mono text-sm"
            x-text="selectedCompany?.id"
          ></span>
        </div>
      </div>
    </div>

    <template x-if="selectedCompany?.description">
      <div
        class="mb-8 p-4 bg-gray-50 rounded-lg text-gray-700 italic border-l-4 border-teal-400"
      >
        <span x-text="selectedCompany.description"></span>
      </div>
    </template>

    <!-- Setup Status -->
    <div class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm">
      <p
        class="text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold"
      >
        Address / Location
      </p>
      <div class="text-gray-700 text-sm mt-2">
        <template x-if="selectedCompany?.address">
          <div class="flex items-start">
            <i class="fas fa-map-marker-alt text-red-500 mt-1 mr-2"></i>
            <span x-text="selectedCompany.address"></span>
          </div>
        </template>
        <template x-if="!selectedCompany?.address">
          <span class="italic text-gray-400">No address provided</span>
        </template>
      </div>
    </div>

    <div class="border-t border-gray-200 py-6">
      <h3 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
        <i class="fas fa-server mr-2 text-gray-400"></i> Backend Configuration
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4">
        <!-- Tenant Info -->
        <div
          class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm relative overflow-hidden"
        >
          <div
            class="absolute top-0 left-0 w-1 h-full"
            :class="linkedTenants.length > 0 ? 'bg-green-400' : 'bg-red-400'"
          >
          </div>
          <p
            class="text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold"
          >
            Customer of Tenant
          </p>

          <template x-if="linkedTenants.length > 0">
            <div>
              <template x-for="tenant in linkedTenants" :key="tenant.id">
                <div class="mb-2 last:mb-0">
                  <div
                    class="font-bold text-gray-800 text-lg mb-1"
                    x-text="tenant.name"
                  >
                  </div>
                  <div
                    class="text-xs text-gray-400 font-mono bg-gray-200 px-2 py-1 rounded inline-block"
                    x-text="'ID: ' + tenant.id"
                  >
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="linkedTenants.length === 0">
            <div class="flex items-center text-gray-500 py-2">
              <i class="fas fa-unlink mr-2 text-gray-400"></i>
              <span class="italic text-sm">Not linked to any tenant</span>
            </div>
          </template>
        </div>

        <!-- License Status -->
        <div
          class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm relative overflow-hidden"
        >
          <div
            class="absolute top-0 left-0 w-1 h-full"
            :class="memberLicenses.length > 0 ? 'bg-blue-400' : 'bg-gray-400'"
          >
          </div>
          <p
            class="text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold"
          >
            License Holder / Member
          </p>
          <div class="mt-2 space-y-2">
            <template x-if="memberLicenses.length > 0">
              <template
                x-for="lic in memberLicenses"
                :key="lic.id"
              >
                <div class="flex items-start">
                  <i class="fas fa-certificate text-blue-500 mt-1 mr-2"></i>
                  <div>
                    <div
                      class="font-bold text-gray-800"
                      x-text="lic.id"
                    >
                    </div>
                    <div class="text-xs text-gray-500 mt-1">
                      <span
                        x-text="(lic.USERS || []).length + ' linked users'"
                      ></span>
                    </div>
                  </div>
                </div>
              </template>
            </template>
            <template x-if="memberLicenses.length === 0">
              <div class="flex items-center text-gray-500 py-2">
                <i class="fas fa-ban mr-2 text-gray-400"></i>
                <span class="italic text-sm">No active licenses</span>
              </div>
            </template>
          </div>
        </div>

        <!-- License Member -->
        <div
          class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm relative overflow-hidden"
        >
          <div
            class="absolute top-0 left-0 w-1 h-full"
            :class="memberLicenses.length > 0 ? 'bg-indigo-400' : 'bg-gray-400'"
          >
          </div>
          <p
            class="text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold"
          >
            License Member
          </p>
          <div class="mt-2 space-y-2">
            <template x-if="memberLicenses.length > 0">
              <template
                x-for="lic in memberLicenses"
                :key="lic.id"
              >
                <div class="flex items-start">
                  <i class="fas fa-users-cog text-indigo-500 mt-1 mr-2"></i>
                  <div>
                    <div
                      class="font-bold text-gray-800"
                      x-text="lic.id"
                    >
                    </div>
                  </div>
                </div>
              </template>
            </template>
            <template x-if="memberLicenses.length === 0">
              <div class="flex items-center text-gray-500 py-2">
                <i class="fas fa-ban mr-2 text-gray-400"></i>
                <span class="italic text-sm">Member of no licenses</span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Legal Representatives -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <h3 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
          <i class="fas fa-user-tie mr-2 text-gray-400"></i> Legal
          Representatives
        </h3>

        <div
          class="bg-gray-50 rounded-lg border border-gray-100 shadow-sm overflow-hidden"
        >
          <template
            x-if="selectedCompany?.legalRepresentatives && selectedCompany.legalRepresentatives.length > 0"
          >
            <ul class="divide-y divide-gray-200">
              <template
                x-for="rep in selectedCompany.legalRepresentatives"
                :key="rep.personId + '-' + rep.role"
              >
                <li
                  class="p-4 flex items-center justify-between hover:bg-gray-100 transition-colors"
                >
                  <div class="flex items-center space-x-4">
                    <div
                      class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold"
                    >
                      <span
                        x-text="
                                                (() => {
                                                    const p = persons.find(p => p.id === rep.personId);
                                                    return p ? p.firstname[0] + p.lastname[0] : '?';
                                                })()
                                            "
                      ></span>
                    </div>
                    <div>
                      <div
                        class="font-bold text-gray-800"
                        x-text="
                                                (() => {
                                                    const p = persons.find(p => p.id === rep.personId);
                                                    return p ? p.firstname + ' ' + p.lastname : 'Unknown Person';
                                                })()
                                            "
                      >
                      </div>
                      <div
                        class="text-xs text-gray-500 font-mono mt-0.5"
                        x-text="'ID: ' + rep.personId"
                      >
                      </div>
                    </div>
                  </div>
                  <span
                    class="px-3 py-1 rounded-full text-xs font-semibold"
                    :class="
                                            rep.role === 'owner' ? 'bg-purple-100 text-purple-800 border border-purple-200' :
                                            rep.role === 'managing-partner' ? 'bg-indigo-100 text-indigo-800 border border-indigo-200' :
                                            rep.role === 'managing-director' ? 'bg-blue-100 text-blue-800 border border-blue-200' :
                                            'bg-teal-100 text-teal-800 border border-teal-200'
                                        "
                    x-text="
                                            rep.role === 'owner' ? 'Owner' :
                                            rep.role === 'managing-partner' ? 'Managing partner' :
                                            rep.role === 'managing-director' ? 'Managing Director' :
                                            rep.role === 'authorized-signatory' ? 'Authorized Signatory' : rep.role
                                    "
                  ></span>
                </li>
              </template>
            </ul>
          </template>
          <template
            x-if="!(selectedCompany?.legalRepresentatives && selectedCompany.legalRepresentatives.length > 0)"
          >
            <div
              class="p-8 text-center text-gray-500 italic flex flex-col items-center"
            >
              <i class="fas fa-users-slash text-3xl text-gray-300 mb-3"></i>
              No legal representatives established
            </div>
          </template>
        </div>
      </div>
    </div>

    <div
      class="mt-8 flex justify-between items-center border-t border-gray-200 pt-6"
    >
      <button
        @click="loadStep('dashboard')"
        class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors font-medium"
      >
        <i class="fas fa-arrow-left mr-2"></i> Back
      </button>
    </div>
  </div>
</div>
