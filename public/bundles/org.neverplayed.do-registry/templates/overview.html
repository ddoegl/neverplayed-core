<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-slate-800">Domain Object Registry</h1>
    <div class="flex space-x-2">
      <button
        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-500 transition"
        @click="registry.ingestFromServer()"
      >
        <i class="fas fa-cloud-download-alt mr-2"></i>Ingest from Server
      </button>
      <button
        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-500 transition shadow"
        @click="registry.createDomainObjectVisual()"
      >
        <i class="fas fa-magic mr-2"></i>New DO (Visual)
      </button>
      <button
        class="bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-600 transition shadow"
        @click="registry.createDomainObjectYAML()"
      >
        <i class="fas fa-code mr-2"></i>New DO (YAML)
      </button>
      <button
        class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition"
        @click="registry.openDOStrategiesEditor()"
      >
        <i class="fas fa-edit mr-2"></i>Edit Strategies
      </button>
      <button
        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-500 transition"
        @click="registry.openDOInstancesEditor()"
      >
        <i class="fas fa-cubes mr-2"></i>Edit Instances
      </button>
    </div>
  </div>
  
  <!-- Session Warning -->
  <template x-if="!registry.sessionAvailable">
    <div class="mb-6 p-4 bg-amber-50 border-l-4 border-amber-500 rounded-r-lg shadow-sm flex items-center justify-between">
      <div class="flex items-center">
        <i class="fas fa-exclamation-triangle text-amber-500 mr-3 text-xl"></i>
        <div>
          <h3 class="font-bold text-amber-800">Session Service Offline</h3>
          <p class="text-sm text-amber-700">Identity-based filtering and admin guards are temporarily inactive. System peeking is restricted during transition.</p>
        </div>
      </div>
      <div class="animate-pulse flex space-x-1">
        <div class="h-2 w-2 bg-amber-400 rounded-full"></div>
        <div class="h-2 w-2 bg-amber-400 rounded-full"></div>
        <div class="h-2 w-2 bg-amber-400 rounded-full"></div>
      </div>
    </div>
  </template>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <!-- Strategies Section -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
        <h2 class="text-xl font-bold text-slate-700">DO Execution Engines (System)</h2>
      </div>
      <div class="p-6">
        <!-- Loading Spinner -->
        <div x-show="registry.loadingData" class="flex flex-col items-center justify-center p-8 space-y-4">
          <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
          <span class="text-sm text-slate-400 font-medium italic">Syncing Engines...</span>
        </div>

        <template x-if="!registry.loadingData">
          <div>
            <template x-for="(strat, key) in registry.parsedDOStrategies" :key="key">
              <div class="mb-4 p-4 border border-slate-100 rounded-lg hover:bg-slate-50 transition">
                <div class="flex items-center justify-between mb-2">
                  <span class="font-bold text-indigo-600" x-text="strat.label"></span>
                  <code class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600" x-text="strat.id"></code>
                </div>
                <p class="text-sm text-slate-600" x-text="strat.description"></p>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- Instances Section -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-700">Persisted Instances (Data)</h2>
        <template x-if="registry.isRegistryAdmin && registry.isRegistryAdmin()">
          <div class="flex items-center space-x-2 bg-white px-2 py-1 rounded-md border border-slate-200 shadow-sm">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Show All</span>
            <button 
              @click="registry.toggleShowAllDOs()"
              class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2"
              :class="registry.showAllDOs ? 'bg-indigo-600' : 'bg-slate-200'"
              role="switch"
            >
              <span class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out" :class="registry.showAllDOs ? 'translate-x-4' : 'translate-x-0'"></span>
            </button>
          </div>
        </template>
      </div>
      <div class="p-6">
        <!-- Loading Spinner -->
        <div x-show="registry.loadingData" class="flex flex-col items-center justify-center p-8 space-y-4">
          <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
          <span class="text-sm text-slate-400 font-medium italic">Hydrating Instances...</span>
        </div>

        <template x-if="!registry.loadingData">
          <div>
            <template x-for="inst in (registry.showAllDOs ? Object.values(registry.parsedDOInstances || {}) : (Array.isArray(registry.currentDOs) ? registry.currentDOs : []))" :key="inst.id">
              <div class="mb-4 p-4 border border-slate-100 rounded-lg hover:bg-slate-50 transition border-l-4 border-l-blue-500">
                <div class="flex items-center justify-between mb-2">
                  <span class="font-bold text-slate-800" x-text="inst.label"></span>
                  <span class="text-xs font-mono text-slate-400" x-text="inst.id"></span>
                </div>
                <div class="flex items-center space-x-2 mb-2" x-show="inst.ownerId">
                  <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-mono uppercase tracking-tighter" x-text="'Owner: ' + inst.ownerId"></span>
                </div>
                <p class="text-sm text-slate-500 italic mb-2" x-text="inst.description"></p>
                <div class="flex flex-wrap gap-2 mb-4">
                  <template x-for="(val, prop) in inst.properties" :key="prop">
                    <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded-full border border-indigo-100">
                      <span x-text="prop"></span>: <span class="font-bold" x-text="val"></span>
                    </span>
                  </template>
                </div>
                <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-100">
                  <template x-for="action in (inst.allowedActions || [])" :key="action.id">
                    <button class="flex items-center text-xs font-semibold px-3 py-1.5 rounded-md bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition shadow-sm" @click="registry.handleAction(action, inst)">
                      <i :class="action.icon + ' mr-1.5 text-indigo-500'"></i>
                      <span x-text="action.label"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- Domain Object Specifications Section -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
        <h2 class="text-xl font-bold text-slate-700">DO Blueprints (Design & Deploy)</h2>
      </div>
      <div class="p-6">
        <template x-if="registry.domainObjectSpecs?.length === 0">
          <div class="text-sm text-slate-500 italic p-4 text-center border border-dashed border-slate-300 rounded">
            No local specifications found. Create one above!
          </div>
        </template>
        <template x-for="spec in registry.domainObjectSpecs" :key="spec.id">
          <div class="mb-4 p-4 border border-slate-100 rounded-lg hover:bg-slate-50 transition border-l-4 border-l-emerald-500">
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-slate-800" x-text="spec.label"></span>
              <span class="text-xs font-mono text-slate-400" x-text="spec.id"></span>
            </div>
            <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-100">
              <button class="flex items-center text-xs font-semibold px-3 py-1.5 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-sm" @click="registry.instantiateDO(spec.id)">
                <i class="fas fa-play mr-1.5"></i>
                Instantiate
              </button>
              <button class="flex items-center text-xs font-semibold px-3 py-1.5 rounded-md bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition shadow-sm" @click="registry.editDomainObjectVisual(spec.id)">
                <i class="fas fa-pen-nib mr-1.5 text-indigo-500"></i>
                Edit Visual
              </button>
              <button class="flex items-center text-xs font-semibold px-3 py-1.5 rounded-md bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition shadow-sm" @click="registry.editDomainObjectYAML(spec.id)">
                <i class="fas fa-code mr-1.5 text-indigo-500"></i>
                Edit YAML
              </button>
              <template x-if="spec._isPersisted && !spec._isBundleBlueprint">
                <button class="flex items-center text-xs font-semibold px-3 py-1.5 rounded-md bg-white border border-red-100 text-red-600 hover:bg-red-50 transition shadow-sm ml-auto" title="Archive Blueprint" @click="registry.handleAction({ id: 'blueprint.archive' }, spec)">
                    <i class="fas fa-trash-alt"></i>
                </button>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- Visual Editor Modal Overlay -->
  <template x-if="registry.visualEditorData">
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-6" @click.self="registry.closeVisualEditor()">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-[70vw] max-h-[90vh] flex flex-col overflow-hidden animate-fade-in">
        <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
          <h2 class="text-xl font-bold text-slate-800"><i class="fas fa-layer-group text-indigo-500 mr-2"></i>Visual DO Editor</h2>
          <button @click="registry.closeVisualEditor()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto bg-slate-50/50">
          <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 mb-6 space-y-4">
            <h3 class="text-lg font-semibold text-slate-700 border-b pb-2">Basic Info & Properties</h3>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Object ID (slug)</label><input type="text" x-model="registry.visualEditorData.id" class="w-full border-slate-300 rounded-md text-sm p-2 bg-slate-50" /></div>
              <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Display Label</label><input type="text" x-model="registry.visualEditorData.label" class="w-full border-slate-300 rounded-md text-sm p-2 bg-slate-50" /></div>
              <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Strategy ID</label><input type="text" x-model="registry.visualEditorData.domainObject.strategyId" class="w-full border-slate-300 rounded-md text-sm p-2 bg-slate-50 font-mono" /></div>
            </div>
            <div class="mt-4 pt-4 border-t border-slate-100">
              <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Extended Properties</label>
              <template x-for="(prop, pIdx) in registry.visualEditorData.properties" :key="pIdx">
                <div class="flex gap-2 mb-2 items-center">
                  <input type="text" x-model="prop.key" class="w-1/3 border-slate-300 rounded px-2 py-1 text-xs font-mono bg-slate-50" placeholder="Key" />
                  <input type="text" x-model="prop.value" class="flex-1 border-slate-300 rounded px-2 py-1 text-xs bg-slate-50" placeholder="Value" />
                  <button @click="registry.visualEditorData.properties.splice(pIdx, 1)" class="text-slate-400 hover:text-red-500 px-2"><i class="fas fa-times"></i></button>
                </div>
              </template>
              <button @click="registry.visualEditorData.properties.push({key: '', value: ''})" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold"><i class="fas fa-plus mr-1"></i> Add Property</button>
            </div>
          </div>
          <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 mb-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2"><h3 class="text-lg font-semibold text-slate-700">Actions</h3><button @click="registry.visualEditorData.actions = registry.visualEditorData.actions || []; registry.visualEditorData.actions.push({ id: 'new-action', label: 'New Action', icon: 'fas fa-play' })" class="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded hover:bg-indigo-200">Add Action</button></div>
            <template x-for="(act, aIdx) in registry.visualEditorData.actions" :key="aIdx">
              <div class="border border-slate-200 rounded p-3 mb-2 bg-slate-50/50">
                <div class="flex gap-2 mb-2"><input type="text" x-model="act.id" class="w-1/3 border-slate-300 rounded px-2 py-1 text-xs font-mono" /><input type="text" x-model="act.label" class="flex-1 border-slate-300 rounded px-2 py-1 text-xs" /><button @click="registry.visualEditorData.actions.splice(aIdx, 1)" class="text-red-400 px-2"><i class="fas fa-trash"></i></button></div>
              </div>
            </template>
          </div>
          <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4 border-b pb-2"><h3 class="text-lg font-semibold text-slate-700">UI Flow Steps</h3><button @click="registry.visualEditorData.steps.push({ id: 'step_' + registry.visualEditorData.steps.length, title: 'New Step', parts: [] })" class="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded hover:bg-indigo-200">Add Step</button></div>
            <template x-for="(step, sIdx) in registry.visualEditorData.steps" :key="sIdx">
              <div class="border border-slate-200 rounded-lg mb-4 overflow-hidden">
                <div class="bg-slate-100 p-3 flex gap-3 items-center"><input type="text" x-model="step.id" class="w-32 border-slate-300 rounded px-2 py-1 text-xs font-mono" /><input type="text" x-model="step.title" class="flex-1 border-slate-300 rounded px-2 py-1 text-xs" /><button @click="registry.visualEditorData.steps.splice(sIdx, 1)" class="text-red-400 px-2"><i class="fas fa-trash"></i></button></div>
                <div class="p-4 bg-white"><button @click="step.parts.push({ id: 'part_' + step.parts.length, type: 'text', value: 'New content' })" class="text-xs text-indigo-600 font-semibold mb-2">Add Part</button>
                    <template x-for="(part, pIdx) in step.parts" :key="pIdx"><div class="flex gap-2 mb-2 p-2 border border-slate-100 rounded bg-slate-50/30"><input type="text" x-model="part.id" class="w-24 border-slate-200 rounded text-[10px] font-mono" /><select x-model="part.type" class="w-24 border-slate-200 rounded text-[10px]"><option value="text">Text</option><option value="row">Row</option></select><textarea x-show="part.type === 'text'" x-model="part.value" class="flex-1 border-slate-200 rounded text-[10px] h-12"></textarea><button @click="step.parts.splice(pIdx, 1)" class="text-red-300"><i class="fas fa-times"></i></button></div></template>
                </div>
              </div>
            </template>
          </div>
        </div>
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-3 shrink-0">
          <button @click="registry.closeVisualEditor()" class="px-4 py-2 rounded text-slate-600 hover:bg-slate-200 transition">Cancel</button>
          <button @click="registry.saveVisualEditor()" class="px-4 py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700 transition font-bold"><i class="fas fa-save mr-2"></i> Save Domain Object</button>
        </div>
      </div>
    </div>
  </template>
</div>
