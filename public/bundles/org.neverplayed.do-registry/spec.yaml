id: about-do-registry
label: About Domain Object Registry
icon: fas fa-archive

domainObject:
  strategyId: LOCAL_STRATEGY
  persistence:
    tier: local
    bucket: do-registry
description: Central service for managing domain object blueprints, strategies, and instances.

ui:
  dashboard: false
  sidebar: false
  steps:
    intro:
      title: About the Registry
      parts:
        explainer:
          type: text
          value: |
            The Domain Object Registry is the core ontological service of the Never Played Realm Framework.
            It manages the lifecycle of **Specifications (Blueprints)**, **Strategies (Execution Engines)**, and **Instances**.
            Bundles can register themselves as atomic components, and the registry provides the bridge between
            design-time editors and runtime data gravity.
        start_button:
          kind: command-button
          label: "Hello Registry"
          icon: "fas fa-rocket"
          action:
            call: ui:alert
            params: { message: "Hello Registry" }
