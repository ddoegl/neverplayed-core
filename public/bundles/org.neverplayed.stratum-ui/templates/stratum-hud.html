<div id="stratum-hud-root" 
     x-data="stratumHUD" 
     class="fixed bottom-6 right-6 z-[100] flex flex-col items-end space-y-3 pointer-events-none"
     x-show="visible"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-10 scale-95"
     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
     x-cloak>
    
    <!-- Facet Grid (The HUD) -->
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-4 shadow-2xl w-80 pointer-events-auto overflow-hidden relative">
        <!-- Decoration: Scanning line animation -->
        <div class="absolute inset-0 bg-gradient-to-b from-cyan-500/10 to-transparent h-px w-full animate-pulse top-0"></div>

        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-2">
            <div class="flex items-center space-x-2">
                <i class="fas fa-satellite-dish text-cyan-400 text-sm animate-pulse"></i>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Stratum Scanner v1.0</span>
            </div>
            <div class="flex space-x-1">
                <div class="w-1 h-1 rounded-full bg-cyan-500/50"></div>
                <div class="w-1 h-1 rounded-full bg-cyan-500/30"></div>
            </div>
        </div>

        <!-- Facet List -->
        <div class="space-y-4">
            <template x-for="facet in facetList" :key="facet.label">
                <div class="group">
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center space-x-2">
                            <i :class="facet.icon" class="text-slate-500 text-[10px]"></i>
                            <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest" x-text="facet.label"></span>
                        </div>
                        <span class="text-[8px] font-mono text-slate-600" x-text="facet.sub"></span>
                    </div>
                    <div class="bg-slate-950/50 border border-slate-800/50 rounded-lg px-3 py-2 flex items-center justify-between group-hover:border-cyan-500/30 transition-colors">
                        <span class="text-xs font-mono text-slate-200 truncate" x-text="facet.value"></span>
                        <div class="w-1.5 h-1.5 rounded-full" :class="facet.color || 'bg-cyan-500'"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Tier Indicator -->
        <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full animate-ping" :class="tierColor.bg"></div>
                <span class="text-[10px] font-bold uppercase tracking-widest" :class="tierColor.text" x-text="tier"></span>
            </div>
            <button @click="copyURI" class="text-[10px] text-slate-500 hover:text-cyan-400 transition-colors flex items-center space-x-1">
                <i class="fas fa-link"></i>
                <span>Copy URI</span>
            </button>
        </div>
    </div>

    <!-- Mobility Bar (Minimalist) -->
    <div class="group pointer-events-auto flex items-center space-x-2">
        <div class="bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-full px-4 py-1.5 shadow-lg flex items-center space-x-3 max-w-0 overflow-hidden group-hover:max-w-md transition-all duration-500">
             <input type="text" 
                    placeholder="np://jump-to-stratum..." 
                    class="bg-transparent border-none text-[10px] font-mono text-cyan-100 placeholder-slate-600 focus:ring-0 w-48"
                    x-model="jumpTarget"
                    @keyup.enter="jump">
             <button @click="jump" class="text-cyan-400 hover:text-cyan-300">
                 <i class="fas fa-arrow-right text-[10px]"></i>
             </button>
        </div>
        <div @click="let e = Alpine.store('explorer'); if(e) { e.visible = true; e.refreshTopology(); }"
             class="w-10 h-10 rounded-full bg-slate-900 border border-cyan-500/20 flex items-center justify-center text-cyan-400 cursor-pointer hover:bg-slate-800 hover:border-cyan-400/50 transition-all shadow-xl pointer-events-auto">
             <i class="fas fa-map-marked-alt text-sm"></i>
        </div>
    </div>
</div>
