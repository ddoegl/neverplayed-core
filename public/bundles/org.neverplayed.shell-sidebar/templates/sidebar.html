<div
  class="h-full flex flex-col bg-white overflow-hidden shadow-sm border-r border-slate-200 sidebar-transition group/sidebar relative"
  :class="{
        'w-64': state === 0,
        'w-16': state === 1,
        'w-4': state === 2
    }"
>
  <!-- Hidden Stage Overlay (Bezel Mode) -->
  <div
    x-show="state === 2"
    class="absolute inset-0 bg-slate-50 cursor-pointer hover:bg-slate-100 flex items-center justify-center transition-colors"
    @click="toggleCollapse()"
  >
    <div class="w-1 h-12 bg-slate-300 rounded-full opacity-50"></div>
  </div>

  <!-- Minimalist Toggle / Top Spacer (Visible in state 0 and 1) -->
  <div
    x-show="state !== 2"
    class="h-12 flex items-center justify-end px-4 relative shrink-0"
  >
    <button
      @click="toggleCollapse()"
      class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-50 hover:text-blue-600 transition-all"
      :class="state === 1 ? 'rotate-180' : ''"
    >
      <i class="fas fa-bars text-sm"></i>
    </button>
  </div>

  <!-- Platonic Staging Lobby: Realm Chooser -->
  <div
    x-show="isInLobby && state !== 2"
    class="flex-1 p-3 space-y-2 overflow-y-auto overflow-x-hidden"
  >
    <!-- Header (full width only) -->
    <div x-show="state === 0" class="px-1 mb-3">
      <p class="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Choose a Realm</p>
      <p class="text-[8px] text-slate-300 mt-0.5">You are in the staging lobby</p>
    </div>
    <div x-show="state === 1" class="flex justify-center mb-3">
      <i class="fas fa-door-open text-slate-300 text-sm"></i>
    </div>

    <template x-for="realm in availableRealms" :key="realm.id">
      <button
        @click="switchToRealm(realm.id)"
        class="w-full flex items-center p-3 rounded-xl text-slate-500
               hover:bg-blue-50 hover:text-blue-600 transition-all duration-200 group"
        :class="state === 1 ? 'justify-center' : 'space-x-3'"
        :title="state === 1 ? realm.title : ''"
      >
        <!-- Icon -->
        <div
          class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0
                 bg-slate-100 text-slate-400 transition-all duration-200
                 group-hover:bg-blue-600 group-hover:text-white group-hover:shadow-md group-hover:shadow-blue-200
                 group-hover:scale-110"
        >
          <i :class="(realm.icon || 'fas fa-globe') + ' text-sm'"></i>
        </div>

        <!-- Label -->
        <div
          x-show="state === 0"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 -translate-x-4"
          x-transition:enter-end="opacity-100 translate-x-0"
          class="flex flex-col items-start flex-1 min-w-0"
        >
          <span class="font-bold text-xs truncate" x-text="realm.title"></span>
          <span class="text-[9px] opacity-50 truncate font-mono" x-text="realm.id"></span>
        </div>

        <!-- Arrow -->
        <div x-show="state === 0" class="text-slate-300 group-hover:text-blue-400 transition-colors shrink-0">
          <i class="fas fa-chevron-right text-[9px]"></i>
        </div>
      </button>
    </template>

    <!-- Placeholder if no realms discovered yet -->
    <template x-if="availableRealms.length === 0">
      <div class="h-40 flex flex-col items-center justify-center text-slate-300 space-y-2 px-4 text-center">
        <i class="fas fa-compass text-2xl opacity-20 animate-spin" style="animation-duration:3s"></i>
        <span x-show="state === 0" class="text-[10px] uppercase font-medium">Discovering realms...</span>
      </div>
    </template>
  </div>

  <!-- Normal Flow Navigation (active realm) -->
  <nav
    x-show="!isInLobby && state !== 2"
    class="flex-1 p-3 space-y-2 overflow-y-auto overflow-x-hidden"
  >
    <template x-for="flow in flows" :key="flow.id">
      <button
        @click="launch(flow.id)"
        class="w-full flex items-center p-3 rounded-xl transition-all duration-300 group relative"
        :class="[
                    activeFlowId === flow.id ? 'bg-blue-50 text-blue-600 shadow-sm' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900',
                    state === 1 ? 'justify-center space-x-0' : 'space-x-3'
                ]"
        :title="state === 1 ? flow.title : ''"
      >
        <!-- Indicator -->
        <div
          x-show="activeFlowId === flow.id"
          class="absolute left-0 w-1 h-6 bg-blue-600 rounded-r-full"
        >
        </div>

        <!-- Icon Container -->
        <div
          class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 transition-all duration-300 group-hover:scale-110"
          :class="activeFlowId === flow.id ? 'bg-blue-600 text-white shadow-md shadow-blue-200' : 'bg-slate-100 text-slate-400 group-hover:bg-white group-hover:shadow-sm'"
        >
          <i :class="flow.icon + ' text-sm'"></i>
        </div>

        <!-- Label -->
        <div
          x-show="state === 0"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 -translate-x-4"
          x-transition:enter-end="opacity-100 translate-x-0"
          class="flex flex-col items-start flex-1 min-w-0"
        >
          <span class="font-bold text-xs truncate" x-text="flow.title"></span>
          <span
            class="text-[9px] opacity-60 uppercase tracking-tighter"
            x-text="flow.id.split('/').pop()"
          ></span>
        </div>

        <!-- Active Dot -->
        <div
          x-show="activeFlowId === flow.id && state === 0"
          class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-pulse"
        >
        </div>
      </button>
    </template>

    <!-- Placeholder if no flows -->
    <template x-if="flows.length === 0">
      <div
        class="h-40 flex flex-col items-center justify-center text-slate-300 space-y-2 px-4 text-center"
      >
        <i class="fas fa-layer-group text-2xl opacity-20"></i>
        <span x-show="state === 0" class="text-[10px] uppercase font-medium"
        >Scanning...</span>
      </div>
    </template>
  </nav>

  <!-- Footer Area (User) -->
  <div
    x-show="state !== 2"
    class="p-3 border-t border-slate-100 bg-slate-50/30 shrink-0"
  >
    <div
      class="flex items-center p-2 rounded-xl bg-white border border-slate-100 shadow-sm relative group cursor-pointer hover:border-blue-200 transition-colors"
      :class="state === 1 ? 'justify-center space-x-0' : 'space-x-3'"
    >
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shrink-0 shadow-sm relative"
      >
        <i class="fas fa-user text-xs"></i>

        <!-- Sovereign Indicator Overlay -->
        <template x-if="$session.currentUser.isCarried">
          <div
            class="absolute -top-1 -right-1 w-3 h-3 bg-amber-500 rounded-full flex items-center justify-center border border-white"
          >
            <i class="fas fa-ghost text-[6px] text-white"></i>
          </div>
        </template>
        <template x-if="$session.currentUser.isMaterialized">
          <div
            class="absolute -top-1 -right-1 w-3 h-3 bg-indigo-500 rounded-full flex items-center justify-center border border-white"
          >
            <i class="fas fa-mask text-[6px] text-white"></i>
          </div>
        </template>
      </div>
      <div
        x-show="state === 0"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        class="flex flex-col min-w-0 flex-1"
      >
        <!-- Layer 1: Infrastructure Identity (Global Account) -->
        <div
          x-show="$session.scopedUsers?.global"
          class="flex flex-col min-w-0 border-b border-slate-100 pb-1.5 mb-1.5"
        >
          <span
            class="text-[7px] uppercase text-slate-400 font-bold tracking-tighter leading-none mb-1"
          >Global Account</span>
          <span
            class="text-[9px] font-mono text-blue-500 truncate leading-none"
            x-text="(($session.scopedUsers?.global || {})[$session.scopedUsers?.global?.__activeId__])?.email || $session.scopedUsers?.global?.__activeId__ || 'N/A'"
          ></span>
        </div>

        <!-- Layer 3: Domain Session (Session User) -->
        <div class="flex flex-col min-w-0">
          <span
            class="text-[7px] uppercase text-slate-400 font-bold tracking-tighter leading-none mb-1"
          >Session User</span>
          <div class="flex items-center space-x-1">
            <span
              class="text-[10px] font-bold text-slate-800 truncate uppercase"
              :class="$session.currentUser?.id === 'guest' ? 'italic text-slate-400' : ''"
              x-text="$session.currentUser?.email || 'Guest'"
            ></span>
            <template x-if="$session.currentUser?.attributes?.['realm-admin']">
              <span
                class="text-[6px] bg-amber-100 text-amber-700 px-1 rounded-sm border border-amber-200 font-black"
              >ADMIN</span>
            </template>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
