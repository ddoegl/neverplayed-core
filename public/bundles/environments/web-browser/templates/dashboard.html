<div class="p-8 bg-slate-50 min-h-full">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-3">
        <i class="fas fa-star text-yellow-400"></i>
        Browser Favorites
      </h1>
      <div class="flex items-center gap-2 text-sm text-slate-500">
        <i class="fas fa-globe"></i>
        <span>https://portal.universe.com/dashboard</span>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Business Portal -->
      <button
        x-show="isFlowEnabled('business-channel-web')"
        @click="selectFlow('business-channel-web')"
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-indigo-400 transition-all group flex flex-col items-center text-center"
      >
        <div
          class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
        >
          <i class="fas fa-briefcase text-2xl"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1 leading-tight">
          Business Portal
        </h3>
        <p
          class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mt-auto"
        >
          portal.business.v2
        </p>
      </button>

      <!-- Company Registry favorite -->
      <button
        x-show="isFlowEnabled('company-registry')"
        @click="selectFlow('company-registry')"
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-teal-400 transition-all group flex flex-col items-center text-center"
      >
        <div
          class="w-16 h-16 rounded-2xl bg-teal-50 text-teal-600 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
        >
          <i class="fas fa-building text-2xl"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1 leading-tight">
          Company Registry
        </h3>
        <p
          class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mt-auto"
        >
          registry.companies.v1
        </p>
      </button>

      <!-- Person Registry favorite -->
      <button
        x-show="isFlowEnabled('person-registry')"
        @click="selectFlow('person-registry')"
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-orange-400 transition-all group flex flex-col items-center text-center"
      >
        <div
          class="w-16 h-16 rounded-2xl bg-orange-50 text-orange-600 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
        >
          <i class="fas fa-users text-2xl"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1 leading-tight">
          Person Registry
        </h3>
        <p
          class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mt-auto"
        >
          registry.persons.v1
        </p>
      </button>

      <!-- Backoffice favorite -->
      <button
        x-show="isFlowEnabled('backoffice-web')"
        @click="selectFlow('backoffice-web')"
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-indigo-400 transition-all group flex flex-col items-center text-center"
      >
        <div
          class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
        >
          <i class="fas fa-cogs text-2xl"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1 leading-tight">Backoffice</h3>
        <p
          class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mt-auto"
        >
          admin.management.v2
        </p>
      </button>

      <!-- Web Mail favorite -->
      <button
        x-show="isFlowEnabled('email-client')"
        @click="selectFlow('email-client')"
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-rose-400 transition-all group flex flex-col items-center text-center"
      >
        <div
          class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
        >
          <i class="fas fa-envelope text-2xl"></i>
        </div>
        <h3 class="font-bold text-slate-800 mb-1 leading-tight">Web Mail</h3>
        <p
          class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mt-auto"
        >
          mail.universe.v1
        </p>
      </button>
    </div>
  </div>
</div>
