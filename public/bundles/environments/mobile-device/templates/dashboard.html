<div
  class="h-full bg-cover bg-center relative"
  style="background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2029&auto=format&fit=crop')"
>
  <!-- Status Bar Overlay -->
  <div
    class="h-8 flex justify-between items-center px-6 text-white text-[10px] font-bold pt-2"
  >
    <span>9:41</span>
    <div class="flex gap-1.5 items-center">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full text-xs"></i>
    </div>
  </div>

  <div class="p-6 grid grid-cols-4 gap-y-8 mt-4">
    <!-- Dynamic App Clients -->
    <template x-for="app in appClients" :key="app.id">
      <button
        @click="selectFlow(app.id)"
        class="flex flex-col items-center gap-1 group"
      >
        <div
          class="w-14 h-14 rounded-[14px] shadow-lg flex items-center justify-center text-white text-2xl transition-transform active:scale-90 group-hover:brightness-110"
          :class="'bg-' + (app.color || 'blue-500')"
        >
          <i :class="app.icon"></i>
        </div>
        <span
          class="text-[10px] text-white font-medium text-center leading-tight truncate w-14"
          x-text="app.title"
        ></span>
      </button>
    </template>

    <!-- Email Icon -->
    <button
      x-show="isFlowEnabled('email-client', 'retail-channel-app')"
      @click="selectFlow('email-client')"
      class="flex flex-col items-center gap-1 group"
    >
      <div
        class="w-14 h-14 rounded-[14px] bg-white shadow-lg flex items-center justify-center text-rose-500 text-2xl transition-transform active:scale-90 group-hover:brightness-110"
      >
        <i class="fas fa-envelope"></i>
      </div>
      <span class="text-[10px] text-white font-medium text-center leading-tight"
      >Mail</span>
    </button>

    <!-- Settings (Placeholder) -->
    <button class="flex flex-col items-center gap-1 group opacity-60">
      <div
        class="w-14 h-14 rounded-[14px] bg-gray-500 shadow-lg flex items-center justify-center text-white text-2xl"
      >
        <i class="fas fa-cog"></i>
      </div>
      <span class="text-[10px] text-white font-medium text-center leading-tight"
      >Settings</span>
    </button>
  </div>

  <!-- Dock Area -->
  <div
    class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] h-20 bg-white/20 backdrop-blur-2xl rounded-[30px] flex items-center justify-around px-4 border border-white/20"
  >
    <button
      class="w-12 h-12 rounded-[12px] bg-green-500 flex items-center justify-center text-white text-xl shadow-lg active:scale-90 transition-transform"
    >
      <i class="fas fa-phone"></i>
    </button>
    <button
      class="w-12 h-12 rounded-[12px] bg-white flex items-center justify-center text-blue-500 text-xl shadow-lg active:scale-90 transition-transform"
    >
      <i class="fas fa-comment"></i>
    </button>
    <button
      class="w-12 h-12 rounded-[12px] bg-gradient-to-tr from-blue-400 to-blue-600 flex items-center justify-center text-white text-xl shadow-lg active:scale-90 transition-transform"
    >
      <i class="fas fa-compass"></i>
    </button>
    <button
      class="w-12 h-12 rounded-[12px] bg-white flex items-center justify-center text-orange-600 text-xl shadow-lg active:scale-90 transition-transform"
    >
      <i class="fas fa-play"></i>
    </button>
  </div>
</div>
