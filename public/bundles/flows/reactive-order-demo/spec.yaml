id: reactive-order-demo
label: "Reactive Order Demo"
domainObject:
  strategyId: LOCAL_STRATEGY
  label: "Reactive Order"
  limesPrefix: ORDER
  properties:
    Product: "Demo Subscription"
    Status: "Draft"
  actions:
    - id: view
      label: "Open Flow"
      icon: "fas fa-rocket"

permissionKeys:
  ORDER_VIEW:
    id: ORDER_VIEW
    label: "order:view"
    value: "order:view"

features:
  ORDER_FLOWS:
    id: ORDER_FLOWS
    label: "order:flows"
    keys:
      - ORDER_VIEW

capabilities:
  - id: ORDER_USER
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "ORDER_FLOWS"
        keys:
          - ORDER_VIEW

guards:
  - id: ORDER_VIEW
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "ORDER_FLOWS"
        keys:
          - ORDER_VIEW
  - id: ORDER_VIEW_CASE
    operator: "OR"
    matchers:
      - type: "matchPropertyNotEmpty"
        key: "myCaseId"
  - id: ORDER_CAN_CREATE
    operator: "OR"
    matchers:
      - type: "matchPropertyEmpty"
        key: "myCaseId"

ui:
  initialStep: order_init
  steps:
    order_init:
      order: 1
      title: "🚀 Reactive Sync Engine"
      parts:
        hero_card:
          type: card
          variant: info
          label: "Declarative Pattern"
          parts:
            intro:
              type: text
              value: |
                ### Zero-Code Event Sync
                This flow provides a **Real-Time OSGi-to-DOM Bridge**. 

                By defining a `linkToProperty` in the action params, the system automatically:
                1. Creates a Remote Case
                2. Stores the ID in your local State
                3. Subscribes to Global Change Events
                4. Syncs the Status reactively below!

        case_monitor:
          type: card
          variant: plain
          label: "Live Monitor"
          parts:
            status_row:
              type: row
              parts:
                id_badge:
                  type: text
                  value: "🆔 **ID:** `${values.myCaseId || '---'}`"
                status_badge:
                  type: text
                  value: "📡 **Status:** `${values.myCaseIdStatus || 'OFFLINE'}`"
          guard: ORDER_VIEW_CASE

        action_area:
          type: card
          parts:
            submit_btn:
              kind: command-button
              variant: primary
              label: "Initialize Order Case"
              call: "synthetic.case.create"
              params:
                caseTypeId: "business-account-order"
                linkToProperty: "myCaseId"
                onSuccess: "WAIT_FOR_CASE"
                title: "Declarative Sync Demo"
                companyId: "demo-corp"
              guard: ORDER_CAN_CREATE
            
            help_text:
              type: text
              value: "*Click above to test the OSGi event bridge initialization.*"
              guard: ORDER_CAN_CREATE

    order_success:
      order: 2
      title: "✅ Orchestration Complete"
      parts:
        success_card:
          type: card
          variant: success
          label: "Mission Accomplished"
          parts:
            msg:
              type: text
              value: |
                ## Sync Success!
                The case **${values.myCaseId}** has reached its terminal status: **${values.myCaseIdStatus}**.

                The declarative scope handled all event subscriptions and UI updates automatically.
