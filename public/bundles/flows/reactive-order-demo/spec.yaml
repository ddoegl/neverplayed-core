id: reactive-order-demo
label: "Reactive Order Demo"
domainObject:
  strategyId: LOCAL_STRATEGY
  label: "Reactive Order"
  limesPrefix: ORDER
  properties:
    Product: "Demo Subscription"
    Status: "Draft"
  actions:
    - id: view
      label: "Open Flow"
      icon: "fas fa-rocket"

permissionKeys:
  ORDER_VIEW:
    id: ORDER_VIEW
    label: "order:view"
    value: "order:view"

features:
  ORDER_FLOWS:
    id: ORDER_FLOWS
    label: "order:flows"
    keys:
      - ORDER_VIEW

capabilities:
  - id: ORDER_USER
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "ORDER_FLOWS"
        keys:
          - ORDER_VIEW

guards:
  - id: ORDER_VIEW
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "ORDER_FLOWS"
        keys:
          - ORDER_VIEW
  - id: ORDER_VIEW_CASE
    operator: "OR"
    matchers:
      - type: "matchPropertyNotEmpty"
        key: "myCaseId"
  - id: ORDER_CAN_CREATE
    operator: "OR"
    matchers:
      - type: "matchPropertyEmpty"
        key: "myCaseId"

ui:
  initialStep: order_init
  steps:
    order_init:
      order: 1
      title: "Reactive Order Demo"
      parts:
        intro:
          type: "text"
          value: |
            ### Generic Case Sync Pattern
            This flow is fully declarative! It uses the `spec.yaml` to define UI and behavior.
            When you create a case, the status will update reactively below.

        case_info:
          type: "text"
          style: "margin-top: 1rem; padding: 1rem; border-radius: 1rem; background: #f0f9ff; border: 1px solid #bae6fd;"
          value: |
            **Linked Case ID:** ${values.myCaseId || 'None'}
            **Current Status:** ${values.myCaseIdStatus || 'N/A'}
          guard: ORDER_VIEW_CASE

        submit_btn:
          kind: "command-button"
          variant: "primary"
          label: "Create Order Case"
          call: "synthetic.case.create"
          params:
            caseTypeId: "business-account-order"
            linkToProperty: "myCaseId"
            onSuccess: "WAIT_FOR_CASE"
            title: "Declarative Sync Demo"
            companyId: "demo-corp"
          guard: ORDER_CAN_CREATE

    order_success:
      order: 2
      title: "Case Finalized"
      parts:
        msg:
          type: "text"
          value: "The case **${values.myCaseId}** has reached status **${values.myCaseIdStatus}**. Well done!"
