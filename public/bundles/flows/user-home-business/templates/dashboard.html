<!-- Main Content Area -->
<div class="max-w-7xl mx-auto w-full p-8 pt-12" x-show="!currentSubFlowId">
  <div class="mb-10 flex items-center justify-between">
    <div>
      <h1 class="text-4xl font-bold text-gray-800 tracking-tight mb-2">
        Welcome, <span
          x-text="currentUser?.alias || currentUser?.firstname || 'User'"
        ></span>
      </h1>
      <p class="text-gray-500 text-lg">
        Manage your workflows, permissions, and active promotional targeting
        below.
      </p>
    </div>
  </div>

  <!-- BOOTSTRAP JOURNEY -->
  <template x-if="currentUser?.scaStrategy === 'bootstrap'">
    <div class="mb-10">
      <!-- State A: No Invitation Sent (Show Banner) -->
      <template x-if="!invitations.find(i => i.type === 'owner-binding')">
        <div
          class="bg-gradient-to-r from-amber-500 to-orange-600 rounded-3xl p-8 text-white shadow-2xl relative overflow-hidden group"
        >
          <div
            class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700"
          >
          </div>
          <div
            class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6"
          >
            <div class="flex items-center gap-6">
              <div
                class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-3xl shadow-inner border border-white/30"
              >
                <i class="fa-solid fa-link-slash"></i>
              </div>
              <div>
                <h2 class="text-2xl font-bold mb-1">
                  Unbound License Detected
                </h2>
                <p
                  class="text-amber-50 opacity-90 max-w-xl text-sm leading-relaxed"
                >
                  This license is currently in <strong>bootstrap mode</strong>
                  and has no formal owner. To conclude the setup, you must
                  invite a person to become the license holder.
                </p>
              </div>
            </div>
            <button
              @click="launchFlow('invitation-admin', 'person-details', { type: 'owner-binding', targetLicenseId: activeLicense?.id, modal: true })"
              class="px-8 py-4 bg-white text-orange-600 rounded-2xl font-bold hover:shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center gap-3 whitespace-nowrap"
            >
              <i class="fa-solid fa-user-plus"></i>
              Invite License Owner
            </button>
          </div>
        </div>
      </template>

      <!-- State B: Invitation Sent (Show Welcome Steps) -->
      <template x-if="invitations.find(i => i.type === 'owner-binding')">
        <div
          class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-gray-100 flex flex-col md:flex-row"
        >
          <!-- Left Column: Branding -->
          <div
            class="md:w-1/3 bg-emerald-600 p-10 text-white flex flex-col justify-between relative overflow-hidden"
          >
            <div
              class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-emerald-500 rounded-full blur-3xl opacity-50"
            >
            </div>
            <div class="relative z-10">
              <div
                class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-xl flex items-center justify-center mb-6 border border-white/20"
              >
                <i class="fas fa-check-circle text-xl"></i>
              </div>
              <h1 class="text-3xl font-black tracking-tight leading-tight mb-4">
                Invitation <br>Sent.
              </h1>
              <p
                class="text-emerald-100/80 text-sm leading-relaxed font-medium"
              >
                The owner-binding process has been initiated.
              </p>
            </div>
            <div class="relative z-10 pt-8">
              <div
                class="flex items-center gap-3 text-[10px] font-bold tracking-widest uppercase opacity-60"
              >
                <div class="w-6 h-px bg-white"></div>
                Awaiting Redemption
              </div>
            </div>
          </div>
          <!-- Right Column: Next Steps -->
          <div class="md:w-2/3 p-12 bg-white flex flex-col justify-center">
            <h2 class="text-2xl font-bold text-slate-900 mb-8 tracking-tight">
              Your Activation Journey
            </h2>
            <div
              class="space-y-6 relative"
              x-data="{ 
              get inv() { return invitations.find(i => i.type === 'owner-binding') },
              get status() { return this.inv?.status || 'sent' }
            }"
            >
              <div class="absolute left-5 top-6 bottom-6 w-0.5 bg-slate-100">
              </div>

              <!-- Step 1: Dispatched -->
              <div class="flex items-start gap-4 relative">
                <div
                  class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 border-4 border-white shadow-sm z-10 transition-colors duration-500"
                  :class="status !== 'pending' ? 'bg-emerald-500 text-white' : 'bg-emerald-100 text-emerald-600'"
                >
                  <i
                    class="fas"
                    :class="status !== 'pending' ? 'fa-check text-xs' : 'fa-paper-plane text-xs'"
                  ></i>
                </div>
                <div>
                  <h4
                    class="font-bold text-xs"
                    :class="status !== 'pending' ? 'text-slate-900' : 'text-slate-500'"
                  >
                    Invitation Dispatched
                  </h4>
                  <template x-if="status === 'sent'">
                    <p class="text-[10px] text-slate-500 mt-1">
                      The security code has been generated and sent.
                    </p>
                  </template>
                </div>
              </div>

              <!-- Step 2: Redeemed -->
              <div class="flex items-start gap-4 relative">
                <div
                  class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 border-4 border-white shadow-lg z-10 transition-all duration-500"
                  :class="['redeemed', 'admitted', 'concluded'].includes(status) ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400'"
                >
                  <template
                    x-if="!['redeemed', 'admitted', 'concluded'].includes(status)"
                  >
                    <span class="text-xs font-black">2</span>
                  </template>
                  <template
                    x-if="['redeemed', 'admitted', 'concluded'].includes(status)"
                  >
                    <i class="fas fa-check text-xs"></i>
                  </template>
                </div>
                <div>
                  <h4
                    class="font-bold text-xs transition-colors duration-500"
                    :class="['redeemed', 'admitted', 'concluded'].includes(status) ? 'text-slate-900' : 'text-slate-400'"
                  >
                    Identity Redeemed
                  </h4>
                  <p
                    class="text-[10px] text-slate-400 mt-1"
                    x-show="status === 'sent'"
                  >
                    Awaiting invitee to accept responsibility.
                  </p>
                  <p
                    class="text-[10px] text-emerald-600 mt-1 font-semibold"
                    x-show="status === 'redeemed'"
                  >
                    Invitee identified: <span
                      x-text="inv.personData?.firstname + ' ' + inv.personData?.lastname"
                    ></span>
                  </p>
                </div>
              </div>

              <!-- Step 3: Admission & Signature -->
              <div class="flex items-start gap-4 relative">
                <div
                  class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 border-4 border-white shadow-sm z-10 transition-all duration-500"
                  :class="status === 'concluded' ? 'bg-emerald-500 text-white' : (status === 'admitted' ? 'bg-orange-500 text-white animate-pulse' : (status === 'redeemed' ? 'bg-blue-600 text-white shadow-lg scale-110' : 'bg-slate-100 text-slate-400'))"
                >
                  <template x-if="status !== 'concluded'">
                    <span class="text-xs font-black">3</span>
                  </template>
                  <template x-if="status === 'concluded'">
                    <i class="fas fa-check text-xs"></i>
                  </template>
                </div>
                <div class="flex-1">
                  <h4
                    class="font-bold text-xs"
                    :class="['redeemed', 'admitted', 'concluded'].includes(status) ? 'text-slate-900' : 'text-slate-400'"
                  >
                    Review & Completion
                  </h4>

                  <!-- Action: Admit -->
                  <template x-if="status === 'redeemed'">
                    <div
                      class="mt-3 p-3 bg-blue-50 rounded-xl border border-blue-100"
                    >
                      <p class="text-[10px] text-blue-700 mb-3 leading-relaxed">
                        The invitee has redeemed the code. Please verify their
                        identity and <strong>Admit</strong> the redemption to
                        trigger the final signature.
                      </p>
                      <button
                        @click="launchFlow('invitation-admin', 'start-admission', { code: inv.code, modal: true })"
                        class="w-full py-2 bg-blue-600 text-white rounded-lg text-[10px] font-bold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2"
                      >
                        <i class="fas fa-user-check"></i>
                        Review & Admit
                      </button>
                    </div>
                  </template>

                  <!-- Status: Admitted (Awaiting Signature) -->
                  <template x-if="status === 'admitted'">
                    <div
                      class="mt-3 p-3 bg-orange-50 rounded-xl border border-orange-100"
                    >
                      <p
                        class="text-[10px] text-orange-700 leading-relaxed font-medium"
                      >
                        <i class="fas fa-clock mr-1"></i> Awaiting Signature
                      </p>
                      <p class="text-[9px] text-orange-600/70 mt-1">
                        A signature case has been sent to the redeemer. The
                        setup will conclude once they sign.
                      </p>
                    </div>
                  </template>

                  <!-- Status: Concluded -->
                  <template x-if="status === 'concluded'">
                    <p class="text-[10px] text-emerald-600 mt-1 font-bold">
                      <i class="fas fa-check-double mr-1"></i> Setup Concluded
                    </p>
                  </template>

                  <p
                    class="text-[10px] text-slate-400 mt-1"
                    x-show="['sent'].includes(status)"
                  >
                    Final verification and signature.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <div
    class="flex gap-2 mb-8 border-b border-gray-200 pb-4"
    x-show="!(currentUser?.scaStrategy === 'bootstrap' && invitations.find(i => i.type === 'owner-binding'))"
  >
    <div
      class="px-6 py-2.5 cursor-pointer rounded-lg transition-colors text-sm font-semibold tracking-wide flex items-center gap-2"
      :class="{ 'text-gray-800 border-b-2 border-blue-500 bg-white/50 backdrop-blur-sm -mb-[17px]': detailTab === 'promotions', 'text-gray-500 hover:bg-gray-100 hover:text-gray-900': detailTab !== 'promotions' }"
      @click="detailTab = 'promotions'"
    >
      <i
        class="fa-solid fa-bullhorn"
        :class="detailTab === 'promotions' ? 'text-blue-500' : ''"
      ></i> Promotions
    </div>
    <div
      class="px-6 py-2.5 cursor-pointer rounded-lg transition-colors text-sm font-semibold tracking-wide flex items-center gap-2"
      :class="{ 'text-gray-800 border-b-2 border-emerald-500 bg-white/50 backdrop-blur-sm -mb-[17px]': detailTab === 'topics', 'text-gray-500 hover:bg-gray-100 hover:text-gray-900': detailTab !== 'topics' }"
      @click="detailTab = 'topics'"
    >
      <i
        class="fa-solid fa-tags"
        :class="detailTab === 'topics' ? 'text-emerald-500' : ''"
      ></i> Topics
    </div>
    <div
      class="px-6 py-2.5 cursor-pointer rounded-lg transition-colors text-sm font-semibold tracking-wide flex items-center gap-2"
      :class="{ 'text-gray-800 border-b-2 border-indigo-500 bg-white/50 backdrop-blur-sm -mb-[17px]': detailTab === 'capabilities', 'text-gray-500 hover:bg-gray-100 hover:text-gray-900': detailTab !== 'capabilities' }"
      @click="detailTab = 'capabilities'"
    >
      <i
        class="fa-solid fa-shield-halved"
        :class="detailTab === 'capabilities' ? 'text-indigo-500' : ''"
      ></i> Capabilities
    </div>
  </div>

  <!-- PROMOTIONS TAB -->
  <div
    x-show="detailTab === 'promotions' && !(currentUser?.scaStrategy === 'bootstrap' && invitations.find(i => i.type === 'owner-binding'))"
    class="pb-16"
    x-transition.opacity.duration.300ms
  >
    <template
      x-if="!currentUserCap?.campaigns || currentUserCap.campaigns.length === 0"
    >
      <div
        class="bg-blue-500/10 border-dashed border border-blue-500/20 p-12 rounded-2xl text-center flex flex-col items-center"
      >
        <div
          class="w-16 h-16 rounded-full bg-blue-50 text-blue-400 flex items-center justify-center mb-4"
        >
          <i class="fa-solid fa-bullhorn text-2xl"></i>
        </div>
        <h3 class="text-xl font-semibold text-gray-800 mb-2">
          No Active Promotions
        </h3>
        <p class="text-gray-500 max-w-md mx-auto">
          There are currently no active campaign segments targeting your user
          profile.
        </p>
      </div>
    </template>

    <template
      x-if="currentUserCap?.campaigns && currentUserCap.campaigns.length > 0"
    >
      <div
        class="bg-gray-50 border border-gray-200 p-6 rounded-2xl transition-colors duration-200 shadow-xl"
      >
        <div
          class="font-semibold text-blue-400 text-lg mb-6 border-b border-gray-200 pb-4 flex items-center gap-3"
        >
          <i class="fa-solid fa-bullseye"></i> Active Campaigns
        </div>
        <div class="flex flex-col gap-3">
          <div
            class="grid grid-cols-[minmax(200px,2fr)_minmax(120px,1fr)_minmax(120px,1fr)_minmax(100px,1fr)_minmax(150px,1.5fr)] gap-6 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-gray-100 bg-white rounded-t-lg"
          >
            <div>Campaign Title</div>
            <div>ID / Strategy</div>
            <div>Channels</div>
            <div>Mode</div>
            <div>Granted Via</div>
          </div>
          <template
            x-for="camp in currentUserCap?.campaigns"
            :key="camp.id"
          >
            <div
              class="grid grid-cols-[minmax(200px,2fr)_minmax(120px,1fr)_minmax(120px,1fr)_minmax(100px,1fr)_minmax(150px,1.5fr)] gap-6 items-center px-4 py-4 bg-white rounded-xl border border-gray-100 hover:bg-gray-50 hover:border-gray-200 transition-all shadow-sm cursor-pointer"
            >
              <div
                class="font-semibold text-gray-800 text-[15px] break-words flex items-center gap-3"
              >
                <div
                  class="w-8 h-8 rounded bg-blue-50 text-blue-400 flex items-center justify-center border border-blue-500/30 flex-shrink-0"
                >
                  <i class="fa-solid fa-bolt text-xs"></i>
                </div>
                <span x-text="camp.title"></span>
              </div>
              <div>
                <div
                  class="font-mono text-gray-500 text-xs break-words mb-1.5"
                  x-text="camp.id"
                >
                </div>
                <span
                  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-blue-500/10 text-[10px] text-blue-700 border border-blue-500/20 uppercase tracking-widest font-semibold font-mono"
                  x-html="'<i class=\'fas fa-code-branch text-blue-400/50\'></i> ' + camp.strategy"
                ></span>
              </div>
              <div class="flex flex-wrap gap-1">
                <template
                  x-for="c in (Array.isArray(camp.channels) ? camp.channels : (camp.channels ? [camp.channels] : ['business']))"
                >
                  <span
                    class="px-2 py-0.5 rounded bg-slate-100 text-[10px] text-slate-600 border border-slate-200 font-bold uppercase tracking-tighter"
                    x-text="c"
                  ></span>
                </template>
              </div>
              <div>
                <span
                  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-amber-500/10 text-[10px] text-amber-700 border border-amber-500/20 uppercase tracking-widest font-semibold font-mono"
                  x-text="camp.mode || 'banner'"
                ></span>
              </div>
              <div>
                <template x-if="!camp.source">
                  <span class="text-slate-500 text-xs italic"
                  >Evaluation Source Unknown</span>
                </template>
                <template x-if="camp.source">
                  <span
                    class="inline-block px-3 py-1.5 rounded-lg text-xs bg-white text-gray-600 border border-slate-700 shadow-inner break-words font-medium"
                    x-text="camp.source"
                  ></span>
                </template>
              </div>
              <div class="col-span-full mt-2 flex justify-end">
                <button
                  @click.stop="viewPromo(camp)"
                  class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md transition-colors"
                >
                  View Details
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- TOPICS TAB -->
  <div
    x-show="detailTab === 'topics' && !(currentUser?.scaStrategy === 'bootstrap' && invitations.find(i => i.type === 'owner-binding'))"
    class="pb-16"
    x-transition.opacity.duration.300ms
  >
    <template
      x-if="!currentUserCap?.topics || currentUserCap.topics.length === 0"
    >
      <div
        class="bg-emerald-50 border-dashed border border-emerald-200 p-12 rounded-2xl text-center flex flex-col items-center"
      >
        <div
          class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-4"
        >
          <i class="fa-solid fa-tags text-2xl"></i>
        </div>
        <h3 class="text-xl font-semibold text-gray-800 mb-2">
          No Active Topics
        </h3>
        <p class="text-gray-500 max-w-md mx-auto">
          There are currently no conversational or functional topics mapped to
          your profile.
        </p>
      </div>
    </template>

    <template x-if="currentUserCap?.topics && currentUserCap.topics.length > 0">
      <div
        class="bg-gray-50 border border-gray-200 p-6 rounded-2xl transition-colors duration-200 shadow-xl"
      >
        <div
          class="font-semibold text-emerald-600 text-lg mb-6 border-b border-gray-200 pb-4 flex items-center gap-3"
        >
          <i class="fa-solid fa-hashtag"></i> Enrolled Topics
        </div>
        <div class="flex flex-col gap-3">
          <div
            class="grid grid-cols-[minmax(250px,2fr)_minmax(200px,1.5fr)_minmax(200px,2fr)] gap-6 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-gray-100 bg-white rounded-t-lg"
          >
            <div>Topic Title</div>
            <div>ID & Strategy Target</div>
            <div>Granted Via Pipeline</div>
          </div>
          <template x-for="topic in currentUserCap?.topics" :key="topic.id">
            <div
              class="grid grid-cols-[minmax(250px,2fr)_minmax(200px,1.5fr)_minmax(200px,2fr)] gap-6 items-center px-4 py-4 bg-white rounded-xl border border-gray-100 hover:bg-gray-50 hover:border-gray-200 transition-all shadow-sm"
            >
              <div
                class="font-semibold text-gray-800 text-[15px] break-words flex items-center gap-3"
              >
                <div
                  class="w-8 h-8 rounded bg-emerald-100 text-emerald-600 flex items-center justify-center border border-emerald-300 flex-shrink-0"
                >
                  <i class="fa-solid fa-comment-dots text-xs"></i>
                </div>
                <span x-text="topic.title"></span>
              </div>
              <div>
                <div
                  class="font-mono text-gray-500 text-xs break-words mb-1.5"
                  x-text="topic.id"
                >
                </div>
                <span
                  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-50 text-[10px] text-emerald-700 border border-emerald-200 uppercase tracking-widest font-semibold font-mono"
                  x-html="'<i class=\'fas fa-code-branch text-emerald-600/50\'></i> ' + topic.strategy"
                ></span>
              </div>
              <div>
                <template x-if="!topic.source">
                  <span class="text-slate-500 text-xs italic"
                  >Evaluation Source Unknown</span>
                </template>
                <template x-if="topic.source">
                  <span
                    class="inline-block px-3 py-1.5 rounded-lg text-xs bg-white text-gray-600 border border-slate-700 shadow-inner break-words font-medium"
                    x-text="topic.source"
                  ></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- CAPABILITIES TAB -->
  <div
    x-show="detailTab === 'capabilities' && !(currentUser?.scaStrategy === 'bootstrap' && invitations.find(i => i.type === 'owner-binding'))"
    class="pb-16"
    x-transition.opacity.duration.300ms
  >
    <template
      x-if="!currentUserCap?.capabilities || currentUserCap.capabilities.length === 0"
    >
      <div
        class="bg-gray-50 border-dashed border border-gray-200 p-12 rounded-2xl text-center flex flex-col items-center"
      >
        <div
          class="w-16 h-16 rounded-full bg-gray-50 text-gray-500 flex items-center justify-center mb-4 border border-gray-200"
        >
          <i class="fa-solid fa-shield-slash text-2xl"></i>
        </div>
        <h3 class="text-xl font-semibold text-gray-800 mb-2">
          No Verified Capabilities
        </h3>
        <p class="text-gray-500 max-w-md mx-auto">
          This profile does not currently inherit any application permissions
          from global rules, functional licenses, or assigned roles.
        </p>
      </div>
    </template>

    <div class="flex flex-col gap-6">
      <template
        x-for="cap in currentUserCap?.capabilities"
        :key="typeof cap.category === 'object' ? JSON.stringify(cap.category) : cap.category"
      >
        <div
          class="bg-gray-50 border border-gray-200 p-6 rounded-2xl shadow-xl"
        >
          <div
            class="font-semibold text-indigo-600 text-lg mb-6 border-b border-gray-200 pb-4 flex items-center gap-3"
          >
            <i class="fa-solid fa-layer-group opacity-70"></i>
            <span
              x-text="typeof cap.category === 'object' ? JSON.stringify(cap.category) : cap.category"
            ></span>
          </div>

          <div class="flex flex-col gap-3">
            <div
              class="grid grid-cols-[minmax(250px,1.5fr)_minmax(200px,2fr)_minmax(200px,1.5fr)] gap-6 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-gray-100 bg-white rounded-t-lg"
            >
              <div>Capability Key</div>
              <div>Authorized Tenants</div>
              <div>Granted Via Pipeline</div>
            </div>

            <template x-for="perm in cap.permissions" :key="perm.key">
              <div
                class="grid grid-cols-[minmax(250px,1.5fr)_minmax(200px,2fr)_minmax(200px,1.5fr)] gap-6 items-center px-4 py-4 bg-white rounded-xl border border-gray-100 hover:bg-gray-50 hover:border-gray-200 transition-all shadow-sm"
              >
                <div
                  class="font-mono text-indigo-700 text-sm break-words font-semibold tracking-wide"
                  x-text="perm.key"
                >
                </div>

                <div class="flex flex-wrap gap-2">
                  <template x-if="!perm.customers || perm.customers.length === 0">
                    <span
                      class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-gray-50 text-[11px] text-gray-600 border border-gray-200 uppercase font-semibold"
                    >
                      <i class="fa-solid fa-earth-americas opacity-50"></i>
                      GLOBAL / SHARED
                    </span>
                  </template>
                  <template x-for="c in (perm.customers || [])">
                    <span
                      class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-indigo-100 text-[11px] text-indigo-800 border border-indigo-300 tracking-wide font-medium"
                      x-html="'<i class=\'fa-solid fa-building opacity-50\'></i> ' + c"
                    ></span>
                  </template>
                </div>

                <div class="flex flex-wrap gap-2">
                  <template x-show="!perm.sources || perm.sources.length === 0">
                    <span class="text-slate-500 text-xs italic"
                    >Evaluation Source Unknown</span>
                  </template>
                  <template x-for="s in perm.sources">
                    <span
