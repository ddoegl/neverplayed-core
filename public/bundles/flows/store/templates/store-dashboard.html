<div class="max-w-7xl mx-auto w-full p-8 pt-12">
  <div class="mb-10">
    <h1 class="text-4xl font-bold text-gray-800 tracking-tight mb-2">
      Business Store
    </h1>
    <p class="text-gray-500 text-lg">
      Select a product to start your application process.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <template x-for="product in orderableFlows" :key="product.id">
      <div
        class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 hover:shadow-xl hover:border-blue-200 transition-all duration-300 cursor-pointer group flex flex-col relative overflow-hidden"
        @click="viewProduct(product)"
      >
        <!-- Decorative background blob -->
        <div
          class="absolute -right-4 -top-4 w-24 h-24 bg-blue-50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-500 blur-2xl"
        >
        </div>

        <div class="relative z-10 flex-grow">
          <div
            class="w-16 h-16 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mb-6 border border-blue-100 group-hover:bg-blue-600 group-hover:text-white transition-all duration-300 shadow-sm"
          >
            <i class="text-3xl" :class="product.icon || 'fas fa-box'"></i>
          </div>

          <div class="mb-2">
            <span
              class="text-[10px] font-bold text-blue-500 uppercase tracking-widest"
              x-text="product.category"
            ></span>
          </div>

          <h2
            class="text-2xl font-bold text-gray-800 mb-3 group-hover:text-blue-600 transition-colors"
            x-text="product.title"
          >
          </h2>
          <p
            class="text-gray-500 leading-relaxed text-[15px]"
            x-text="product.description"
          >
          </p>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-50 relative z-10">
          <button
            class="w-full bg-blue-50 text-blue-600 font-bold py-3.5 rounded-2xl hover:bg-blue-600 hover:text-white hover:shadow-lg hover:shadow-blue-200 transition-all duration-300 flex items-center justify-center gap-2 group/btn"
          >
            Order Now
            <i
              class="fas fa-arrow-right text-xs group-hover/btn:translate-x-1 transition-transform"
            ></i>
          </button>
        </div>
      </div>
    </template>
  </div>

  <template x-if="orderableFlows.length === 0">
    <div
      class="py-20 text-center bg-gray-50 rounded-3xl border border-dashed border-gray-200"
    >
      <div
        class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm"
      >
        <i class="fas fa-search text-3xl text-gray-300"></i>
      </div>
      <h3 class="text-xl font-bold text-gray-800 mb-2">
        No Products Available
      </h3>
      <p class="text-gray-500 max-w-sm mx-auto">
        We couldn't find any orderable products for your current profile at this
        time.
      </p>
    </div>
  </template>
</div>
