id: hello-world-do
label: "Hello World Atomic"
domainObject:
  strategyId: LOCAL_STRATEGY
  label: "Hello World Object"
  limesPrefix: HELLO
  properties:
    label: "Greeting Message"
  actions:
    - id: view
      label: Launch App
      icon: fas fa-rocket

permissionKeys:
  HELLO_VIEW:
    id: HELLO_VIEW
    label: "hello:view"
    value: "hello:view"
  HELLO_EDIT:
    id: HELLO_EDIT
    label: "hello:edit"
    value: "hello:edit"

features:
  HELLO_ATOMIC:
    id: HELLO_ATOMIC
    label: "hello:atomic"
    description: "Access to Atomic Hello World features"
    keys:
      - HELLO_VIEW
      - HELLO_EDIT

capabilities:
  - id: HELLO_WORLD_ADMIN
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "HELLO_ATOMIC"
        keys:
          - HELLO_VIEW
          - HELLO_EDIT

guards:
  - id: HELLO_VIEW
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "HELLO_ATOMIC"
        keys:
          - HELLO_VIEW
  - id: HELLO_EDIT
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "HELLO_ATOMIC"
        keys:
          - HELLO_EDIT

ui:
  parts:
    intro:
      type: "text"
      guard: "HELLO_VIEW"
      value: "Welcome to the first Declarative Atomic Bundle! This screen is rendered entirely from YAML."
    spacer:
      type: "text"
      guard: "HELLO_VIEW"
      value: "---"
    actionButton:
      type: "action"
      guard: "HELLO_EDIT"
      label: "Send Magic Greeting"
      onAction:
        call: "apiService"
        params:
          endpoint: "https://jsonplaceholder.typicode.com/posts/1"
          method: "GET"
