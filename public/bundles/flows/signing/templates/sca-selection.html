<div class="h-full w-full flex items-center justify-center p-4 bg-gray-50/50">
  <div
    class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100 flex flex-col"
  >
    <div class="mb-6 text-center">
      <div
        class="mx-auto h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg mb-4 text-white text-2xl"
      >
        <i class="fas fa-signature"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900" x-text="actionTitle"></h2>
      <p class="text-sm text-gray-500 mt-2">
        Please authenticate to confirm this action.
      </p>
    </div>

    <!-- Transaction Summary Block -->
    <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-8">
      <h3 class="text-xs font-bold uppercase text-gray-400 mb-2">
        Transaction Summary
      </h3>
      <div class="prose prose-sm text-gray-800" x-html="summaryHtml"></div>
    </div>

    <!-- SCA Method Selection -->
    <div
      class="space-y-3 flex-1 overflow-y-auto"
      x-data="{
        activeMethods: [],
        initMethods() {
            const stratKey = signee.scaStrategy;
            if (stratKey === 'bootstrap') {
                this.activeMethods.push({ 
                    id: 'bootstrap-otp', 
                    label: 'One-Time PIN (SMS)', 
                    icon: 'fas fa-key', 
                    color: 'blue',
                    isBootstrap: true 
                });
                return;
            }
            const strat = parsedSCAStrategies[stratKey];
            if (strat) {
                const methods = parsedSCAMethods || {};
                Object.entries(methods).forEach(([methodKey, methodDef]) => {
                    if (strat[methodKey] === true) {
                        this.activeMethods.push({
                            id: methodKey,
                            label: methodDef.label || methodKey,
                            icon: methodDef.icon || 'fas fa-key',
                            color: methodDef.color || 'gray'
                        });
                    }
                });
            }
        }
    }"
      x-init="initMethods()"
    >
      <h3 class="text-xs font-bold text-gray-500 uppercase">
        Available Security Methods
      </h3>

      <template x-for="method in activeMethods" :key="method.id">
        <button
          @click="if(method.isBootstrap) { 
                alert('SCA Bootstrap: A one-time PIN has been sent via SMS to the registered number.'); 
                const input = prompt('Enter the Bootstrap Security Code (Format: XXX-XXX-XXX-XXX) provided during your last logout:');
                if (!input || input.toUpperCase().trim() !== (signee['bootstrap-code'] || '').toUpperCase().trim()) {
                    alert('Invalid Security Code. Access denied.');
                    return;
                }
            } completeVerification(method.id)"
          class="w-full flex items-center justify-between p-4 bg-white border border-gray-200 rounded-xl hover:border-blue-500 hover:bg-blue-50/50 transition-all text-left group"
        >
          <div class="flex items-center gap-4">
            <div
              :class="`w-10 h-10 rounded-full flex items-center justify-center bg-${method.color}-100 text-${method.color}-600 text-lg`"
            >
              <i :class="method.icon"></i>
            </div>
            <div>
              <div
                class="font-bold text-gray-900 text-sm"
                x-text="method.label"
              >
              </div>
              <div
                class="text-[10px] text-gray-400 font-mono"
                x-text="method.id"
              >
              </div>
            </div>
          </div>
          <i
            class="fas fa-chevron-right text-gray-300 group-hover:text-blue-500 transition-colors"
          ></i>
        </button>
      </template>

      <template x-if="activeMethods.length === 0">
        <div
          class="p-4 text-center bg-red-50 text-red-700 rounded-xl border border-red-200"
        >
          <i class="fas fa-exclamation-triangle mb-2 text-xl block"></i>
          <div class="font-bold text-sm">No Active Authentication Methods</div>
          <p class="text-xs mt-1">
            Your profile does not define any active SCA methods. Cannot
            authorize transaction.
          </p>
        </div>
      </template>
    </div>

    <!-- Cancel Button -->
    <div class="pt-6 mt-6 border-t border-gray-100 flex justify-center">
      <button
        @click="cancelVerification()"
        class="text-gray-500 hover:text-red-500 text-sm font-medium transition-colors"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
