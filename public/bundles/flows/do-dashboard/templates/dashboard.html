<div
  class="h-full flex flex-col bg-slate-50"
  x-data="globalThis.getDODashboardScope()"
>
  <header class="p-8 bg-white border-b border-slate-200">
    <h1 class="text-3xl font-black text-slate-800 tracking-tight">
      Domain Objects
    </h1>
    <p class="text-slate-500 font-medium">
      Manage and interact with your authorized domain entities.
    </p>
  </header>

  <div class="flex-1 overflow-y-auto p-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="doInst in dos" :key="doInst.id">
        <div
          class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-xl transition-all duration-300 group"
        >
          <!-- Card Header -->
          <div class="p-6 border-b border-slate-50">
            <div class="flex justify-between items-start mb-4">
              <div
                class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300"
              >
                <i :class="doInst.strategy?.icon || 'fas fa-cube'"></i>
              </div>
              <span
                class="text-[10px] font-black uppercase tracking-widest text-slate-400 bg-slate-100 px-2 py-1 rounded"
                x-text="doInst.strategy?.label"
              ></span>
            </div>
            <h2
              class="text-xl font-bold text-slate-800 mb-1"
              x-text="doInst.label"
            >
            </h2>
            <p
              class="text-sm text-slate-500 line-clamp-2"
              x-text="doInst.description"
            >
            </p>
          </div>

          <!-- Card Body (Properties) -->
          <div class="p-6 flex-1 space-y-3">
            <template x-for="(val, prop) in doInst.properties" :key="prop">
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-400 capitalize" x-text="prop"></span>
                <span class="font-bold text-slate-700" x-text="val"></span>
              </div>
            </template>
          </div>

          <!-- Card Actions -->
          <div class="p-4 bg-slate-50 flex gap-2">
            <template x-for="action in doInst.allowedActions" :key="action.id">
              <button
                @click="triggerAction(action.id, doInst)"
                class="flex-1 bg-white border border-slate-200 text-slate-700 py-2 rounded-lg text-xs font-bold hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all flex items-center justify-center space-x-2 shadow-sm"
              >
                <i :class="action.icon"></i>
                <span x-text="action.label"></span>
              </button>
            </template>
            <template x-if="doInst.allowedActions.length === 0">
              <div
                class="w-full text-center text-xs text-slate-400 italic py-2"
              >
                No actions available
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="dos.length === 0">
        <div
          class="col-span-full py-20 flex flex-col items-center justify-center text-slate-400"
        >
          <div
            class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center text-3xl mb-4"
          >
            <i class="fas fa-ghost"></i>
          </div>
          <p class="text-lg font-bold">No Domain Objects Visible</p>
          <p class="text-sm">
            You don't have the necessary capabilities to view any domain
            entities.
          </p>
        </div>
      </template>
    </div>
  </div>
</div>
