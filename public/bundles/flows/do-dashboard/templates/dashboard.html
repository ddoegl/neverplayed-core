<div
  class="h-full flex flex-col bg-slate-50"
  x-data="globalThis.getDODashboardScope()"
>
  <header class="p-8 bg-white border-b border-slate-200">
    <h1 class="text-3xl font-black text-slate-800 tracking-tight">
      Domain Objects
    </h1>
    <p class="text-slate-500 font-medium">
      Manage and interact with your authorized domain entities.
    </p>
  </header>

  <div class="flex-1 overflow-y-auto p-8 space-y-12">
    <template x-for="bp in blueprints" :key="bp.id">
      <section class="space-y-6">
        <!-- Blueprint Header -->
        <div class="flex justify-between items-end border-b border-slate-200 pb-4">
          <div>
            <div class="flex items-center gap-3 mb-1">
              <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-sm shadow-lg shadow-indigo-200">
                <i :class="bp.domainObject?.icon || 'fas fa-dna'"></i>
              </div>
              <h2 class="text-2xl font-black text-slate-800 tracking-tight" x-text="bp.label"></h2>
            </div>
            <p class="text-slate-500 text-sm font-medium" x-text="bp.description || 'Instantiate and manage objects of this type.'"></p>
          </div>
          <button 
            @click="instantiate(bp.id)"
            class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-slate-900 transition-all shadow-xl shadow-indigo-100 flex items-center gap-2 group"
          >
            <i class="fas fa-plus group-hover:rotate-90 transition-transform"></i>
            <span>Create Instance</span>
          </button>
        </div>

        <!-- Instances Grid for this Blueprint -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="doInst in dos.filter(d => d.blueprintId === bp.id)" :key="doInst.id">
            <div
              class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-xl transition-all duration-300 group relative"
            >
              <!-- Card Header -->
              <div class="p-6 border-b border-slate-50">
                <div class="flex justify-between items-start mb-4">
                  <div
                    class="w-12 h-12 bg-slate-50 text-slate-400 rounded-xl flex items-center justify-center text-xl group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-colors duration-300"
                  >
                    <i :class="doInst.strategy?.icon || 'fas fa-cube'"></i>
                  </div>
                  <div class="flex flex-col items-end">
                    <span
                      class="text-[10px] font-black uppercase tracking-widest text-slate-400 bg-slate-100 px-2 py-1 rounded mb-1"
                      x-text="doInst.strategy?.label"
                    ></span>
                     <span
                      class="text-[9px] font-mono text-slate-300"
                      x-text="doInst.id"
                    ></span>
                  </div>
                </div>
                <h3
                  class="text-lg font-bold text-slate-800 mb-1"
                  x-text="doInst.label"
                ></h3>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-tighter" x-text="doInst.currentStep || 'Ready'"></span>
                </div>
              </div>

              <!-- Card Body (Properties) -->
              <div class="p-6 flex-1 space-y-3 bg-white/50">
                <template x-for="(val, prop) in doInst.properties" :key="prop">
                  <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400 capitalize" x-text="prop"></span>
                    <span class="font-bold text-slate-700" x-text="val"></span>
                  </div>
                </template>
                <template x-if="Object.keys(doInst.properties || {}).length === 0">
                    <div class="text-[10px] text-slate-300 uppercase tracking-widest text-center py-4 border-2 border-dashed border-slate-100 rounded-xl">
                        No Data Captured
                    </div>
                </template>
              </div>

              <!-- Card Actions -->
              <div class="p-4 bg-slate-50/50 flex gap-2 border-t border-slate-100">
                <template x-for="action in doInst.allowedActions" :key="action.id">
                  <button
                    @click="triggerAction(action.id, doInst)"
                    class="flex-1 bg-white border border-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-900 hover:text-white hover:border-slate-900 transition-all flex items-center justify-center space-x-2 shadow-sm"
                  >
                    <i :class="action.icon"></i>
                    <span x-text="action.label"></span>
                  </button>
                </template>
                <template x-if="doInst.allowedActions.length === 0">
                  <div class="w-full text-center text-xs text-slate-400 italic py-2">
                    No actions available
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Empty State for this Blueprint -->
          <template x-if="dos.filter(d => d.blueprintId === bp.id).length === 0">
            <div class="col-span-full py-12 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-300">
              <i class="fas fa-layer-group text-4xl mb-3 opacity-20"></i>
              <p class="text-sm font-bold uppercase tracking-widest">No Active Instances</p>
              <p class="text-[10px] font-medium">Click "Create Instance" to start a new flow.</p>
            </div>
          </template>
        </div>
      </section>
    </template>

    <!-- Global Empty State -->
    <template x-if="blueprints.length === 0">
      <div class="col-span-full py-24 flex flex-col items-center justify-center text-slate-400">
        <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center text-4xl mb-6">
          <i class="fas fa-microchip animate-pulse"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-800 mb-2">Discovery Pending</h2>
        <p class="text-slate-500 font-medium max-w-md text-center">
            The system is awaiting domain object blueprints. Please ensure your bundles are started and specifications are ingested.
        </p>
      </div>
    </template>
  </div>
</div>
