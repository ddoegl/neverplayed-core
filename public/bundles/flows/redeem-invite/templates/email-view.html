<!-- Email Body -->
<div
  class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mx-4 my-8"
>
  <div class="flex items-center gap-4 mb-8">
    <div
      class="w-12 h-12 bg-indigo-100 rounded-2xl flex items-center justify-center text-indigo-600 font-bold text-xl"
    >
      G
    </div>
    <div>
      <h3 class="font-bold text-slate-900 leading-tight">
        Platform Team
      </h3>
      <p class="text-xs text-slate-400">no-reply@platform.connect</p>
    </div>
  </div>

  <h2 class="text-2xl font-black text-slate-900 mb-4 tracking-tight">
    You've been invited!
  </h2>

  <p class="text-slate-600 text-sm mb-4 leading-relaxed">
    Hi <span
      class="font-bold text-slate-900"
      x-text="invitation.firstName + ' ' + invitation.lastName"
    ></span>,
  </p>
  <p class="text-slate-600 text-sm mb-8 leading-relaxed">
    You've been invited to join <span class="text-slate-900 font-medium"
    >d-Connect</span> to manage authorizations for your company.
  </p>

  <div
    class="bg-slate-50 border border-slate-100 p-6 rounded-2xl mb-8 text-center"
  >
    <p
      class="text-[10px] text-slate-400 mb-2 font-bold uppercase tracking-[0.2em]"
    >
      Your Invitation Code
    </p>
    <p
      class="text-3xl font-mono font-black text-indigo-600 tracking-widest"
      x-text="invitation.code"
    >
    </p>
  </div>

  <button
    @click="loadStep('redeem-code')"
    class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3"
  >
    <span>Redeem Invitation</span>
    <i class="fas fa-arrow-right text-xs opacity-50"></i>
  </button>

  <p
    class="mt-8 text-[10px] text-slate-400 text-center leading-relaxed max-w-[200px] mx-auto"
  >
    This invitation was sent via <span class="text-slate-600">d-Connect</span>.
    If you didn't expect this, please ignore this email.
  </p>
</div>
