<!-- Screen Content -->
<div class="p-6">
  <h3 class="text-lg font-bold text-slate-900 mb-4">Review and Complete</h3>

  <p class="text-sm text-slate-600 mb-4">
    <span class="font-bold text-slate-900">Bike Value Logistics GmbH</span>
    requires the following data for admitting the connection:
  </p>

  <div
    class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm mb-6 space-y-3 text-sm"
  >
    <div class="flex justify-between border-b border-slate-100 pb-2">
      <span class="text-slate-500">Your full name:</span>
      <span
        class="font-bold text-slate-900"
        x-text="selectedPerson ? (selectedPerson.firstname + ' ' + selectedPerson.lastname) : 'Guest'"
      >July Wiser</span>
    </div>
    <div class="flex justify-between border-b border-slate-100 pb-2">
      <span class="text-slate-500">Security Feature:</span>
      <span
        class="font-bold text-slate-900"
        x-text="selectedPerson ? selectedPerson.birthdate : 'DD.MM.YYYY'"
      >31.08.1984</span>
    </div>
  </div>

  <div class="mb-6">
    <label class="block text-slate-700 text-sm font-bold mb-2"
    >Security Question from <span
        x-text="currentAdmin ? currentAdmin.firstname + ' ' + currentAdmin.lastname : 'Inviter'"
      >Rob Richter</span>:</label>
    <p
      class="text-sm bg-blue-50 p-3 rounded-xl border border-blue-100 text-blue-800 mb-3"
    >
      "What's the meaning of life?"
    </p>

    <input
      type="text"
      class="w-full border border-slate-200 p-3 rounded-xl text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition"
      placeholder="Answer..."
      value="42"
      x-data="{ ans: '42' }"
      x-model="ans"
    />
  </div>

  <div
    class="bg-amber-50 text-amber-800 p-4 rounded-xl text-xs mb-8 flex items-start gap-3"
  >
    <i class="fas fa-info-circle mt-0.5 opacity-70"></i>
    <p>
      Your data will be securely processed in compliance with GDPR and banking
      secrecy regulations.
    </p>
  </div>

  <button
    class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-slate-800 transition transform active:scale-95"
    @click="acceptInvitation();"
  >
    Consent & Share
  </button>
  <button
    class="w-full mt-4 text-slate-400 text-sm font-medium hover:text-slate-900 transition"
    @click="loadStep('invitation-view')"
  >
    Back
  </button>
</div>
