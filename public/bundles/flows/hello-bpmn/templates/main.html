<div
  x-data="globalThis.helloBpmnState"
  class="flex flex-col h-full bg-gray-950 text-white font-mono"
  style="min-height: 500px"
>
  <!-- Header -->
  <div
    class="flex items-center justify-between px-6 py-3 bg-gray-900 border-b border-gray-700 flex-shrink-0"
  >
    <div class="flex items-center space-x-3">
      <i class="fas fa-project-diagram text-blue-400 text-xl"></i>
      <div>
        <div class="font-bold text-white text-sm tracking-wide">Hello BPMN</div>
        <div class="text-xs text-gray-400 font-sans">
          BPMN 2.0 Micro-Engine Proof of Concept
        </div>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <!-- Status badge -->
      <span
        class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest"
        :class="{
              'bg-gray-700 text-gray-300':  status === 'idle',
              'bg-blue-600 text-white':     status === 'running',
              'bg-yellow-500 text-black':   status === 'waiting',
              'bg-green-600 text-white':    status === 'complete',
              'bg-red-600 text-white':      status === 'error'
            }"
        x-text="status"
      >
      </span>
      <button
        x-show="status === 'idle' || status === 'complete' || status === 'error'"
        @click="startProcess()"
        class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg transition-colors"
      >
        ▶ Run Process
      </button>
      <button
        x-show="status !== 'idle'"
        @click="reset()"
        class="px-4 py-1.5 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold rounded-lg transition-colors"
      >
        ↺ Reset
      </button>
    </div>
  </div>

  <!-- Main: 3-column layout -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left: BPMN Viewer -->
    <div class="flex flex-col flex-1 border-r border-gray-700 min-w-0">
      <div
        class="text-[10px] uppercase text-gray-500 font-bold px-4 py-2 border-b border-gray-800 tracking-widest flex-shrink-0"
      >
        Process Diagram
        <span
          class="text-blue-400 ml-2 font-mono normal-case"
          x-text="currentNodeName ? '→ ' + currentNodeName : ''"
        ></span>
      </div>
      <div
        id="bpmn-viewer-container"
        class="flex-1 bg-gray-100"
        style="min-height: 300px"
      >
        <!-- bpmn.js mounts here -->
      </div>
    </div>

    <!-- Right: Task Panel + Log -->
    <div class="flex flex-col w-80 flex-shrink-0">
      <!-- Task Panel -->
      <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">
        <!-- Idle -->
        <template x-if="status === 'idle'">
          <div class="text-center text-gray-500 mt-16 space-y-3">
            <i class="fas fa-play-circle text-5xl text-gray-700"></i>
            <div class="text-sm font-sans">
              Click <strong class="text-white">Run Process</strong> to start the
              Hello World workflow.
            </div>
          </div>
        </template>

        <!-- User Task form -->
        <template x-if="status === 'waiting'">
          <div class="space-y-4">
            <div
              class="text-xs uppercase text-yellow-400 font-bold tracking-widest"
            >
              ⏳ User Task
            </div>
            <div
              class="text-sm font-sans text-white font-bold"
              x-text="currentNodeName"
            >
            </div>

            <template x-for="field in currentFormFields" :key="field.id">
              <div class="space-y-1">
                <label
                  class="text-xs text-gray-400 font-sans"
                  x-text="field.label"
                ></label>

                <!-- Boolean field -->
                <template x-if="field.type === 'boolean'">
                  <label class="flex items-center space-x-2 cursor-pointer">
                    <input
                      type="checkbox"
                      :id="'field-' + field.id"
                      class="w-4 h-4 accent-blue-500"
                      x-model="formValues[field.id]"
                    >
                    <span
                      class="text-xs text-gray-300 font-sans"
                      x-text="field.label"
                    ></span>
                  </label>
                </template>

                <!-- String field -->
                <template x-if="field.type !== 'boolean'">
                  <input
                    :type="field.type === 'long' || field.type === 'integer' ? 'number' : 'text'"
                    :id="'field-' + field.id"
                    :placeholder="field.label"
                    class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 font-sans"
                    x-model="formValues[field.id]"
                  >
                </template>
              </div>
            </template>

            <!-- Empty task (no form fields — just confirm) -->
            <template x-if="currentFormFields.length === 0">
              <p class="text-xs text-gray-400 font-sans italic">
                No form fields. Just confirm to continue.
              </p>
            </template>

            <button
              @click="submitTask()"
              class="w-full mt-2 py-2 bg-yellow-500 hover:bg-yellow-400 text-black font-bold text-sm rounded-lg transition-colors"
            >
              ✔ Complete Task
            </button>
          </div>
        </template>

        <!-- Running (service task in flight) -->
        <template x-if="status === 'running'">
          <div class="text-center mt-16 space-y-3">
            <div class="text-blue-400 text-3xl animate-pulse">⚙️</div>
            <div class="text-xs text-gray-400 font-sans">
              Executing service task...
            </div>
            <div class="text-xs text-white font-bold" x-text="currentNodeName">
            </div>
          </div>
        </template>

        <!-- Complete -->
        <template x-if="status === 'complete'">
          <div class="space-y-4">
            <div
              class="text-xs uppercase text-green-400 font-bold tracking-widest"
            >
              ✅ Process Complete
            </div>
            <div
              x-show="greeting"
              class="bg-gray-800 border border-green-700 rounded-xl p-4 text-sm font-sans text-green-300 leading-relaxed"
              x-text="greeting"
            >
            </div>
          </div>
        </template>

        <!-- Error -->
        <template x-if="status === 'error'">
          <div class="space-y-2">
            <div
              class="text-xs uppercase text-red-400 font-bold tracking-widest"
            >
              ❌ Process Error
            </div>
            <div
              class="bg-red-900/40 border border-red-700 rounded-xl p-4 text-xs font-sans text-red-300"
              x-text="errorMsg"
            >
            </div>
          </div>
        </template>
      </div>

      <!-- Execution Log -->
      <div
        class="border-t border-gray-700 flex-shrink-0"
        style="max-height: 220px; overflow-y: auto"
      >
        <div
          class="text-[10px] uppercase text-gray-500 font-bold px-4 py-2 border-b border-gray-800 tracking-widest sticky top-0 bg-gray-950"
        >
          Execution Log
        </div>
        <div class="divide-y divide-gray-800">
          <template x-for="(entry, i) in log" :key="i">
            <div class="px-4 py-2 flex items-start space-x-2 text-xs font-mono">
              <span x-text="entry.icon" class="flex-shrink-0"></span>
              <span
                class="text-gray-300 flex-1 leading-relaxed font-sans"
                x-text="entry.text"
              ></span>
              <span class="text-gray-600 flex-shrink-0" x-text="entry.ts"></span
              >
            </div>
          </template>
          <template x-if="log.length === 0">
            <div class="px-4 py-3 text-xs text-gray-600 font-sans italic">
              No activity yet.
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  /* bpmn.js viewer container overrides */
  #bpmn-viewer-container .bjs-container {
    background: #f1f5f9 !important;
  }
  #bpmn-viewer-container .djs-palette {
    display: none !important;
  }
</style>
