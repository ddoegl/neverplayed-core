<div class="p-8">
  <div class="flex justify-between items-start mb-8">
    <button
      @click="dismiss()"
      class="text-gray-400 hover:text-gray-600 transition-colors"
    >
      <i class="fas fa-times text-xl"></i>
    </button>
  </div>

  <template x-if="promoFlow?.selectedPromo">
    <div
      class="max-w-2xl mx-auto"
      x-data="{ get promo() { return promoFlow.selectedPromo } }"
    >
      <div class="flex items-center gap-4 mb-6">
        <div
          class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center shadow-sm"
        >
          <i class="fas fa-bullhorn text-xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-gray-900" x-text="promo?.title">
          </h2>
          <div
            class="text-xs font-mono text-gray-400 mt-1"
            x-text="'ID: ' + promo?.id"
          >
          </div>
        </div>
      </div>

      <div class="bg-gray-50 border border-gray-100 rounded-2xl p-6 mb-8">
        <h3 class="font-bold text-gray-800 mb-3">Promotion Details</h3>
        <p class="text-gray-600 leading-relaxed mb-6">
          This promotion is part of our <span
            class="font-semibold text-blue-600"
            x-text="promo?.mode"
          ></span> delivery stream. It was targeted to you based on the <span
            class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-xs"
            x-text="promo?.strategy"
          ></span> strategy.
        </p>

        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
            <div
              class="text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1"
            >
              Source Pipeline
            </div>
            <div
              class="text-sm font-medium text-gray-700"
              x-text="promo?.source || 'Direct Assignment'"
            >
            </div>
          </div>
          <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
            <div
              class="text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1"
            >
              Status
            </div>
            <div
              class="text-sm font-medium text-emerald-600 flex items-center gap-1.5"
            >
              <span
                class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
              ></span>
              Active
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 border-t border-gray-100 pt-8">
        <button
          @click="dismiss()"
          class="px-6 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-semibold transition-colors"
        >
          Back
        </button>
        <button
          @click="await redeemPromo(promo)"
          class="px-8 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md transition-all active:scale-95"
        >
          Redeem Offer
        </button>
      </div>
    </div>
  </template>

  <template x-if="!promoFlow?.selectedPromo">
    <div class="flex flex-col items-center justify-center py-20 text-gray-400">
      <i class="fas fa-search text-4xl mb-4 opacity-20"></i>
      <p>No promotion selected.</p>
    </div>
  </template>
</div>
