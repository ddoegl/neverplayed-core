<div
  x-data="globalThis.promoFlowState"
  class="inset-0 z-50 flex items-center justify-center p-4"
  :class="isContained ? 'absolute' : 'fixed'"
>
  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
    @click="dismiss()"
  >
  </div>

  <!-- Modal Container -->
  <div
    class="relative bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto transform transition-all animate-modalScale"
  >
    <div class="relative">
      {{{flowContent}}}
    </div>
  </div>
</div>

<style>
  @keyframes modalScale {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  .animate-modalScale {
    animation: modalScale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
</style>
