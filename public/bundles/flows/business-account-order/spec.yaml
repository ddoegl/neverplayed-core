id: business-account-order
label: Business Account Order (Industrial)
domainObject:
  strategyId: LOCAL_STRATEGY
  label: Business Account Order (Industrial)
  properties:
    "Product": "Premium Business Account"
    "Status": "Draft"
  actions:
    - id: view
      label: Open Flow
      icon: fas fa-university

permissionKeys:
  BUSINESS_VIEW:
    id: BUSINESS_VIEW
    label: "business:view"
    value: "business:view"

features:
  BUSINESS_FLOWS:
    id: BUSINESS_FLOWS
    label: "business:flows"
    description: "Access to Business Atomic Flows"
    keys:
      - BUSINESS_VIEW

capabilities:
  - id: BUSINESS_USER
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "BUSINESS_FLOWS"
        keys:
          - BUSINESS_VIEW

guards:
  - id: BUSINESS_VIEW
    operator: "OR"
    matchers:
      - type: "matchAlways"
    features:
      - id: "BUSINESS_FLOWS"
        keys:
          - BUSINESS_VIEW
  - id: BUSINESS_VIEW_CASE
    operator: "OR"
    matchers:
      - type: "matchPropertyNotEmpty"
        key: "myCaseId"
  - id: BUSINESS_CAN_CREATE
    operator: "OR"
    matchers:
      - type: "matchPropertyEmpty"
        key: "myCaseId"

ui:
  initialStep: step_init
  steps:
    step_init:
      order: 1
      title: "Account Selection"
      parts:
        hero:
          type: "hero"
          variant: "indigo"
          icon: "fas fa-university"
          title: "New Business Account"
          subtitle: "Expand your business capabilities with a premium corporate account for **${activeLicense.id}**."

        card_selection:
          type: "card"
          title: "Account Owner"
          icon: "fas fa-building"
          parts:
            selectedMemberId:
              kind: "select-input"
              label: "License Member"
              description: "Select the legal entity that will own this account."
              optionSource: "{{currentMembers}}"

        testInput:
          kind: "text-input"
          label: "Test Input"
          description: "Test Input"
          value: "test"

        action_row:
          type: "row"
          parts:
            next_btn:
              kind: "command-button"
              variant: "primary"
              label: "Continue to Signee"
              call: "NEXT_STEP"

    step_fellow:
      order: 2
      title: "Signee Assignment"
      parts:
        hero:
          type: "hero"
          variant: "emerald"
          icon: "fas fa-user-tie"
          title: "Account Signee"
          subtitle: "Select the authorized representative for **{{selectedMemberId}}**."

        test_summary:
          type: "text"
          value: |
            ## Review Info
            **Member ID**: {{selectedMemberId}}
            **Test Input**: ${testInput}

        card_signee:
          type: "card"
          title: "Authorized Representative"
          icon: "fas fa-signature"
          parts:
            fellowId:
              kind: "select-input"
              label: "Account Signee"
              description: "This person will receive the signing request."
              optionSource: "{{currentFellows}}"

        action_row:
          type: "row"
          parts:
            back_btn:
              kind: "command-button"
              variant: "default"
              label: "Back"
              call: "PREV_STEP"
            next_btn:
              kind: "command-button"
              variant: "primary"
              label: "Review Order"
              call: "NEXT_STEP"

    step_summary:
      order: 3
      title: "Order Finalization"
      parts:
        hero:
          type: "hero"
          variant: "indigo"
          icon: "fas fa-clipboard-check"
          title: "Confirm Details"
          subtitle: "Please verify your account configuration before placing the order."

        case_monitor:
          type: "card"
          variant: "plain"
          label: "Live Order Status"
          parts:
            status_row:
              type: row
              parts:
                id_badge:
                  type: text
                  value: "🆔 **Case ID:** `${myCaseId || '---'}`"
                status_badge:
                  type: text
                  value: "📡 **Status:** `${myCaseIdStatus || 'INITIALIZING...'}`"
          guard: BUSINESS_VIEW_CASE

        summary_card:
          type: "card"
          title: "Order Details"
          parts:
            details:
              type: "text"
              value: |
                **Account Owner:** ${selectedMemberId}
                **Representative:** ${fellowId}
                **Product:** Premium Business Account

                > [!NOTE]
                > Placing this order will initiate a multi-party signing process via the OSGi Signing Engine.

        btn_row:
          type: "row"
          parts:
            back_btn:
              kind: "command-button"
              variant: "default"
              label: "Back"
              call: "PREV_STEP"
              guard: BUSINESS_CAN_CREATE
            submit_btn:
              kind: "command-button"
              variant: "success"
              label: "Place Official Order"
              call: "synthetic.case.create"
              params:
                caseTypeId: "business-account-order"
                companyId: "${selectedMemberId}"
                targetPersonId: "${fellowId}"
                linkToProperty: "myCaseId"
                onSuccess: "WAIT_FOR_CASE"
                successMessage: "Your order has been placed! A signing case has been created for ${selectedMemberId}. ✅"
              guard: BUSINESS_CAN_CREATE

caseTypes:
  business-account-order:
    id: "business-account-order"
    name: "Business Account Enrollment"
    strategyId: "JOINT_SIGNATURE"
    description: "Enrollment for a business account, requiring signatures from Company LRs and the Individual."
