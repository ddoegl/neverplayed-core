<div class="p-4">
    <div class="grid grid-cols-4 gap-4">
        <!-- Bottom: Options -->
        <div class="col-span-2 bg-white p-6 rounded shadow-md">
            <h3 class="text-xl font-bold mb-4">Order Options</h3>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold mb-1">Option 1</label>
                    <input
                        type="text"
                        class="w-full border p-2 rounded text-sm"
                    />
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Option 2</label>
                    <input
                        type="text"
                        class="w-full border p-2 rounded text-sm"
                    />
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Option 3</label>
                    <input
                        type="text"
                        class="w-full border p-2 rounded text-sm"
                    />
                </div>
            </div>
        </div>

        <!-- Right Column: Order Summary -->
        <div class="col-span-2 bg-white p-6 rounded shadow-md">
            <h3 class="text-xl font-bold mb-4">Order Summary</h3>
            <hr class="mb-4" />

            <div class="mb-4">
                <span
                    class="block text-sm font-bold"
                    x-text="currentApplication?.productName"
                ></span>
                <span
                    x-text="companies.find(c => c.id === currentApplication?.companyId)?.name"
                ></span>
            </div>

            <div class="mb-4">
                <span class="block text-sm font-bold">Card Holder</span>
                <div
                    class="mt-1"
                    x-text="fellows.find(a => a.id === currentApplication?.fellowId)?.firstname + ' ' + fellows.find(a => a.id === currentApplication?.fellowId)?.lastname || 'Open'"
                >
                    Open
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold">Option 1</label>
                <div class="border p-2 rounded bg-gray-50 text-sm">
                    Some Option 1
                </div>
            </div>

            <div class="mt-8">
                <button
                    class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
                    :disabled="!currentApplication?.fellowId || currentApplication.fellowId === 'NONE'"
                    @click="submitApplication()"
                >
                    Conclude Order
                </button>
                <p class="text-xs text-gray-500 mt-2 text-center">
                    In this demo, you can proceed by switching roles or
                    navigating to Step 3 manually.
                </p>
                <button
                    class="w-full mt-4 bg-green-600 text-white font-bold py-2 px-4 rounded"
                    @click="loadStep('step3.0')"
                >
                    Proceed to Redemption (Invitee View)
                </button>
            </div>
        </div>
    </div>
</div>
