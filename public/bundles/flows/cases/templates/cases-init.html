<div class="col-span-4 h-full flex flex-col">
  <h2 class="text-2xl font-bold mb-4">
    <span x-text="selectedCompany?.name"></span>: Cases
  </h2>

  <div class="flex-1 overflow-y-auto pr-2">
    <!-- Pending Cases -->
    <h3 class="text-lg font-bold text-gray-700 mb-2 border-b pb-1">
      Pending Cases
    </h3>
    <div class="grid gap-4 mb-8">
      <template x-if="pendingCases.length === 0">
        <div class="text-gray-500 italic pb-4">
          No pending cases for this member.
        </div>
      </template>
      <template x-for="caseItem in pendingCases" :key="caseItem.id">
        <div class="bg-white p-4 rounded shadow border border-yellow-200">
          <div class="flex justify-between items-start">
            <div>
              <h4
                class="font-bold text-lg"
                x-text="caseItem.name"
              >
              </h4>
              <p
                class="text-sm text-gray-600"
                x-text="caseItem.description"
              >
              </p>
              <div class="mt-2 text-xs text-gray-500">
                Signatures:
                <span
                  x-text="caseItem.signatures.filter(s => s.status === 'pending').length"
                ></span> pending
              </div>
            </div>
            <button
              class="text-blue-600 font-bold hover:underline"
              @click="selectCase(caseItem); loadStep('case-details')"
            >
              View Details &rarr;
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- Closed Cases -->
    <h3 class="text-lg font-bold text-gray-700 mb-2 border-b pb-1">
      Closed Cases
    </h3>
    <div class="grid gap-4">
      <template x-if="signedCases.length === 0">
        <div class="text-gray-500 italic">No closed cases.</div>
      </template>
      <template x-for="caseItem in signedCases" :key="caseItem.id">
        <div
          class="bg-white p-4 rounded shadow border border-gray-200 opacity-75"
        >
          <div class="flex justify-between items-start">
            <div>
              <h4
                class="font-bold text-lg text-gray-800"
                x-text="caseItem.name"
              >
              </h4>
              <p
                class="text-sm text-gray-600"
                x-text="caseItem.description"
              >
              </p>
              <div class="mt-2 text-xs text-green-600 font-bold">
                &#10003; Signed
              </div>
            </div>
            <button
              class="text-blue-600 font-bold hover:underline"
              @click="selectCase(caseItem); loadStep('case-details')"
            >
              View Details &rarr;
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
