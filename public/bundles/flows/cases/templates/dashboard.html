<div class="flex flex-col w-full p-8 space-y-8">
  <h2 class="text-2xl font-bold">Case Management</h2>

  <!-- 1. Signature Tasks Section (Only if pending tasks exist for non-members) -->
  <template x-if="signatureTasks.length > 0">
    <div class="space-y-4">
      <div class="flex items-center gap-2 text-amber-600">
        <i class="fas fa-file-signature text-xl"></i>
        <h3 class="text-lg font-bold uppercase tracking-wider">
          Signature Tasks for You
        </h3>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-1 gap-4">
        <template x-for="task in signatureTasks" :key="task.id">
          <div
            class="bg-amber-50 p-6 rounded-xl shadow-sm border border-amber-200 cursor-pointer hover:shadow-md hover:border-amber-400 transition-all group"
            @click="viewCase(task.id)"
          >
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-amber-600 shadow-sm"
                >
                  <i class="fas fa-pen-nib"></i>
                </div>
                <div>
                  <div
                    class="text-lg font-bold text-slate-800"
                    x-text="task.metadata?.title || task.name"
                  >
                  </div>
                  <div
                    class="text-sm text-slate-500 font-mono"
                    x-text="task.id"
                  >
                  </div>
                </div>
              </div>
              <div
                class="px-4 py-2 bg-amber-600 text-white rounded-lg text-xs font-bold uppercase tracking-widest shadow-sm group-hover:bg-amber-700 transition-colors"
              >
                Sign Now &rarr;
              </div>
            </div>
            <p
              class="mt-4 text-sm text-slate-600 line-clamp-2"
              x-text="task.metadata?.description"
            >
            </p>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- 2. Registered Members Section -->
  <div class="space-y-4">
    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest px-1">
      Registered License Members
    </h3>

    <!-- Empty State Disclaimer -->
    <template x-if="filteredLicenseMembers.length === 0">
      <div
        class="bg-slate-50 border border-dashed border-slate-300 rounded-2xl p-12 text-center flex flex-col items-center gap-4"
      >
        <div
          class="w-16 h-16 rounded-full bg-white flex items-center justify-center text-slate-300 shadow-sm text-2xl"
        >
          <i class="fas fa-users-slash"></i>
        </div>
        <div>
          <h4 class="text-lg font-bold text-slate-800">
            No Members Registered
          </h4>
          <p class="text-slate-500 max-w-sm mt-1">
            Your current license <strong><span x-text="currentLicenseId"></span
              ></strong> does not have any registered license members yet.
          </p>
        </div>
      </div>
    </template>

    <!-- Member Grid -->
    <div class="grid grid-cols-1 md:grid-cols-1 gap-4">
      <template x-for="company in filteredLicenseMembers" :key="company.id">
        <div
          class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-blue-300 transition-all group"
          @click="selectCompany(company); loadStep('cases-init')"
        >
          <div class="flex items-center gap-4">
            <div
              class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600"
            >
              <i
                :class="company.type === 'person' ? 'fas fa-user' : 'fas fa-building'"
              ></i>
            </div>
            <div>
              <div
                class="text-lg font-bold text-slate-800"
                x-text="company.displayName"
              >
              </div>
              <div class="text-sm text-slate-500 font-mono" x-text="company.id">
              </div>
            </div>
          </div>
          <div class="mt-4 flex justify-end">
            <span
              class="text-blue-600 text-sm font-bold group-hover:translate-x-1 transition-transform"
            >Open Case File &rarr;</span>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
