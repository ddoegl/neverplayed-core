<div class="col-span-4 h-full flex flex-col">
  <div class="flex items-center mb-4">
    <button
      @click="loadStep('cases-init')"
      class="mr-4 text-gray-500 hover:text-gray-700"
    >
      &larr; Back
    </button>
    <h2 class="text-2xl font-bold" x-text="selectedCase?.name"></h2>
  </div>

  <div class="flex-1 overflow-y-auto bg-white p-6 rounded shadow border">
    <!-- Content -->
    <div x-html="selectedCase?.html" class="prose max-w-none mb-8"></div>

    <!-- Signatures Area -->
    <div class="border-t pt-6" x-show="selectedCase?.status === 'pending'">
      <h3 class="font-bold text-lg mb-4">Required Signatures</h3>
      <div class="flex flex-col gap-4">
        <template
          x-for="(sig, index) in selectedCase?.signatures"
          :key="index"
        >
          <div
            class="flex items-center justify-between bg-gray-50 p-4 rounded border"
          >
            <span class="font-bold flex flex-col">
              <span class="capitalize" x-text="sig.signee"></span>
              <span
                class="text-xs text-gray-500 font-normal uppercase"
                x-text="sig.role || 'Signer'"
              ></span>
              <span
                x-show="sig.status === 'signed'"
                class="text-green-600 text-sm mt-1"
              >&#10003; Signed</span>
            </span>

            <button
              x-show="sig.status === 'pending' && canSign(sig)"
              class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition"
              @click="signCase(selectedCase.id, sig.signee, index)"
            >
              Sign
            </button>
            <span
              x-show="sig.status === 'pending' && !canSign(sig)"
              class="text-amber-600 italic text-sm"
            >Awaiting Signature</span>
            <span
              x-show="sig.status === 'signed'"
              class="text-gray-400 italic text-sm"
            >Completed</span>
          </div>
        </template>
      </div>
    </div>

    <div
      class="mt-8 text-center"
      x-show="selectedCase?.status === 'signed'"
    >
      <div class="bg-green-100 text-green-800 p-4 rounded inline-block">
        This case is fully signed and closed.
      </div>
    </div>
  </div>
</div>
