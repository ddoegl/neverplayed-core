<!-- RETAIL CHANNEL DESIGN (Emerald) -->
<template x-if="currentChannel === 'retail'">
  <div class="flex flex-col h-full bg-white p-6">
    <div class="flex-1 flex flex-col justify-center items-center space-y-8">
      <!-- Logo/Branding -->
      <div class="text-center space-y-3">
        <div
          class="w-16 h-16 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl shadow-xl shadow-emerald-100 flex items-center justify-center mx-auto"
        >
          <i class="fas fa-leaf text-2xl text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-black text-slate-800 tracking-tight">
            Retail<span class="text-emerald-600">App</span>
          </h1>
        </div>
      </div>

      <!-- Login Fields -->
      <div class="w-full space-y-4">
        <div class="space-y-1">
          <label
            class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2"
          >Account Login</label>
          <div class="relative group">
            <i
              class="fas fa-at absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-emerald-500 transition-colors"
            ></i>
            <input
              type="text"
              x-model="loginForm.identifier"
              @keyup.enter="loginUser(loginForm.identifier)"
              placeholder="Email or Account ID"
              class="w-full bg-white border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all outline-none shadow-sm"
            />
          </div>
        </div>

        <div class="flex items-center justify-between px-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="checkbox"
              class="rounded border-slate-300 text-emerald-600 shadow-sm focus:border-emerald-300 focus:ring focus:ring-emerald-200 focus:ring-opacity-50"
              checked
            >
            <span class="text-xs text-slate-500 font-medium"
            >Keep me signed in</span>
          </label>
          <a href="#" class="text-xs text-emerald-600 font-bold hover:underline"
          >Trouble logging in?</a>
        </div>
      </div>

      <!-- Actions -->
      <div class="w-full space-y-3">
        <button
          @click="loginUser(loginForm.identifier)"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-100 active:scale-[0.98] transition-all flex items-center justify-center gap-3 text-sm"
        >
          Log In
          <i class="fas fa-lock text-[10px] opacity-50"></i>
        </button>
        <div class="flex items-center gap-4 py-2">
          <div class="flex-1 h-px bg-slate-200"></div>
          <span
            class="text-[10px] font-bold text-slate-300 uppercase tracking-widest"
          >or Secure Bio</span>
          <div class="flex-1 h-px bg-slate-200"></div>
        </div>
        <button
          class="w-full bg-white border border-slate-200 text-slate-600 font-bold py-3.5 rounded-xl flex items-center justify-center gap-3 active:bg-slate-50 transition-all shadow-sm text-sm"
        >
          <i class="fas fa-fingerprint text-lg text-emerald-500"></i>
          FaceID / TouchID
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center py-4 space-y-2">
      <div
        class="flex justify-center gap-4 text-[10px] text-slate-400 font-bold uppercase tracking-widest"
      >
        <span>Privacy</span>
        <span>Terms</span>
        <span>Security</span>
      </div>
      <p class="text-[10px] text-slate-300 font-medium italic">
        Retail App v2.4.0 • Level 4 Security
      </p>
    </div>
  </div>
</template>

<!-- BUSINESS CHANNEL DESIGN (Blue) -->
<template x-if="currentChannel === 'business'">
  <div
    class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50/50"
  >
    <div
      class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100"
    >
      <div>
        <div
          class="mx-auto h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg mb-6"
        >
          <i class="fas fa-lock text-white text-2xl"></i>
        </div>
        <h2
          class="text-center text-3xl font-extrabold text-gray-900 tracking-tight"
        >
          Sign in to your account
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Enter your User ID or Alias to continue
        </p>
      </div>

      <div class="mt-8 space-y-6">
        <div class="rounded-md shadow-sm -space-y-px">
          <div>
            <label for="identifier" class="sr-only">User ID or Alias</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              required
              x-model="loginForm.identifier"
              @keyup.enter="loginUser(loginForm.identifier)"
              class="appearance-none rounded-xl relative block w-full px-4 py-4 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm transition-all"
              placeholder="e.g. Daniela or 1001"
            >
          </div>
        </div>

        <div>
          <button
            @click="loginUser(loginForm.identifier)"
            class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all shadow-lg active:scale-[0.98]"
          >
            <span class="absolute left-0 inset-y-0 flex items-center pl-3">
              <i
                class="fas fa-sign-in-alt text-blue-500 group-hover:text-blue-400 transition-colors"
              ></i>
            </span>
            Sign in
          </button>
        </div>

        <div class="text-center">
          <button
            @click="selectFlow('real-life')"
            class="text-sm font-medium text-gray-500 hover:text-gray-700 transition"
          >
            Cancel and return to Real Life
          </button>
        </div>
      </div>
    </div>
  </div>
</template>
