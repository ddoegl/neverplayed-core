<div class="flex flex-col w-full p-8">
  <h2 class="text-2xl font-bold mb-4">License Members</h2>

  <template x-if="filteredLicenseMembers.length === 0">
    <div
      class="bg-blue-50 text-blue-800 p-6 rounded-lg text-center border border-blue-200"
    >
      <i class="fas fa-info-circle text-2xl mb-2 opacity-70"></i>
      <p>
        Your current license <strong><span x-text="currentLicense"></span
          ></strong> does not have any registered license members yet.
      </p>
    </div>
  </template>

  <div class="flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-1 gap-4">
    <template x-for="member in filteredLicenseMembers" :key="member.id">
      <div
        class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-blue-300 transition-all group"
        @click="selectCompany(member); loadStep('authorization-init')"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600"
          >
            <i :class="member.firstname ? 'fas fa-user' : 'fas fa-building'"></i
            >
          </div>
          <div>
            <div
              class="text-lg font-bold text-slate-800"
              x-text="member.displayName"
            >
            </div>
            <div class="text-sm text-slate-500 font-mono" x-text="member.id">
            </div>
          </div>
        </div>
        <div class="mt-4 flex justify-end">
          <span
            class="text-blue-600 text-sm font-bold group-hover:translate-x-1 transition-transform"
          >Manage Authorizations &rarr;</span>
        </div>
      </div>
    </template>
  </div>
</div>
