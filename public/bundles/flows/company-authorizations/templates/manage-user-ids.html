<div class="h-full">
  <h2 class="text-2xl font-bold mb-4">Manage User IDs</h2>
  <hr class="mb-4" />

  <div
    class="mb-6 p-4 bg-gray-50 rounded border"
    x-show="getPersonPossessions(currentFellow.personId).length > 0"
  >
    <h3 class="font-bold mb-2 text-gray-700">User IDs</h3>
    <ul class="space-y-2">
      <template
        x-for="possession in getPersonPossessions(currentFellow.personId)"
      >
        <li
          class="flex justify-between items-center bg-white p-2 rounded shadow-sm border"
        >
          <div class="flex items-center space-x-2">
            <template x-if="possession.isOwner">
              <span title="Corporate Owner" class="text-amber-500"><i
                  class="fas fa-crown"
                ></i></span>
            </template>
            <template x-if="possession.isHolder">
              <span title="Private Holder" class="text-indigo-500"><i
                  class="fas fa-handshake"
                ></i></span>
            </template>
            <span x-text="possession.id" class="font-medium"></span>
          </div>
          <span
            class="text-blue-500 hover:text-blue-700 text-sm font-bold cursor-pointer hover:underline"
            @click="managePermissions(possession.id)"
          >
            Manage Permissions
          </span>
        </li>
      </template>
    </ul>
  </div>

  <div class="mb-2">
    <h3 class="font-bold mb-2">Order or Assign User ID</h3>
  </div>

  <user-selector
    x-model="selectedUser"
    x-effect="$el.users = availableUsers"
  ></user-selector>

  <!-- Assignment Form -->
  <div
    x-show="selectedUser !== 'NONE'"
    class="mt-4 p-4 border rounded bg-gray-50 space-y-4"
  >
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold uppercase text-gray-500 mb-1"
        >User Name</label>
        <span
          x-text="selectedUserData?.alias + ' ' + selectedUserData?.firstname + ' ' + selectedUserData?.lastname"
        ></span>
      </div>
    </div>

    <button
      class="w-full bg-blue-600 text-white font-bold py-3 rounded shadow hover:bg-blue-700 transition flex items-center justify-center space-x-2"
      @click="assignUserID('Owner')"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
        >
        </path>
      </svg>
      <span>Sign & Assign</span>
    </button>
  </div>
</div>
