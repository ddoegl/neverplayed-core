<div class="col-span-4">
    <h2 class="text-2xl font-bold mb-4">Dashboard: Available Cards</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <template x-for="card in cards" :key="card.id">
            <div
                class="bg-white p-4 rounded shadow cursor-pointer hover:shadow-lg transition-shadow"
                @click="selectCard(card); loadStep('order-init')"
            >
                <div x-html="card.html"></div>
                <div class="mt-4 text-right">
                    <span class="text-blue-600 text-sm font-bold"
                    >Order Cards &rarr;</span>
                </div>
            </div>
        </template>
    </div>
</div>
