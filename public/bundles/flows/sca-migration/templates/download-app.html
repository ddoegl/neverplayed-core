<div
  class="flex flex-col items-center justify-center min-h-[400px] p-8 text-center animate-fadeIn"
>
  <div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-4">
      Get the Business Channel App
    </h2>
    <p class="text-gray-600 leading-relaxed max-w-md mx-auto">
      Scan the QR code below to download the app and follow the setup
      instructions.
    </p>
  </div>

  <div
    class="relative bg-white p-6 rounded-3xl shadow-xl border border-gray-100 mb-8 group transition-all hover:scale-105"
  >
    <!-- QR Code Placeholder -->
    <div
      class="w-48 h-48 bg-slate-50 rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-gray-200"
    >
      <i class="fas fa-qrcode text-6xl text-slate-300 mb-3"></i>
      <span
        class="text-[10px] uppercase tracking-widest font-bold text-gray-400"
      >Scan to Download</span>
    </div>

    <!-- App Store Badges -->
    <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 flex gap-2 w-max">
      <div
        class="bg-black text-white px-2 py-1 rounded-md text-[8px] flex items-center gap-1 shadow-md"
      >
        <i class="fab fa-apple"></i> App Store
      </div>
      <div
        class="bg-black text-white px-2 py-1 rounded-md text-[8px] flex items-center gap-1 shadow-md"
      >
        <i class="fab fa-google-play"></i> Google Play
      </div>
    </div>
  </div>

  <div
    class="bg-gray-50 rounded-2xl p-4 mb-8 text-sm text-gray-500 max-w-xs mx-auto"
  >
    <i class="fas fa-mobile-alt mr-2"></i>
    Already have the app? Open it and look for the migration banner.
  </div>

  <div class="flex flex-col gap-3 w-full max-w-xs mx-auto">
    <button
      @click="loadStep('confirm-legacy')"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg active:scale-[0.98]"
    >
      I've Installed the App
    </button>

    <button
      @click="loadStep('intro')"
      class="text-gray-400 hover:text-gray-600 text-sm font-medium py-2"
    >
      <i class="fas fa-arrow-left mr-1"></i> Back
    </button>
  </div>
</div>
