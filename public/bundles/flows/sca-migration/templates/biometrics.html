<div
  class="flex flex-col items-center justify-center min-h-[400px] p-8 text-center animate-fadeIn"
>
  <div
    class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-3xl flex items-center justify-center mb-6 shadow-sm"
  >
    <i class="fas fa-fingerprint text-4xl"></i>
  </div>

  <h2 class="text-2xl font-bold text-gray-900 mb-4">Make it faster</h2>

  <p class="text-gray-600 mb-8 leading-relaxed max-w-sm mx-auto">
    Activate biometrics (Face ID or Touch ID) to authorize transactions even
    faster without entering your PIN every time.
  </p>

  <div
    class="bg-indigo-50/50 rounded-2xl p-6 border border-indigo-100 mb-8 max-w-xs mx-auto"
  >
    <div class="flex items-center justify-between gap-4">
      <div class="text-left">
        <div class="font-bold text-indigo-900 text-sm">Biometric Login</div>
        <div class="text-[10px] text-indigo-600/70 font-medium">
          Use FaceID or TouchID
        </div>
      </div>
      <div class="w-12 h-6 bg-indigo-600 rounded-full p-1 flex justify-end">
        <div class="w-4 h-4 bg-white rounded-full shadow-sm"></div>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-3 w-full max-w-xs mx-auto">
    <button
      @click="loadStep('success')"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg active:scale-[0.98]"
    >
      Enable Biometrics
    </button>

    <button
      @click="loadStep('success')"
      class="text-gray-500 hover:text-gray-800 text-sm font-medium py-2"
    >
      Maybe later
    </button>
  </div>
</div>
