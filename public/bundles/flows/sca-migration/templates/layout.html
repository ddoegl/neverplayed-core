<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
    @click="await selectFlow(subflowReturnFlow || 'user-home')"
  >
  </div>

  <!-- Modal Container -->
  <div
    class="relative bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col transform transition-all animate-modalScale"
  >
    <!-- Sticky Header -->
    <div
      class="bg-indigo-700 text-white p-6 flex justify-between items-center shrink-0"
    >
      <div class="flex items-center gap-3">
        <i class="fas fa-shield-alt text-2xl opacity-50"></i>
        <h2
          class="text-xl font-black uppercase tracking-widest"
          x-text="flowName"
        >
        </h2>
      </div>
      <button
        @click="await selectFlow(subflowReturnFlow || 'user-home')"
        class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto p-8 relative">
      {{{flowContent}}}
    </div>
  </div>
</div>

<style>
  @keyframes modalScale {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  .animate-modalScale {
    animation: modalScale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
</style>
