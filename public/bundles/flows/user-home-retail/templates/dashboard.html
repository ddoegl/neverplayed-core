<div
  class="flex flex-col h-full overflow-y-auto w-full relative"
  x-data="{ detailTab: 'promotions' }"
>
  <div class="max-w-7xl mx-auto w-full p-4 md:p-8 pt-8 md:pt-12">
    <div class="mb-10 flex items-center justify-between">
      <div>
        <h1 
          class="font-bold text-gray-800 tracking-tight mb-2"
          :class="isMobile ? 'text-2xl' : 'text-4xl'"
        >
          Welcome, <span
            x-text="currentUser?.alias || currentUser?.firstname || 'User'"
          ></span>
        </h1>
        <p class="text-gray-500 text-lg" :class="isMobile ? 'text-sm' : 'text-lg'">
          Manage your workflows, permissions, and active promotional targeting
          below.
        </p>
      </div>
    </div>

    <div 
      class="flex flex-wrap border-b border-gray-200 pb-4"
      :class="isMobile ? 'gap-1' : 'gap-2 mb-8'"
    >
      <div
        class="cursor-pointer rounded-lg transition-colors font-semibold tracking-wide flex items-center gap-2"
        :class="{ 
          'text-gray-800': detailTab === 'promotions', 
          'text-gray-500 hover:bg-gray-100 hover:text-gray-900': detailTab !== 'promotions',
          'px-2 py-1.5 text-[11px]': isMobile,
          'px-3 md:px-6 py-2 md:py-2.5 text-xs md:text-sm': !isMobile
        }"
        @click="detailTab = 'promotions'"
      >
        <i class="fa-solid fa-bullhorn" :class="isMobile ? 'text-[10px]' : ''"></i> Promotions
      </div>
      <div
        class="cursor-pointer rounded-lg transition-colors font-semibold tracking-wide flex items-center gap-2"
        :class="{ 
          'text-gray-800': detailTab === 'topics', 
          'text-gray-500 hover:bg-gray-100 hover:text-gray-900': detailTab !== 'topics',
          'px-2 py-1.5 text-[11px]': isMobile,
          'px-3 md:px-6 py-2 md:py-2.5 text-xs md:text-sm': !isMobile
        }"
        @click="detailTab = 'topics'"
      >
        <i class="fa-solid fa-tags" :class="isMobile ? 'text-[10px]' : ''"></i> Topics
      </div>
      <div
        class="cursor-pointer rounded-lg transition-colors font-semibold tracking-wide flex items-center gap-2"
        :class="{ 
          'text-gray-800': detailTab === 'capabilities', 
          'text-gray-500 hover:bg-gray-100 hover:text-gray-900': detailTab !== 'capabilities',
          'px-2 py-1.5 text-[11px]': isMobile,
          'px-3 md:px-6 py-2 md:py-2.5 text-xs md:text-sm': !isMobile
        }"
        @click="detailTab = 'capabilities'"
      >
        <i class="fa-solid fa-shield-halved" :class="isMobile ? 'text-[10px]' : ''"></i> Capabilities
      </div>
    </div>

    <!-- PROMOTIONS TAB -->
    <div
      x-show="detailTab === 'promotions'"
      class="pb-16"
      x-transition.opacity.duration.300ms
    >
      <template
        x-if="!currentUserCap?.campaigns || currentUserCap.campaigns.length === 0"
      >
        <div
          class="bg-blue-500/10 border-dashed border border-blue-500/20 p-12 rounded-2xl text-center flex flex-col items-center"
        >
          <div
            class="w-16 h-16 rounded-full bg-blue-50 text-blue-400 flex items-center justify-center mb-4"
          >
            <i class="fa-solid fa-bullhorn text-2xl"></i>
          </div>
          <h3 class="text-xl font-semibold text-gray-800 mb-2">
            No Active Promotions
          </h3>
          <p class="text-gray-500 max-w-md mx-auto">
            There are currently no active campaign segments targeting your user
            profile.
          </p>
        </div>
      </template>

      <template
        x-if="currentUserCap?.campaigns && currentUserCap.campaigns.length > 0"
      >
        <div
          class="bg-gray-50 border border-gray-200 p-6 rounded-2xl transition-colors duration-200 shadow-xl"
        >
          <div
            class="font-semibold text-blue-400 text-lg mb-6 border-b border-gray-200 pb-4 flex items-center gap-3"
          >
            <i class="fa-solid fa-bullseye"></i> Active Campaigns
          </div>
          <div class="flex flex-col gap-3 md:gap-4">
            <div
              x-show="!isMobile"
              class="hidden md:grid md:grid-cols-[minmax(200px,2fr)_minmax(120px,1fr)_minmax(120px,1fr)_minmax(100px,1fr)_minmax(150px,1.5fr)] gap-6 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-gray-100 bg-white rounded-t-lg"
            >
              <div>Campaign Title</div>
              <div>ID / Strategy</div>
              <div>Channels</div>
              <div>Mode</div>
              <div>Granted Via</div>
            </div>
            <template x-for="camp in currentUserCap?.campaigns" :key="camp.id">
              <div
                class="bg-white rounded-xl border border-gray-100 hover:bg-gray-50 hover:border-gray-200 transition-all shadow-sm cursor-pointer"
                :class="isMobile ? 'flex flex-col p-4 gap-3' : 'md:grid md:grid-cols-[minmax(200px,2fr)_minmax(120px,1fr)_minmax(120px,1fr)_minmax(100px,1fr)_minmax(150px,1.5fr)] gap-6 p-6 md:py-4 items-center'"
                @click="viewPromo(camp)"
              >
                <div
                  class="font-semibold text-gray-800 break-words flex items-center gap-3 w-full"
                  :class="isMobile ? 'text-[14px]' : 'text-[15px]'"
                >
                  <div
                    class="w-7 h-7 md:w-8 md:h-8 rounded bg-blue-50 text-blue-400 flex items-center justify-center border border-blue-500/30 flex-shrink-0"
                  >
                    <i class="fa-solid fa-bolt text-[10px] md:text-xs"></i>
                  </div>
                  <span x-text="camp.title"></span>
                </div>
                
                <div class="w-full">
                  <div class="text-gray-400 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold'">ID & Strategy</div>
                  <div
                    class="font-mono text-gray-500 break-all mb-1.5"
                    :class="isMobile ? 'text-[10px]' : 'text-xs'"
                    x-text="camp.id"
                  >
                  </div>
                  <span
                    class="inline-flex items-center gap-1.5 px-2 py-0.5 md:px-2.5 md:py-1 rounded-md bg-blue-500/10 text-blue-700 border border-blue-500/20 uppercase tracking-widest font-semibold font-mono"
                    :class="isMobile ? 'text-[9px]' : 'text-[10px]'"
                    x-html="'<i class=\'fas fa-code-branch text-blue-400/50\'></i> ' + camp.strategy"
                  ></span>
                </div>

                <div class="w-full">
                  <div class="text-gray-400 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold'">Channels</div>
                  <div class="flex flex-wrap gap-1">
                    <template
                      x-for="c in (Array.isArray(camp.channels) ? camp.channels : (camp.channels ? [camp.channels] : ['business']))"
                    >
                      <span
                        class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200 font-bold uppercase tracking-tighter"
                        :class="isMobile ? 'text-[9px]' : 'text-[10px]'"
                        x-text="c"
                      ></span>
                    </template>
                  </div>
                </div>

                <div class="w-full">
                  <div class="text-gray-400 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold'">Mode</div>
                  <span
                    class="inline-flex items-center gap-1.5 px-2 py-0.5 md:px-2.5 md:py-1 rounded-md bg-amber-500/10 text-amber-700 border border-amber-500/20 uppercase tracking-widest font-semibold font-mono"
                    :class="isMobile ? 'text-[9px]' : 'text-[10px]'"
                    x-text="camp.mode || 'banner'"
                  ></span>
                </div>

                <div class="w-full">
                  <div class="text-gray-400 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold'">Granted Via</div>
                  <template x-if="!camp.source">
                    <span class="text-slate-500 italic" :class="isMobile ? 'text-[10px]' : 'text-xs'"
                    >Evaluation Source Unknown</span>
                  </template>
                  <template x-if="camp.source">
                    <span
                      class="inline-block px-2 py-1 md:px-3 md:py-1.5 rounded-lg bg-white text-gray-600 border border-slate-700 shadow-inner break-words font-medium"
                      :class="isMobile ? 'text-[10px]' : 'text-xs'"
                      x-text="camp.source"
                    ></span>
                  </template>
                </div>

                <div class="col-span-full w-full mt-2 flex justify-end md:justify-end">
                  <button
                    @click.stop="viewPromo(camp)"
                    class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md transition-colors w-full md:w-auto"
                  >
                    View Details
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>



    <!-- TOPICS TAB -->
    <div
      x-show="detailTab === 'topics'"
      class="pb-16"
      x-transition.opacity.duration.300ms
    >
      <template
        x-if="!currentUserCap?.topics || currentUserCap.topics.length === 0"
      >
        <div
          class="bg-emerald-50 border-dashed border border-emerald-200 p-12 rounded-2xl text-center flex flex-col items-center"
        >
          <div
            class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-4"
          >
            <i class="fa-solid fa-tags text-2xl"></i>
          </div>
          <h3 class="text-xl font-semibold text-gray-800 mb-2">
            No Active Topics
          </h3>
          <p class="text-gray-500 max-w-md mx-auto">
            There are currently no conversational or functional topics mapped to
            your profile.
          </p>
        </div>
      </template>

      <template
        x-if="currentUserCap?.topics && currentUserCap.topics.length > 0"
      >
        <div
          class="bg-gray-50 border border-gray-200 p-6 rounded-2xl transition-colors duration-200 shadow-xl"
        >
          <div
            class="font-semibold text-emerald-600 text-lg mb-6 border-b border-gray-200 pb-4 flex items-center gap-3"
          >
            <i class="fa-solid fa-hashtag"></i> Enrolled Topics
          </div>
          <div class="flex flex-col gap-3 md:gap-4">
            <div
              x-show="!isMobile"
              class="hidden md:grid md:grid-cols-[minmax(250px,2fr)_minmax(200px,1.5fr)_minmax(200px,2fr)] gap-6 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-gray-100 bg-white rounded-t-lg"
            >
              <div>Topic Title</div>
              <div>ID & Strategy Target</div>
              <div>Granted Via Pipeline</div>
            </div>
            <template x-for="topic in currentUserCap?.topics" :key="topic.id">
              <div
                class="bg-white rounded-xl border border-gray-100 hover:bg-gray-50 hover:border-gray-200 transition-all shadow-sm"
                :class="isMobile ? 'flex flex-col p-4 gap-3' : 'md:grid md:grid-cols-[minmax(250px,2fr)_minmax(200px,1.5fr)_minmax(200px,2fr)] gap-6 p-6 md:py-4 items-center'"
              >
                <div
                  class="font-semibold text-gray-800 break-words flex items-center gap-3 w-full"
                  :class="isMobile ? 'text-[14px]' : 'text-[15px]'"
                >
                  <div
                    class="w-7 h-7 md:w-8 md:h-8 rounded bg-emerald-100 text-emerald-600 flex items-center justify-center border border-emerald-300 flex-shrink-0"
                  >
                    <i class="fa-solid fa-comment-dots text-[10px] md:text-xs"></i>
                  </div>
                  <span x-text="topic.title"></span>
                </div>
                <div class="w-full">
                  <div class="text-emerald-600 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold'">ID & Strategy</div>
                  <div
                    class="font-mono text-gray-500 break-all mb-1.5"
                    :class="isMobile ? 'text-[10px]' : 'text-xs'"
                    x-text="topic.id"
                  >
                  </div>
                  <span
                    class="inline-flex items-center gap-1.5 px-2 py-0.5 md:px-2.5 md:py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 uppercase tracking-widest font-semibold font-mono"
                    :class="isMobile ? 'text-[9px]' : 'text-[10px]'"
                    x-html="'<i class=\'fas fa-code-branch text-emerald-600/50\'></i> ' + topic.strategy"
                  ></span>
                </div>
                <div class="w-full">
                  <div class="text-emerald-600 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold'">Granted Via</div>
                  <template x-if="!topic.source">
                    <span class="text-slate-500 italic" :class="isMobile ? 'text-[10px]' : 'text-xs'"
                    >Evaluation Source Unknown</span>
                  </template>
                  <template x-if="topic.source">
                    <span
                      class="inline-block px-2 py-1 md:px-3 md:py-1.5 rounded-lg bg-white text-gray-600 border border-slate-700 shadow-inner break-words font-medium"
                      :class="isMobile ? 'text-[10px]' : 'text-xs'"
                      x-text="topic.source"
                    ></span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>


    <!-- CAPABILITIES TAB -->
    <div
      x-show="detailTab === 'capabilities'"
      class="pb-16"
      x-transition.opacity.duration.300ms
    >
      <template
        x-if="!currentUserCap?.capabilities || currentUserCap.capabilities.length === 0"
      >
        <div
          class="bg-gray-50 border-dashed border border-gray-200 p-12 rounded-2xl text-center flex flex-col items-center"
        >
          <div
            class="w-16 h-16 rounded-full bg-gray-50 text-gray-500 flex items-center justify-center mb-4 border border-gray-200"
          >
            <i class="fa-solid fa-shield-slash text-2xl"></i>
          </div>
          <h3 class="text-xl font-semibold text-gray-800 mb-2">
            No Verified Capabilities
          </h3>
          <p class="text-gray-500 max-w-md mx-auto">
            This profile does not currently inherit any application permissions
            from global rules, functional licenses, or assigned roles.
          </p>
        </div>
      </template>

      <div class="flex flex-col gap-6">
        <template
          x-for="cap in currentUserCap?.capabilities"
          :key="typeof cap.category === 'object' ? JSON.stringify(cap.category) : cap.category"
        >
          <div
            class="bg-gray-50 border border-gray-200 p-6 rounded-2xl shadow-xl"
          >
            <div
              class="font-semibold text-indigo-600 text-lg mb-6 border-b border-gray-200 pb-4 flex items-center gap-3"
            >
              <i class="fa-solid fa-layer-group opacity-70"></i>
              <span
                x-text="typeof cap.category === 'object' ? JSON.stringify(cap.category) : cap.category"
              ></span>
            </div>

              <div class="flex flex-col gap-3 md:gap-4">
                <div
                  x-show="!isMobile"
                  class="hidden md:grid md:grid-cols-[minmax(250px,1.5fr)_minmax(200px,2fr)_minmax(200px,1.5fr)] gap-6 px-4 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-gray-100 bg-white rounded-t-lg"
                >
                  <div>Capability Key</div>
                  <div>Authorized Tenants</div>
                  <div>Granted Via Pipeline</div>
                </div>

              <template x-for="perm in cap.permissions" :key="perm.key">
                <div
                  class="bg-white rounded-xl border border-gray-100 hover:bg-gray-50 hover:border-gray-200 transition-all shadow-sm"
                  :class="isMobile ? 'flex flex-col p-4 gap-3' : 'md:grid md:grid-cols-[minmax(250px,1.5fr)_minmax(200px,2fr)_minmax(200px,1.5fr)] gap-6 p-6 md:py-4 items-center'"
                >
                  <div
                    class="font-mono text-indigo-700 break-all font-semibold tracking-wide w-full"
                    :class="isMobile ? 'text-[11px]' : 'text-sm'"
                    x-text="perm.key"
                  >
                  </div>

                  <div class="w-full">
                    <div class="text-indigo-600 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold text-indigo-600/50'">Tenants</div>
                    <div class="flex flex-wrap gap-1.5 md:gap-2">
                      <template x-if="perm.customers.length === 0">
                        <span
                          class="inline-flex items-center gap-1.5 px-2 py-0.5 md:px-3 md:py-1 rounded-md bg-gray-50 text-gray-600 border border-gray-200 uppercase font-semibold"
                          :class="isMobile ? 'text-[9px]' : 'text-[11px]'"
                        >
                          <i class="fa-solid fa-earth-americas opacity-50"></i>
                          GLOBAL / SHARED
                        </span>
                      </template>
                      <template x-for="c in perm.customers">
                        <span
                          class="inline-flex items-center gap-1.5 px-2 py-0.5 md:px-3 md:py-1 rounded-md bg-indigo-100 text-indigo-800 border border-indigo-300 tracking-wide font-medium"
                          :class="isMobile ? 'text-[9px]' : 'text-[11px]'"
                          x-html="'<i class=\'fa-solid fa-building opacity-50\'></i> ' + c"
                        ></span>
                      </template>
                    </div>
                  </div>

                  <div class="w-full">
                    <div class="text-indigo-600 uppercase tracking-tighter mb-1" :class="isMobile ? 'text-[9px] font-black' : 'md:hidden text-[10px] font-bold text-indigo-600/50'">Granted Via</div>
                    <div class="flex flex-wrap gap-1.5 md:gap-2">
                      <template
                        x-show="!perm.sources || perm.sources.length === 0"
                      >
                        <span class="text-slate-500 italic" :class="isMobile ? 'text-[10px]' : 'text-xs'"
                        >Evaluation Source Unknown</span>
                      </template>
                      <template x-for="s in perm.sources">
                        <span
                          class="inline-block px-2 py-1 md:px-3 md:py-1.5 rounded-lg bg-white text-gray-600 border border-slate-700 shadow-inner break-words font-medium"
                          :class="isMobile ? 'text-[10px]' : 'text-xs'"
                          x-text="s"
                        ></span>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
        </div>
      </template>
    </div>
  </div>
</div>
