<div class="flex flex-col h-full bg-slate-50">
  <!-- Header -->
  <div class="bg-emerald-600 p-6 pb-12 shadow-lg">
    <div class="flex justify-between items-center text-white">
      <div>
        <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">
          Good afternoon,
        </p>
        <h1
          class="text-2xl font-black italic"
          x-text="currentUser?.firstname || 'July'"
        >
        </h1>
      </div>
      <div class="flex gap-4">
        <button
          class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"
        >
          <i class="fas fa-search"></i>
        </button>
        <button
          class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"
        >
          <i class="fas fa-bell"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div
    class="flex-1 -mt-6 rounded-t-[3rem] bg-slate-50 p-6 space-y-8 overflow-y-auto"
  >
    <!-- Account Card -->
    <div
      class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-200 border border-slate-100"
    >
      <div class="flex justify-between items-start mb-4">
        <div>
          <h2
            class="text-xs font-bold text-slate-400 uppercase tracking-widest"
          >
            Primary Balance
          </h2>
          <p class="text-3xl font-black text-slate-800 tracking-tight">
            €12.450,20
          </p>
        </div>
        <div class="bg-emerald-50 text-emerald-600 p-2 rounded-xl">
          <i class="fas fa-university"></i>
        </div>
      </div>
      <div class="flex gap-2">
        <span
          class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase italic"
        >+ €450 this month</span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="grid grid-cols-4 gap-4">
      <div class="flex flex-col items-center gap-2">
        <button
          class="w-14 h-14 bg-white rounded-2xl shadow-md border border-slate-100 flex items-center justify-center text-emerald-600 active:scale-90 transition-transform"
        >
          <i class="fas fa-paper-plane"></i>
        </button>
        <span
          class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter"
        >Send</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <button
          class="w-14 h-14 bg-white rounded-2xl shadow-md border border-slate-100 flex items-center justify-center text-emerald-600 active:scale-90 transition-transform"
        >
          <i class="fas fa-receipt"></i>
        </button>
        <span
          class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter"
        >Pay</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <button
          class="w-14 h-14 bg-white rounded-2xl shadow-md border border-slate-100 flex items-center justify-center text-emerald-600 active:scale-90 transition-transform"
        >
          <i class="fas fa-qrcode"></i>
        </button>
        <span
          class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter"
        >Scan</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <button
          class="w-14 h-14 bg-white rounded-2xl shadow-md border border-slate-100 flex items-center justify-center text-emerald-600 active:scale-90 transition-transform"
        >
          <i class="fas fa-ellipsis-h"></i>
        </button>
        <span
          class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter"
        >More</span>
      </div>
    </div>

    <!-- Transactions -->
    <div class="space-y-4">
      <div class="flex justify-between items-center px-1">
        <h3
          class="text-sm font-black text-slate-800 uppercase tracking-widest italic"
        >
          Transactions
        </h3>
        <button class="text-[10px] font-bold text-emerald-600 uppercase">
          View All
        </button>
      </div>
      <div class="space-y-3">
        <div
          class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"
        >
          <div
            class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center"
          >
            <i class="fab fa-apple text-slate-400"></i>
          </div>
          <div class="flex-1">
            <p class="text-xs font-bold text-slate-800">Apple Services</p>
            <p class="text-[10px] text-slate-400">Today, 10:45 AM</p>
          </div>
          <p class="text-xs font-black text-slate-800">- €9,99</p>
        </div>
        <div
          class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"
        >
          <div
            class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center"
          >
            <i class="fas fa-shopping-bag text-slate-400"></i>
          </div>
          <div class="flex-1">
            <p class="text-xs font-bold text-slate-800">Organic Market</p>
            <p class="text-[10px] text-slate-400">Yesterday, 4:20 PM</p>
          </div>
          <p class="text-xs font-black text-slate-800">- €42,50</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div
    class="bg-white border-t border-slate-100 p-4 flex justify-around items-center"
  >
    <button class="text-emerald-600">
      <i class="fas fa-home text-lg"></i>
    </button>
    <button class="text-slate-300">
      <i class="fas fa-credit-card text-lg"></i>
    </button>
    <button class="text-slate-300">
      <i class="fas fa-chart-pie text-lg"></i>
    </button>
    <button class="text-slate-300" @click="await resetToDesktop()">
      <i class="fas fa-user text-lg"></i>
    </button>
  </div>
</div>
