<div id="stratum-hud-root" 
     x-data="stratumHUD" 
     class="fixed bottom-6 right-6 z-[100] flex flex-col items-end space-y-2 pointer-events-none"
     x-cloak>
    
    <!-- Compact Indicator -->
    <div class="group pointer-events-auto flex items-center space-x-3">
        <!-- URI Copy / Quick Action Bar (Reveals on Hover) -->
        <div class="bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-2xl px-4 py-2 shadow-2xl flex items-center space-x-4 max-w-0 opacity-0 overflow-hidden group-hover:max-w-md group-hover:opacity-100 transition-all duration-300">
             <div class="flex items-center space-x-2 border-r border-slate-800 pr-3">
                 <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Stratum</span>
                 <span class="text-[9px] font-mono text-cyan-400 truncate max-w-[120px]" x-text="beingId"></span>
             </div>

             <div class="flex items-center space-x-2 border-r border-slate-800 pr-3">
                 <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Grounding</span>
                 <span class="text-[9px] font-bold text-purple-400 uppercase" x-text="grounding"></span>
             </div>
             
             <button @click="copyURI()" class="text-slate-400 hover:text-cyan-400 transition-colors tooltip" data-tip="Copy URI">
                 <i class="fas fa-link text-[10px]"></i>
             </button>

             <button @click="openStratographer()" class="text-slate-400 hover:text-purple-400 transition-colors flex items-center space-x-1.5 whitespace-nowrap">
                 <i class="fas fa-eye text-[10px]"></i>
                 <span class="text-[9px] font-bold uppercase tracking-tighter">Stratographer</span>
             </button>
        </div>

        <!-- Status Sphere -->
        <div class="w-10 h-10 rounded-full bg-slate-900 border-2 flex items-center justify-center cursor-pointer shadow-xl transition-all hover:scale-110 active:scale-95"
             :class="tier === 'cloud' ? 'border-amber-500/30 shadow-amber-500/10' : 'border-cyan-500/30 shadow-cyan-500/10'"
             @click="openStratographer()">
             
             <!-- Pulse Core -->
             <div class="w-2.5 h-2.5 rounded-full animate-pulse transition-colors"
                  :class="tier === 'cloud' ? 'bg-amber-400' : 'bg-cyan-400'"></div>
             
             <!-- Identity Halo (Optional) -->
             <div class="absolute inset-0 rounded-full border border-white/5 opacity-20"></div>
        </div>
    </div>
</div>
