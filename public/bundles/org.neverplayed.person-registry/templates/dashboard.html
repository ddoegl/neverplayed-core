<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold">Person Registry</h2>
    <div class="flex items-center gap-2">
      <button
        @click="openYamlEditor()"
        class="bg-gray-100 text-gray-700 px-4 py-2 rounded shadow border border-gray-200 hover:bg-gray-200"
      >
        <i class="fas fa-file-code mr-2"></i> Edit as YAML
      </button>
      <button
        @click="editPerson(null)"
        class="bg-orange-600 text-white px-4 py-2 rounded shadow hover:bg-orange-700"
      >
        <i class="fas fa-plus mr-2"></i> Add Person
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <template x-for="person in persons" :key="person.id">
      <div
        class="bg-white shadow rounded-lg p-5 border border-gray-200 relative group"
      >
        <div
          class="absolute top-4 right-4 space-x-1 opacity-0 group-hover:opacity-100 transition-opacity"
        >
          <button
            @click="editPerson(person)"
            class="text-blue-500 hover:text-blue-700 p-1 bg-white rounded-full shadow-sm"
          >
            <i class="fas fa-edit"></i>
          </button>
          <button
            @click="deletePerson(person.id)"
            class="text-red-500 hover:text-red-700 p-1 bg-white rounded-full shadow-sm"
          >
            <i class="fas fa-trash"></i>
          </button>
        </div>

        <div class="flex items-center space-x-4 mb-4">
          <img
            :src="person.avatar || `https://ui-avatars.com/api/?name=${person.firstname}+${person.lastname}&background=random`"
            class="w-12 h-12 rounded-full shadow-sm"
          >
          <div>
            <h3
              class="text-lg font-bold text-gray-800"
              x-text="person.firstname + ' ' + person.lastname"
            >
            </h3>
            <p class="text-xs text-gray-500">
              ID: <span
                class="font-mono"
                x-text="person.id"
              ></span>
            </p>
          </div>
        </div>

        <div class="mt-4 space-y-2">
          <div class="text-sm">
            <span class="font-semibold text-gray-700">User IDs:</span>
            <div class="flex flex-wrap gap-1 mt-1">
              <template x-for="uid in person.userids" :key="uid">
                <span
                  class="bg-gray-100 border border-gray-200 text-gray-600 text-xs px-2 py-0.5 rounded"
                  x-text="uid"
                ></span>
              </template>
              <template x-if="!person.userids || person.userids.length === 0">
                <span class="text-gray-400 text-xs italic"
                >No user IDs linked</span>
              </template>
            </div>
          </div>
          <div class="text-sm">
            <span class="font-semibold text-gray-700">Emails:</span>
            <div class="flex flex-col mt-1">
              <template
                x-for="email in person.emails"
                :key="email"
              >
                <span class="text-gray-500 text-xs flex items-center"><i
                    class="fas fa-envelope mr-1 w-3"
                  ></i>
                  <span x-text="email"></span></span>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
  <template x-if="persons.length === 0">
    <div
      class="bg-white p-8 rounded-lg shadow border border-dashed border-gray-300 text-center"
    >
      <p class="text-gray-500">No persons registered yet.</p>
    </div>
  </template>
</div>
