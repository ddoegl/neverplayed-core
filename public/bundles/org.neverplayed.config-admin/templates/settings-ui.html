<div class="w-full h-full bg-slate-50 flex flex-col overflow-auto font-sans">
  <!-- Content -->
  <div class="flex-1 p-8 space-y-8 max-w-6xl mx-auto w-full transition-all duration-500">
    
    <!-- Header & Search -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-4">
        <div>
            <div class="text-blue-500 font-mono text-[10px] uppercase tracking-[0.4em] mb-2">Governance Console</div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter">Universe Settings</h1>
        </div>

        <div class="relative w-full md:w-96 group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-500 transition-colors">
                <i class="fas fa-search text-sm"></i>
            </div>
            <input 
                type="text" 
                x-model="search"
                placeholder="Search bundles, PIDs or realms..."
                class="w-full bg-white border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-sm font-medium focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all shadow-sm"
            >
        </div>
    </div>

    <!-- Global Actions Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Factory Reset -->
      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between group hover:border-red-400/50 transition-all duration-500">
        <div class="flex items-center space-x-5">
          <div class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center text-xl shadow-inner transition-transform group-hover:scale-110">
            <i class="fas fa-undo-alt"></i>
          </div>
          <div>
            <h3 class="font-black text-slate-900 tracking-tight">Universe Reset</h3>
            <p class="text-[9px] text-slate-400 uppercase font-black tracking-[0.2em] mt-1 text-center">Factory Default</p>
          </div>
        </div>
        <button
          @click="$dispatch('shell-system-reset')"
          class="px-5 py-2 bg-slate-950 hover:bg-red-600 text-white text-[9px] font-black rounded-xl transition-all shadow-lg active:scale-95 uppercase tracking-[0.2em]"
        >
          Wipe
        </button>
      </div>
      
      <!-- Stats / Placeholder (Optional) -->
      <div class="md:col-span-2 flex items-center justify-end space-x-8 px-8">
           <div class="text-right">
                <div class="text-[9px] text-slate-400 uppercase font-black tracking-widest mb-1">Managed Bundles</div>
                <div class="text-2xl font-black text-slate-900" x-text="cfgs.length"></div>
           </div>
           <div class="w-px h-8 bg-slate-200"></div>
           <div class="text-right">
                <div class="text-[9px] text-slate-400 uppercase font-black tracking-widest mb-1">Active Realms</div>
                <div class="text-2xl font-black text-slate-900" x-text="realms.length"></div>
           </div>
      </div>
    </div>

    <!-- Realm Hierarchy Table -->
    <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-50/80 border-b border-slate-200">
          <tr>
            <th class="px-10 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Platform Bundle</th>
            <th class="px-10 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] text-center">Log Level</th>
            <th class="px-10 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] text-center w-48 text-center">Governance</th>
          </tr>
        </thead>
        
        <template x-for="category in categorized" :key="category.id">
          <tbody class="divide-y divide-slate-100">
            <!-- Realm Header -->
            <tr class="bg-slate-50/50">
              <td colspan="3" class="px-10 py-4">
                <div class="flex items-center space-x-3">
                    <div class="w-2 h-2 rounded-full" :class="{
                        'bg-blue-500': category.id === 'org.neverplayed.realm.core',
                        'bg-purple-500': category.id === 'org.neverplayed.realm.foundation',
                        'bg-emerald-500': category.id === 'org.neverplayed.realm.showcase',
                        'bg-slate-300': category.id.includes('orphaned')
                    }"></div>
                    <span class="text-[11px] font-black text-slate-500 uppercase tracking-[0.2em]" x-text="category.title"></span>
                </div>
              </td>
            </tr>

            <!-- Bundle Rows -->
            <template x-for="cfg in category.items" :key="cfg.pid">
              <tr class="hover:bg-slate-50/30 transition-all group">
                <td class="px-10 py-5">
                  <div class="flex items-center space-x-5">
                    <div class="w-12 h-12 bg-white rounded-2xl border border-slate-100 shadow-sm flex items-center justify-center text-slate-300 group-hover:text-blue-500 group-hover:border-blue-100 transition-all duration-300">
                      <i :class="cfg.icon || 'fas fa-cube'" class="text-lg"></i>
                    </div>
                    <div>
                      <div class="font-black text-slate-900 leading-tight text-sm tracking-tight" x-text="cfg.name"></div>
                      <div class="text-[9px] font-mono text-slate-400 mt-1" x-text="cfg.pid"></div>
                      <div class="text-[10px] text-slate-500 mt-2 max-w-sm line-clamp-1 group-hover:line-clamp-none transition-all" x-text="cfg.description"></div>
                    </div>
                  </div>
                </td>
                
                <td class="px-10 py-5 text-center">
                  <select
                    @change="setLogLevel(cfg.pid, $event.target.value)"
                    :class="{
                        'text-emerald-600 bg-emerald-50 border-emerald-200': cfg.properties['log-level'] === 'DEBUG' || cfg.properties['log-level'] === 'TRACE',
                        'text-blue-600 bg-blue-50 border-blue-200': cfg.properties['log-level'] === 'INFO' || !cfg.properties['log-level'],
                        'text-orange-600 bg-orange-50 border-orange-200': cfg.properties['log-level'] === 'WARN',
                        'text-red-600 bg-red-50 border-red-200': cfg.properties['log-level'] === 'ERROR',
                        'text-slate-400 bg-slate-50 border-slate-200': cfg.properties['log-level'] === 'NONE'
                    }"
                    class="px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest border outline-none transition-all focus:ring-4 focus:ring-blue-400/10 appearance-none cursor-pointer min-w-[120px] text-center"
                  >
                    <template x-for="lvl in ['TRACE', 'DEBUG', 'INFO', 'WARN', 'ERROR', 'NONE']">
                      <option :value="lvl" x-text="lvl" :selected="cfg.properties['log-level'] === lvl"></option>
                    </template>
                    <option value="" :selected="!cfg.properties['log-level']">DEFAULT</option>
                  </select>
                </td>

                <td class="px-10 py-5 text-center">
                    <div class="flex justify-center min-h-[40px]">
                        <template x-if="cfg.hasFlow">
                            <button
                                @click="toggleSidebar(cfg.pid)"
                                :class="cfg.properties.sidebar ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-slate-50 text-slate-300 border-slate-100'"
                                class="flex items-center px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest border transition-all active:scale-95 whitespace-nowrap"
                            >
                                <i class="fas fa-columns mr-2" :class="cfg.properties.sidebar ? 'text-blue-500' : 'text-slate-200'"></i>
                                <span x-text="cfg.properties.sidebar ? 'In Sidebar' : 'Hidden'"></span>
                            </button>
                        </template>
                         <template x-if="!cfg.hasFlow">
                            <span class="text-[8px] font-bold text-slate-300 uppercase tracking-widest opacity-40">N/A (Tool)</span>
                        </template>
                    </div>
                </td>
              </tr>
            </template>
          </tbody>
        </template>
      </table>
    </div>
  </div>
</div>
