<div
  class="flex flex-col flex-1 h-full overflow-hidden"
  x-data="{ 
  activeTab: 'functions',
  get groupedFunctions() {
    const groups = {
      'legal-representative': [],
      'operator': [],
      'authorized-delegate': [],
      'other': []
    };
    (host.parsedBusinessFunctions || []).forEach(f => {
      if (groups[f.type]) {
        groups[f.type].push(f);
      } else {
        groups['other'].push(f);
      }
    });
    return groups;
  },
  addFunction() {
    let id = 'NEW_FUNCTION_' + ((host.parsedBusinessFunctions || []).length + 1);
    host.parsedBusinessFunctions.push({
        id: id,
        label: 'New Function',
        type: 'authorized-delegate',
        roles: []
    });
    host.saveBusinessFunctions();
  },
  deleteFunction(idx) {
    if (confirm('Delete this Business Function? This may break rules relying on it!')) {
      host.parsedBusinessFunctions.splice(idx, 1);
      host.saveBusinessFunctions();
    }
  }
}"
>
  <!-- Header -->
  <div class="flex justify-between items-center mb-4 shrink-0 px-6 pt-4">
    <div>
      <h3 class="text-gray-700 font-semibold text-xl m-0">
        Business Functions
      </h3>
      <p class="text-xs text-gray-500 mt-1 m-0">
        Map physical roles into logical organizational functions.
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button
        @click="host.openBusinessFunctionsEditor()"
        class="text-xs font-mono bg-slate-100 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-2 text-slate-500"
      >
        <i class="fas fa-code"></i>
        <span>View YAML Source</span>
      </button>
      <button
        @click="addFunction()"
        class="text-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors flex items-center gap-2"
      >
        <i class="fas fa-plus"></i> Add Function
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-6 space-y-8">
    <template
      x-if="!host.parsedBusinessFunctions || host.parsedBusinessFunctions.length === 0"
    >
      <div
        class="flex flex-col items-center justify-center p-16 text-slate-400"
      >
        <i class="fas fa-users-cog text-4xl opacity-30 mb-3"></i>
        <p>No business functions defined.</p>
      </div>
    </template>

    <template
      x-for="type in ['legal-representative', 'operator', 'authorized-delegate', 'other']"
      :key="type"
    >
      <div x-show="groupedFunctions[type].length > 0" class="space-y-4">
        <h4
          class="text-sm font-bold uppercase tracking-widest text-slate-500 border-b border-slate-200 pb-2 capitalize"
          x-text="type.replace('-', ' ')"
        >
        </h4>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <template x-for="f in groupedFunctions[type]" :key="f.id">
            <div
              class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow relative group"
            >
              <!-- Delete Button -->
              <button
                @click="deleteFunction(host.parsedBusinessFunctions.findIndex(x => x.id === f.id))"
                class="absolute top-3 right-3 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
              >
                <i class="fas fa-trash-alt"></i>
              </button>

              <div class="flex flex-col gap-3">
                <div>
                  <input
                    type="text"
                    x-model="f.label"
                    @change="host.saveBusinessFunctions()"
                    class="font-bold text-slate-800 text-lg bg-transparent border-b border-transparent focus:border-blue-400 outline-none w-full mb-1"
                    placeholder="Display Label"
                  >
                  <input
                    type="text"
                    x-model="f.id"
                    @change="host.saveBusinessFunctions()"
                    class="text-xs font-mono font-bold text-purple-600 bg-transparent border-b border-transparent focus:border-purple-400 outline-none w-full uppercase"
                    placeholder="FUNCTION_ID"
                  >
                </div>

                <div
                  class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"
                >
                  Type
                </div>
                <select
                  x-model="f.type"
                  @change="host.saveBusinessFunctions()"
                  class="bg-slate-50 border border-slate-200 text-xs text-slate-700 rounded px-2 py-1.5 outline-none -mt-1"
                >
                  <option value="legal-representative">
                    Legal Representative
                  </option>
                  <option value="operator">Operator</option>
                  <option value="authorized-delegate">
                    Authorized Delegate
                  </option>
                  <option value="other">Other</option>
                </select>

                <div
                  class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1"
                >
                  Physical Roles
                </div>
                <div class="flex flex-wrap gap-2">
                  <template x-for="(role, rIdx) in (f.roles || [])" :key="rIdx">
                    <span
                      class="bg-blue-50 text-blue-700 border border-blue-100 text-[10px] px-2 py-1 rounded-md font-bold flex items-center gap-1.5 shadow-sm"
                    >
                      <span x-text="role"></span>
                      <i
                        @click="f.roles.splice(rIdx, 1); host.saveBusinessFunctions();"
                        class="fas fa-times hover:text-red-500 cursor-pointer text-[10px]"
                      ></i>
                    </span>
                  </template>
                  <button
                    @click="const r = prompt('Physical Role ID:'); if(r){ if(!f.roles) f.roles = []; f.roles.push(r.toLowerCase()); host.saveBusinessFunctions(); }"
                    class="border border-dashed border-slate-300 text-slate-500 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 text-[10px] px-2 py-1 rounded-md font-bold transition-colors"
                  >
                    + Add Role
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>
