<div class="p-8 max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-black text-slate-800">Case Types</h1>
      <p class="text-slate-500">
        Map business actions to their required signing strategies.
      </p>
    </div>
    <div class="flex gap-3">
      <button
        @click="host.openCaseTypesEditor()"
        class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-colors"
      >
        <i class="fas fa-code mr-2"></i>YAML Editor
      </button>
      <button
        @click="host.addCaseType()"
        class="px-4 py-2 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors shadow-lg"
      >
        <i class="fas fa-plus mr-2"></i>Add Case Type
      </button>
    </div>
  </div>

  <div
    class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden"
  >
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50">
          <th
            class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400"
          >
            ID / Name
          </th>
          <th
            class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400"
          >
            Strategy
          </th>
          <th
            class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-slate-400"
          >
            Description
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        <template x-for="type in host.parsedCaseTypes" :key="type.id">
          <tr class="hover:bg-slate-50/50 transition-colors group">
            <td class="px-6 py-4">
              <div class="font-bold text-slate-800" x-text="type.name"></div>
              <div class="text-xs font-mono text-slate-400" x-text="type.id">
              </div>
            </td>
            <td class="px-6 py-4">
              <span
                class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold"
                x-text="type.strategyId"
              ></span>
            </td>
            <td
              class="px-6 py-4 text-sm text-slate-500"
              x-text="type.description"
            >
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
