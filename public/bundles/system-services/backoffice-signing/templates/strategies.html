<div class="p-8 max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-black text-slate-800">Signing Strategies</h1>
      <p class="text-slate-500">
        Define how cases must be signed across channels.
      </p>
    </div>
    <div class="flex gap-3">
      <button
        @click="host.openSigningStrategiesEditor()"
        class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-colors"
      >
        <i class="fas fa-code mr-2"></i>YAML Editor
      </button>
      <button
        @click="host.addSigningStrategy()"
        class="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200"
      >
        <i class="fas fa-plus mr-2"></i>Add Strategy
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <template x-for="strat in host.parsedSigningStrategies" :key="strat.id">
      <div
        class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow"
      >
        <div class="flex items-start justify-between mb-4">
          <div
            class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400"
          >
            <i class="fas fa-file-signature text-xl"></i>
          </div>
          <span
            class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-bold uppercase tracking-wider"
            x-text="strat.type"
          ></span>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-1" x-text="strat.name">
        </h3>
        <p class="text-sm text-slate-500 mb-4" x-text="strat.description"></p>
        <div class="flex items-center gap-2 text-xs font-mono text-slate-400">
          <span class="bg-slate-50 px-2 py-1 rounded">ID: <span
              x-text="strat.id"
            ></span></span>
          <span class="bg-slate-50 px-2 py-1 rounded">Selector: <span
              x-text="strat.selector"
            ></span></span>
        </div>
      </div>
    </template>
  </div>
</div>
