<div
  class="flex flex-col flex-1 h-full overflow-hidden"
  x-data="{ 
  selectedSCAStrategyIndex: 0,
  selectedSCAStrategyIndex: 0,
  initSelection() {
    const strats = host.parsedSCAStrategies || [];
    if (strats.length > 0 && this.selectedSCAStrategyIndex >= strats.length) {
      this.selectedSCAStrategyIndex = Math.max(0, strats.length - 1);
    }
  },
  addSCAStrategy() {
    let n = 'new-strategy-' + ((host.parsedSCAStrategies || []).length + 1);
    host.parsedSCAStrategies.push({ id: n });
    this.selectedSCAStrategyIndex = host.parsedSCAStrategies.length - 1;
    host.saveSCAStrategies();
  },
  deleteSCAStrategy() {
    const curId = host.parsedSCAStrategies[this.selectedSCAStrategyIndex]?.id;
    if (['locked', 'open', 'bootstrap'].includes(curId)) {
      alert('System strategies (locked/open/bootstrap) cannot be deleted.');
      return;
    }
    if (confirm('Delete this SCA Strategy?')) {
      host.parsedSCAStrategies.splice(this.selectedSCAStrategyIndex, 1);
      this.selectedSCAStrategyIndex = Math.max(0, host.parsedSCAStrategies.length - 1);
      host.saveSCAStrategies();
    }
  }
}"
  x-init="$watch('host.parsedSCAStrategies', value => initSelection())"
>
  <!--  YAML Toggle -->
  <div class="flex justify-between items-center mb-4 shrink-0">
    <div class="flex gap-1 bg-gray-100 p-1 rounded-lg">
      <h3 class="px-4 py-1.5 rounded-md text-sm font-semibold bg-white text-gray-800 shadow-sm m-0 flex items-center gap-2">
        <i class="fas fa-route"></i> Strategies
      </h3>
    </div>
    <button
      @click="host.openSCAStrategiesEditor()"
      class="text-xs font-mono bg-slate-100 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-2 text-slate-500"
    >
      <i class="fas fa-code"></i>
      <span>View YAML Source</span>
    </button>
  </div>

  <div
    class="flex-1 overflow-hidden flex flex-row rounded-xl border border-gray-200 bg-white shadow-sm"
  >
    <!-- Sidebar / Directory -->
    <div
      class="w-72 border-r border-gray-200 bg-gray-50 flex flex-col h-full shrink-0"
    >
      <div
        class="p-4 flex justify-between items-center border-b border-gray-200 bg-white"
      >
        <h3
          class="text-gray-700 font-semibold text-sm uppercase tracking-wider m-0"
        >
          Strategies
        </h3>
        <button
          @click="addSCAStrategy()"
          class="text-blue-600 hover:text-blue-800 text-xl font-bold leading-none cursor-pointer flex items-center justify-center w-6 h-6 rounded hover:bg-blue-50 transition-colors"
          title="Create SCA Strategy"
        >
          +
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
        <template
          x-for="(strat, idx) in host.parsedSCAStrategies"
          :key="idx"
        >
          <div
            class="px-4 py-3 rounded-lg cursor-pointer border transition-all duration-200 flex flex-col"
            :class="{'bg-amber-50 border-amber-200 text-amber-900 shadow-sm': selectedSCAStrategyIndex === idx, 'bg-white border-gray-100 hover:bg-gray-100 text-gray-600 hover:border-gray-300': selectedSCAStrategyIndex !== idx}"
            @click="selectedSCAStrategyIndex = idx"
          >
            <div
              class="font-semibold tracking-wide truncate text-sm"
              x-text="strat.id"
            >
            </div>
            <div
              class="text-[10px] text-gray-500 font-mono mt-1"
              x-text="strat.type || (Object.values(strat || {}).some(v => v === true) ? 'custom' : ['locked','open','bootstrap'].includes(strat.id) ? 'system' : 'none')"
            >
            </div>
          </div>
        </template>
        <template
          x-if="!host.parsedSCAStrategies || host.parsedSCAStrategies.length === 0"
        >
          <div
            class="text-xs text-gray-500 text-center p-4 italic border border-dashed border-gray-200 rounded-lg"
          >
            No SCA strategies found.
          </div>
        </template>
      </div>
    </div>

    <!-- Strategy Detail Panel -->
    <div class="flex-1 overflow-y-auto p-8 bg-gray-50/50 h-full relative">
      <template
        x-if="!host.parsedSCAStrategies || host.parsedSCAStrategies.length === 0"
      >
        <div
          class="flex flex-col items-center justify-center h-full text-gray-400 gap-3"
        >
          <i class="fas fa-route text-4xl opacity-50"></i>
          <p>Select or create a strategy from the directory.</p>
        </div>
      </template>

      <template
        x-if="host.parsedSCAStrategies && host.parsedSCAStrategies.length > 0 && selectedSCAStrategyIndex >= 0 && selectedSCAStrategyIndex < host.parsedSCAStrategies.length"
      >
        <div class="flex flex-col max-w-2xl mx-auto h-full gap-6">
          <div class="flex justify-between items-start shrink-0">
            <div>
              <h2
                class="text-3xl font-bold text-gray-800 mb-2"
                x-text="host.parsedSCAStrategies[selectedSCAStrategyIndex].id || 'Untitled Strategy'"
              >
              </h2>
            </div>
            <div class="flex items-center gap-2">
              <button
                @click="deleteSCAStrategy()"
                x-show="!['locked', 'open', 'bootstrap'].includes(host.parsedSCAStrategies[selectedSCAStrategyIndex].id)"
                class="text-red-600 hover:text-red-800 font-semibold transition-colors px-4 py-2 rounded-lg border border-red-200 bg-red-50 hover:bg-red-100 text-sm shadow-sm flex items-center gap-2"
              >
                <i class="fas fa-trash-alt"></i> Delete
              </button>
              <template
                x-if="['locked', 'open', 'bootstrap'].includes(host.parsedSCAStrategies[selectedSCAStrategyIndex].id)"
              >
                <span
                  class="px-3 py-2 rounded-lg border border-blue-200 bg-blue-50 text-blue-700 text-xs font-bold uppercase tracking-wider flex items-center gap-2 shadow-sm"
                >
                  <i class="fas fa-server"></i> System Strategy
                </span>
              </template>
            </div>
          </div>

          <div
            class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col shrink-0"
          >
            <!-- Name field -->
            <div class="p-6 border-b border-gray-200 bg-gray-50/50">
              <div class="mb-4">
                <label
                  class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1.5"
                >Strategy Name / ID</label>
                <input
                  type="text"
                  x-model="host.parsedSCAStrategies[selectedSCAStrategyIndex].id"
                  :disabled="['locked', 'open', 'bootstrap'].includes(host.parsedSCAStrategies[selectedSCAStrategyIndex].id)"
                  @change="host.saveSCAStrategies()"
                  class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm text-emerald-600 font-bold focus:border-blue-500 outline-none disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed"
                >
              </div>
            </div>

            <div class="p-6 bg-white flex flex-col gap-4">
              <!-- System Strategy Info Panels -->
              <template
                x-if="host.parsedSCAStrategies[selectedSCAStrategyIndex].id === 'locked'"
              >
                <div
                  class="p-6 rounded-xl bg-red-50 border border-red-100 text-red-800 flex items-center gap-4"
                >
                  <div
                    class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-xl shrink-0"
                  >
                    <i class="fas fa-lock"></i>
                  </div>
                  <div>
                    <h3 class="text-md font-bold text-red-900 m-0">
                      Account Locked
                    </h3>
                    <p class="text-xs text-red-700 m-0 mt-1">
                      Users assigned to this strategy are blocked from logging
                      in entirely.
                    </p>
                  </div>
                </div>
              </template>

              <template
                x-if="host.parsedSCAStrategies[selectedSCAStrategyIndex].id === 'open'"
              >
                <div
                  class="p-6 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-800 flex items-center gap-4"
                >
                  <div
                    class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl shrink-0"
                  >
                    <i class="fas fa-door-open"></i>
                  </div>
                  <div>
                    <h3 class="text-md font-bold text-emerald-900 m-0">
                      Direct Access
                    </h3>
                    <p class="text-xs text-emerald-700 m-0 mt-1">
                      Users bypass all SCA checks and login directly. <strong
                      >Note: Auto-upgraded to 'bootstrap' on login.</strong>
                    </p>
                  </div>
                </div>
              </template>

              <template
                x-if="host.parsedSCAStrategies[selectedSCAStrategyIndex].id === 'bootstrap'"
              >
                <div
                  class="p-6 rounded-xl bg-amber-50 border border-amber-100 text-amber-800 flex items-center gap-4"
                >
                  <div
                    class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xl shrink-0"
                  >
                    <i class="fas fa-plug"></i>
                  </div>
                  <div>
                    <h3 class="text-md font-bold text-amber-900 m-0">
                      Bootstrap Mode
                    </h3>
                    <p class="text-xs text-amber-700 m-0 mt-1">
                      Initial security state. Shows a one-time PIN on login and
                      forces phone number collection on logout.
                    </p>
                  </div>
                </div>
              </template>

            <div class="p-6 bg-white flex flex-col gap-4">
              <!-- System Strategy Info Panels -->
              <template x-if="host.parsedSCAStrategies[selectedSCAStrategyIndex]?.id === 'locked'">
                <div class="p-6 rounded-xl bg-red-50 border border-red-100 text-red-800 flex items-center gap-4">
                  <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-xl shrink-0">
                    <i class="fas fa-lock"></i>
                  </div>
                  <div>
                    <h3 class="text-md font-bold text-red-900 m-0">Account Locked</h3>
                    <p class="text-xs text-red-700 m-0 mt-1">Users assigned to this strategy are blocked from logging in entirely.</p>
                  </div>
                </div>
              </template>

              <template x-if="host.parsedSCAStrategies[selectedSCAStrategyIndex]?.id === 'open'">
                <div class="p-6 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-800 flex items-center gap-4">
                  <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl shrink-0">
                    <i class="fas fa-door-open"></i>
                  </div>
                  <div>
                    <h3 class="text-md font-bold text-emerald-900 m-0">Direct Access</h3>
                    <p class="text-xs text-emerald-700 m-0 mt-1">Users bypass all SCA checks and login directly. <strong>Note: Auto-upgraded to 'bootstrap' on login.</strong></p>
                  </div>
                </div>
              </template>

              <template x-if="host.parsedSCAStrategies[selectedSCAStrategyIndex]?.id === 'bootstrap'">
                <div class="p-6 rounded-xl bg-amber-50 border border-amber-100 text-amber-800 flex items-center gap-4">
                  <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xl shrink-0">
                    <i class="fas fa-plug"></i>
                  </div>
                  <div>
                    <h3 class="text-md font-bold text-amber-900 m-0">Bootstrap Mode</h3>
                    <p class="text-xs text-amber-700 m-0 mt-1">Initial security state. Shows a one-time PIN on login and forces phone number collection on logout.</p>
                  </div>
                </div>
              </template>

              <!-- Dynamic Methods for Custom Strategies -->
              <template x-if="host.parsedSCAStrategies[selectedSCAStrategyIndex] && !['locked', 'open', 'bootstrap'].includes(host.parsedSCAStrategies[selectedSCAStrategyIndex].id)">
                <div class="flex flex-col gap-4">
                  <label class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold">Supported Authentication Methods</label>
                  <div class="space-y-3">
                    <template x-for="method in host.parsedSCAMethods" :key="method.id">
                      <label class="flex items-center justify-between p-3 rounded-lg border border-gray-100 bg-gray-50/30 hover:bg-gray-50 transition-colors cursor-pointer group">
                        <div class="flex items-center gap-3">
                          <div class="w-8 h-8 rounded-full flex items-center justify-center" :class="`bg-${method.color || 'gray'}-100 text-${method.color || 'gray'}-600`"><i :class="(method.icon || 'fas fa-key') + ' text-xs'"></i></div>
                          <div>
                            <div class="text-sm font-semibold text-gray-800" x-text="method.label || method.id"></div>
                            <div class="text-[10px] text-gray-500" x-text="method.id"></div>
                          </div>
                        </div>
                        <input type="checkbox" :checked="!!(host.parsedSCAStrategies[selectedSCAStrategyIndex] || {})[method.id]" @change="if (!host.parsedSCAStrategies[selectedSCAStrategyIndex]) return; host.parsedSCAStrategies[selectedSCAStrategyIndex][method.id] = $event.target.checked; host.saveSCAStrategies();" class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                      </label>
                    </template>
                  </div>

                  <template x-if="host.parsedSCAMethods && host.parsedSCAMethods.length > 0">
                    <div class="mt-2 p-4 rounded-xl bg-blue-50/30 border border-blue-100 shadow-inner">
                      <div class="text-[9px] text-blue-600 font-bold uppercase tracking-widest mb-2 flex items-center gap-1.5"><i class="fas fa-info-circle"></i> Strategy logic</div>
                      <p class="text-xs text-blue-700 leading-relaxed m-0">
                        Users assigned to <strong x-text="host.parsedSCAStrategies[selectedSCAStrategyIndex].id"></strong> will be prompted to choose one of the active methods above during login.
                        <span class="text-red-500 font-bold italic ml-1 underline" x-show="!Object.entries(host.parsedSCAStrategies[selectedSCAStrategyIndex] || {}).some(([k,v]) => k !== 'id' && v === true)">Warning: No methods active! Logins will be blocked.</span>
                      </p>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
