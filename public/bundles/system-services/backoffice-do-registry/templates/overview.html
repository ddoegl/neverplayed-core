<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-slate-800">Domain Object Registry</h1>
    <div class="flex space-x-2">
      <button
        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-500 transition"
        @click="host.ingestFromServer()"
      >
        <i class="fas fa-cloud-download-alt mr-2"></i>Ingest from Server
      </button>
      <button
        class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-500 transition"
        @click="host.addLocalDO()"
      >
        <i class="fas fa-plus mr-2"></i>Add Local DO
      </button>
      <button
        class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition"
        @click="host.openDOStrategiesEditor()"
      >
        <i class="fas fa-edit mr-2"></i>Edit Strategies
      </button>
      <button
        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-500 transition"
        @click="host.openDOInstancesEditor()"
      >
        <i class="fas fa-cubes mr-2"></i>Edit Instances
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Strategies Section -->
    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
    >
      <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
        <h2 class="text-xl font-bold text-slate-700">DO Strategies</h2>
      </div>
      <div class="p-6">
        <template x-for="(strat, key) in host.parsedDOStrategies" :key="key">
          <div
            class="mb-4 p-4 border border-slate-100 rounded-lg hover:bg-slate-50 transition"
          >
            <div class="flex items-center justify-between mb-2">
              <span
                class="font-bold text-indigo-600"
                x-text="strat.label"
              ></span>
              <code
                class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600"
                x-text="strat.id"
              ></code>
            </div>
            <p class="text-sm text-slate-600" x-text="strat.description"></p>
          </div>
        </template>
      </div>
    </div>

    <!-- Instances Section -->
    <div
      class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
    >
      <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
        <h2 class="text-xl font-bold text-slate-700">Active Instances</h2>
      </div>
      <div class="p-6">
        <template
          x-for="inst in (Array.isArray(host.currentDOs) ? host.currentDOs : Object.values(host.parsedDOInstances || {}))"
          :key="inst.id"
        >
          <div
            class="mb-4 p-4 border border-slate-100 rounded-lg hover:bg-slate-50 transition border-l-4 border-l-blue-500"
          >
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-slate-800" x-text="inst.label"></span>
              <span
                class="text-xs font-mono text-slate-400"
                x-text="inst.id"
              ></span>
            </div>
            <p
              class="text-sm text-slate-500 italic mb-2"
              x-text="inst.description"
            >
            </p>
            <div class="flex flex-wrap gap-2 mb-4">
              <template x-for="(val, prop) in inst.properties" :key="prop">
                <span
                  class="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded-full border border-indigo-100"
                >
                  <span x-text="prop"></span>: <span
                    class="font-bold"
                    x-text="val"
                  ></span>
                </span>
              </template>
            </div>

            <!-- Instance Actions -->
            <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-100">
              <template
                x-for="action in (inst.allowedActions || [])"
                :key="action.id"
              >
                <button
                  class="flex items-center text-xs font-semibold px-3 py-1.5 rounded-md bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition shadow-sm"
                  @click="host.handleAction(action, inst)"
                >
                  <i :class="action.icon + ' mr-1.5 text-indigo-500'"></i>
                  <span x-text="action.label"></span>
                </button>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
