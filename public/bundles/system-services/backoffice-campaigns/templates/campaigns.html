<div
  class="flex flex-col flex-1 h-full overflow-hidden"
  x-data="{ 
    showCampaignsYaml: false,
    selectedCampaignIndex: 0,
    initSelection() {
      const camps = host.parsedCampaigns || [];
      if (camps.length > 0 && this.selectedCampaignIndex >= camps.length) {
        this.selectedCampaignIndex = Math.max(0, camps.length - 1);
      }
    },
    createCampaign() {
      if (!host.parsedCampaigns) host.parsedCampaigns = [];
      host.parsedCampaigns.push({ 
        id: 'camp_' + (host.parsedCampaigns.length + 1), 
        title: 'New Promotion', 
        strategy: 'GLOBAL_BROADCAST',
        channels: ['business']
      });
      this.selectedCampaignIndex = host.parsedCampaigns.length - 1;
      host.saveCampaigns();
    },
    deleteCampaign() {
      if (confirm('Delete this Campaign?')) {
        host.parsedCampaigns.splice(this.selectedCampaignIndex, 1);
        this.selectedCampaignIndex = Math.max(0, this.selectedCampaignIndex - 1);
        host.saveCampaigns();
      }
    }
  }"
  x-init="$watch('host.parsedCampaigns', value => initSelection())"
>
  <div class="flex justify-between items-center mb-4 shrink-0">
    <p class="text-gray-500 text-sm m-0">
      Attach structured payloads to segmentation strategies.
    </p>
    <button
      @click="host.openCampaignsEditor()"
      class="text-xs font-mono bg-slate-100 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-2 text-slate-500"
    >
      <i class="fas fa-code"></i>
      <span>View YAML Source</span>
    </button>
  </div>

  <!-- CAMPAIGNS FORM -->
  <div
    class="flex-1 overflow-hidden flex flex-row rounded-xl border border-gray-200 bg-white shadow-sm"
  >
    <!-- Sidebar / Directory -->
    <div
      class="w-72 border-r border-slate-200 bg-slate-50 flex flex-col h-full shrink-0"
    >
      <div
        class="p-4 flex justify-between items-center border-b border-slate-200 bg-white"
      >
        <h3
          class="text-slate-700 font-bold text-xs uppercase tracking-widest m-0"
        >
          Campaigns
        </h3>
        <button
          @click="createCampaign()"
          class="text-blue-600 hover:text-blue-800 text-xl font-bold leading-none cursor-pointer flex items-center justify-center w-8 h-8 rounded-xl hover:bg-blue-50 transition-colors"
          title="Create Campaign"
        >
          <i class="fas fa-plus scale-75"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
        <template x-for="(camp, idx) in host.parsedCampaigns" :key="idx">
          <div
            class="px-4 py-3 rounded-2xl cursor-pointer border transition-all duration-200 flex flex-col gap-1 shadow-sm"
            :class="{'bg-blue-600 border-blue-600 text-white shadow-blue-200': selectedCampaignIndex === idx, 'bg-white border-slate-100 hover:border-slate-300 text-slate-600': selectedCampaignIndex !== idx}"
            @click="selectedCampaignIndex = idx"
          >
            <div
              class="font-black tracking-tight truncate text-sm"
              x-text="camp.title || 'Untitled Campaign'"
            >
            </div>
            <div
              class="text-[10px] font-bold opacity-60 font-mono"
              x-text="camp.id"
            >
            </div>
          </div>
        </template>
        <template
          x-if="!host.parsedCampaigns || host.parsedCampaigns.length === 0"
        >
          <div
            class="text-[10px] text-slate-400 text-center p-8 italic border border-dashed border-slate-200 rounded-3xl"
          >
            No campaigns found.
          </div>
        </template>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-12 bg-slate-50/50 h-full relative">
      <template
        x-if="!host.parsedCampaigns || host.parsedCampaigns.length === 0"
      >
        <div
          class="flex flex-col items-center justify-center h-full text-slate-300 gap-6 opacity-60"
        >
          <div
            class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-2xl"
          >
            <i class="fas fa-bullhorn text-slate-400"></i>
          </div>
          <div class="text-center">
            <p
              class="text-xs font-black uppercase tracking-widest text-slate-800 m-0"
            >
              No Campaigns Defined
            </p>
            <p class="text-[10px] font-bold text-slate-400 mt-2">
              Initialize a campaign to broadcast payloads to your users.
            </p>
          </div>
        </div>
      </template>

      <!-- Active Campaign Editing -->
      <template
        x-if="host.parsedCampaigns && host.parsedCampaigns.length > 0 && selectedCampaignIndex >= 0 && selectedCampaignIndex < host.parsedCampaigns.length"
      >
        <div class="flex flex-col max-w-2xl mx-auto h-full gap-6">
          <div class="flex justify-between items-start shrink-0">
            <div>
              <h2
                class="text-3xl font-bold text-gray-800 mb-2"
                x-text="host.parsedCampaigns[selectedCampaignIndex].title || 'Untitled Campaign'"
              >
              </h2>
              <div
                class="text-xs font-mono text-gray-500 bg-gray-200 px-2 py-1 rounded inline-block"
                x-text="'ID: ' + host.parsedCampaigns[selectedCampaignIndex].id"
              >
              </div>
            </div>
            <button
              @click="deleteCampaign()"
              class="text-red-600 hover:text-red-800 font-semibold transition-colors px-4 py-2 rounded-lg border border-red-200 bg-red-50 hover:bg-red-100 text-sm shadow-sm flex items-center gap-2"
            >
              <i class="fas fa-trash-alt"></i> Delete Campaign
            </button>
          </div>

          <div
            class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col shrink-0"
          >
            <div class="p-6 bg-white flex flex-col gap-4">
              <div>
                <label
                  class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1.5"
                >Campaign ID (Unique)</label>
                <input
                  type="text"
                  x-model="host.parsedCampaigns[selectedCampaignIndex].id"
                  @input.debounce.500ms="host.saveCampaigns()"
                  class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-emerald-600 font-bold focus:border-blue-500 focus:bg-white outline-none"
                >
              </div>
              <div>
                <label
                  class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1.5"
                >Display Title / Output Payload</label>
                <input
                  type="text"
                  x-model="host.parsedCampaigns[selectedCampaignIndex].title"
                  @input.debounce.500ms="host.saveCampaigns()"
                  class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:bg-white outline-none"
                >
              </div>
              <div>
                <label
                  class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1.5"
                >Target Delivery Strategy</label>
                <select
                  x-model="host.parsedCampaigns[selectedCampaignIndex].strategy"
                  @change="host.saveCampaigns()"
                  class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-blue-700 font-semibold focus:border-blue-500 focus:bg-white outline-none appearance-none"
                >
                  <template
                    x-for="strat in (host.parsedStrategies || [])"
                    :key="strat.id"
                  >
                    <option
                      :value="strat.id"
                      :selected="host.parsedCampaigns[selectedCampaignIndex].strategy === strat.id"
                      x-text="strat.id"
                    >
                    </option>
                  </template>
                </select>
              </div>
              <div>
                <label
                  class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1.5"
                >Campaign Mode</label>
                <select
                  x-model="host.parsedCampaigns[selectedCampaignIndex].mode"
                  @change="host.saveCampaigns()"
                  class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-amber-700 font-semibold focus:border-blue-500 focus:bg-white outline-none appearance-none"
                >
                  <option value="modal">Modal</option>
                  <option value="banner">Banner</option>
                  <option value="message">Message</option>
                </select>
              </div>
              <div>
                <label
                  class="block text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1.5"
                >Target Channels</label>
                <div class="flex gap-4">
                  <label class="flex items-center gap-2 cursor-pointer group">
                    <input
                      type="checkbox"
                      :checked="host.parsedCampaigns[selectedCampaignIndex].channels?.includes('business')"
                      @change="
                        let chans = host.parsedCampaigns[selectedCampaignIndex].channels || [];
                        if($event.target.checked) { if(!chans.includes('business')) chans.push('business'); }
                        else { chans = chans.filter(c => c !== 'business'); }
                        host.parsedCampaigns[selectedCampaignIndex].channels = chans;
                        host.saveCampaigns();
                      "
                      class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                    >
                    <span
                      class="text-xs font-semibold text-gray-700 group-hover:text-blue-600 transition-colors"
                    >Business</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer group">
                    <input
                      type="checkbox"
                      :checked="host.parsedCampaigns[selectedCampaignIndex].channels?.includes('retail')"
                      @change="
                        let chans = host.parsedCampaigns[selectedCampaignIndex].channels || [];
                        if($event.target.checked) { if(!chans.includes('retail')) chans.push('retail'); }
                        else { chans = chans.filter(c => c !== 'retail'); }
                        host.parsedCampaigns[selectedCampaignIndex].channels = chans;
                        host.saveCampaigns();
                      "
                      class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500"
                    >
                    <span
                      class="text-xs font-semibold text-gray-700 group-hover:text-emerald-600 transition-colors"
                    >Retail</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
