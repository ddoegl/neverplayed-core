<div
  class="flex flex-col flex-1 h-full overflow-hidden"
  x-data="{ 
  isMethodUsedInAnyStrategy(methodId) {
    return (host.parsedSCAStrategies || []).some(strat => {
      if (['locked','open','bootstrap'].includes(strat.id)) return false;
      return strat && strat[methodId] === true;
    });
  },
  deleteSCAMethod(methodId) {
    if (this.isMethodUsedInAnyStrategy(methodId)) {
      alert('This method is currently used in one or more strategies and cannot be deleted from Methods. Unassign it from the Strategies first.');
      return;
    }
    if (confirm('Delete method?')) {
      const idx = host.parsedSCAMethods.findIndex(m => m.id === methodId);
      if (idx > -1) host.parsedSCAMethods.splice(idx, 1);
      
      // Also clean up any references in strategies (though ideally they should not be there if unused, but just in case)
      (host.parsedSCAStrategies || []).forEach(strat => {
        if (strat && typeof strat === 'object') delete strat[methodId];
      });
      host.saveSCAMethods();
      if(host.saveSCAStrategies) host.saveSCAStrategies();
    }
  },
  renameMethod(method, newId) {
    if (!newId || newId === method.id) return;
    const oldId = method.id;
    method.id = newId;
    
    // Rename the key in all strategies too
    (host.parsedSCAStrategies || []).forEach(strat => {
      if (strat && typeof strat === 'object' && oldId in strat) {
        strat[newId] = strat[oldId];
        delete strat[oldId];
      }
    });
    host.saveSCAMethods();
    if(host.saveSCAStrategies) host.saveSCAStrategies();
  }
}"
>
  <div class="flex justify-between items-center mb-4 shrink-0">
    <div>
      <h3 class="text-gray-700 font-semibold text-xl m-0">
        Authentication Methods
      </h3>
      <p class="text-xs text-gray-500 mt-1 m-0">
        Define the foundational authentication methods available to your
        application.
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button
        @click="host.openSCAMethodsEditor()"
        class="text-xs font-mono bg-slate-100 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-2 text-slate-500"
      >
        <i class="fas fa-code"></i>
        <span>View YAML Source</span>
      </button>
      <button
        @click="host.addSCAMethod()"
        class="text-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors flex items-center gap-2"
      >
        <i class="fas fa-plus"></i> Add Method
      </button>
    </div>
  </div>

  <div
    class="flex-1 overflow-hidden flex flex-col rounded-xl border border-gray-200 bg-white shadow-sm"
  >
    <div class="flex-1 overflow-y-auto p-6">
      <template
        x-if="!host.parsedSCAMethods || host.parsedSCAMethods.length === 0"
      >
        <div
          class="flex flex-col items-center justify-center h-full text-gray-400 gap-3 py-16"
        >
          <i class="fas fa-fingerprint text-4xl opacity-30"></i>
          <p class="text-sm">
            No methods defined. Click "Add Method" to get started.
          </p>
        </div>
      </template>

      <div class="flex flex-col gap-3">
        <template
          x-for="(method, idx) in host.parsedSCAMethods"
          :key="method.id || idx"
        >
          <div
            class="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 items-center shadow-sm group"
          >
            <!-- Icon Preview -->
            <div
              class="w-12 h-12 rounded-full flex items-center justify-center text-lg shrink-0 transition-colors"
              :class="'bg-' + (method.color || 'gray') + '-100 text-' + (method.color || 'gray') + '-600'"
            >
              <i :class="method.icon || 'fas fa-key'"></i>
            </div>

            <!-- Fields -->
            <div
              class="flex-1 grid grid-cols-1 md:grid-cols-4 gap-3 items-center"
            >
              <div>
                <label
                  class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                >Method ID</label>
                <input
                  type="text"
                  :value="method.id"
                  @change="renameMethod(method, $event.target.value)"
                  class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs text-emerald-600 font-bold focus:border-blue-500 outline-none"
                >
              </div>
              <div class="md:col-span-1">
                <label
                  class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                >Display Label</label>
                <input
                  type="text"
                  x-model="method.label"
                  @change="host.saveSCAMethods()"
                  class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs text-gray-800 focus:border-blue-500 outline-none"
                >
              </div>
              <div>
                <label
                  class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                >Icon Class</label>
                <input
                  type="text"
                  x-model="method.icon"
                  @change="host.saveSCAMethods()"
                  placeholder="fas fa-key"
                  class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs font-mono text-gray-700 focus:border-blue-500 outline-none"
                >
              </div>
              <div>
                <label
                  class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                >Color</label>
                <select
                  x-model="method.color"
                  @change="host.saveSCAMethods()"
                  class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs text-gray-800 focus:border-blue-500 outline-none"
                >
                  <option value="blue">Blue</option>
                  <option value="emerald">Emerald</option>
                  <option value="amber">Amber</option>
                  <option value="red">Red</option>
                  <option value="purple">Purple</option>
                  <option value="gray">Gray</option>
                  <option value="rose">Rose</option>
                  <option value="indigo">Indigo</option>
                </select>
              </div>
            </div>

            <!-- Usage Badge + Delete -->
            <div class="flex flex-col items-end gap-2 shrink-0">
              <template x-if="isMethodUsedInAnyStrategy(method.id)">
                <span
                  class="inline-flex items-center gap-1 px-2 py-1 text-[10px] font-bold bg-green-50 text-green-600 border border-green-100 rounded-full uppercase tracking-wide"
                >
                  <i class="fas fa-check-circle"></i> In Use
                </span>
              </template>
              <template x-if="!isMethodUsedInAnyStrategy(method.id)">
                <span
                  class="inline-flex items-center gap-1 px-2 py-1 text-[10px] font-bold bg-gray-50 text-gray-400 border border-gray-200 rounded-full uppercase tracking-wide"
                >
                  Unused
                </span>
              </template>
              <button
                @click="deleteSCAMethod(method.id)"
                :disabled="isMethodUsedInAnyStrategy(method.id)"
                class="w-8 h-8 flex items-center justify-center rounded-lg border transition-colors text-sm opacity-0 group-hover:opacity-100 focus:opacity-100"
                :class="isMethodUsedInAnyStrategy(method.id) ? 'text-gray-300 border-gray-200 cursor-not-allowed bg-gray-50' : 'text-red-400 hover:text-red-700 border-gray-200 hover:border-red-200 bg-white hover:bg-red-50'"
                :title="isMethodUsedInAnyStrategy(method.id) ? 'Cannot delete — method is in use' : 'Delete method'"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
