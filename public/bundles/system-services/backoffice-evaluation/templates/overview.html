<div class="flex flex-col flex-1 h-full overflow-hidden" x-data="{}">
  <div class="flex justify-between items-center mb-4 shrink-0">
    <p class="text-gray-500 text-sm m-0">
      Inspect evaluated roles and features bound to users.
    </p>
  </div>
  <div
    class="flex-1 overflow-hidden flex flex-row rounded-xl border border-gray-200 bg-white shadow-sm w-full relative"
  >
    <!-- Sidebar / Directory -->
    <div
      class="w-72 border-r border-gray-200 bg-gray-50 flex flex-col h-full shrink-0"
    >
      <div
        class="p-4 flex justify-between items-center border-b border-gray-200 bg-white"
      >
        <h3
          class="text-gray-700 font-semibold text-sm uppercase tracking-wider m-0"
        >
          Directory
        </h3>
      </div>
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
        <template
          x-if="!host.parsedLicenses.LICENSES || host.parsedLicenses.LICENSES.length === 0"
        >
          <div
            class="text-xs text-gray-500 text-center p-4 italic border border-dashed border-gray-200 rounded-lg"
          >
            No licenses initialized.
          </div>
        </template>
        <template
          x-for="(lic, lIdx) in host.parsedLicenses.LICENSES || []"
          :key="lIdx"
        >
          <div class="mb-2">
            <div
              class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 mt-2 px-1"
              x-text="lic.id || 'License ' + (lIdx + 1)"
            >
            </div>
            <div class="flex flex-col gap-1">
              <template x-for="(userObj, uIdx) in lic.USERS || []" :key="uIdx">
                <div
                  class="px-4 py-2 rounded-lg cursor-pointer border transition-all duration-200 flex items-center text-sm"
                  :class="{'bg-blue-50 border-blue-200 text-blue-900 shadow-sm font-semibold': host.selectedUserIndex && host.selectedUserIndex.licIdx === lIdx && host.selectedUserIndex.usrIdx === uIdx, 'bg-white border-gray-100 hover:bg-gray-100 text-gray-600 hover:border-gray-300': !(host.selectedUserIndex && host.selectedUserIndex.licIdx === lIdx && host.selectedUserIndex.usrIdx === uIdx)}"
                  @click="host.selectedUserIndex = { licIdx: lIdx, usrIdx: uIdx }; host.recompile?.()"
                >
                  <div
                    class="tracking-wide"
                    x-text="userObj.alias || userObj.id"
                  >
                  </div>
                </div>
              </template>
            </div>
          </div>


        </template>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-8 bg-gray-50/50 h-full relative">
      <div
        x-show="host.selectedUserIndex === null"
        class="flex flex-col items-center justify-center h-full text-gray-400 gap-3"
      >
        <svg
          class="w-12 h-12 opacity-50"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
          >
          </path>
        </svg>
        <p>
          Select a user record from the directory to inspect their evaluated
          payload.
        </p>
      </div>

      <template x-if="host.selectedUserIndex !== null && host.selectedUserCap">
        <div class="flex flex-col max-w-4xl mx-auto h-full">
          <div class="flex justify-between items-center mb-6 shrink-0">
            <div class="flex items-center gap-4">
              <h2
                x-text="host.selectedUserCap?.user"
                class="text-3xl text-gray-800 font-bold m-0"
              >
              </h2>
              <div class="flex gap-2">
                <template x-for="chan in host.selectedUserCap?.channels">
                  <span
                    class="px-3 py-1 bg-gray-200 text-gray-700 text-[10px] font-bold uppercase rounded-full border border-gray-300 shadow-sm"
                    x-text="chan"
                  ></span>
                </template>
              </div>
            </div>
            <button
              @click="host.startSCAMigration({id: host.selectedUserCap?.user})"
              class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-all shadow-md active:scale-95 flex items-center gap-2"
            >
              <i class="fas fa-shield-alt"></i> Initiate Modern-SW-Token
            </button>
          </div>

          <div class="flex gap-2 mb-6 border-b border-gray-200 pb-3 shrink-0">
            <button @click="host.detailTab = 'promotions'" :class="{'bg-gray-800 text-white': host.detailTab === 'promotions', 'bg-gray-100 text-gray-600 hover:bg-gray-200': host.detailTab !== 'promotions'}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">Promotions</button>
            <button @click="host.detailTab = 'topics'" :class="{'bg-gray-800 text-white': host.detailTab === 'topics', 'bg-gray-100 text-gray-600 hover:bg-gray-200': host.detailTab !== 'topics'}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">Topics</button>
            <button @click="host.detailTab = 'capabilities'" :class="{'bg-gray-800 text-white': host.detailTab === 'capabilities', 'bg-gray-100 text-gray-600 hover:bg-gray-200': host.detailTab !== 'capabilities'}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">Capabilities</button>
            <button @click="host.detailTab = 'domain-objects'" :class="{'bg-gray-800 text-white': host.detailTab === 'domain-objects', 'bg-gray-100 text-gray-600 hover:bg-gray-200': host.detailTab !== 'domain-objects'}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">Domain Objects</button>
            <div class="flex-1"></div>
            <button @click="host.openEvaluatorLogs()" class="bg-emerald-600 text-white hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm flex items-center gap-2"><i class="fas fa-code"></i> View Raw Data</button>
          </div>

          <div x-show="host.detailTab === 'promotions'" class="flex-1">
            <template
              x-if="!host.selectedUserCap?.campaigns || host.selectedUserCap.campaigns.length === 0"
            >
              <div
                class="bg-white border-dashed border border-gray-200 p-8 rounded-xl text-center shadow-sm"
              >
                <p class="text-gray-500">
                  No campaign segments actively target this profile.
                </p>
              </div>
            </template>
            <template
              x-if="host.selectedUserCap?.campaigns && host.selectedUserCap.campaigns.length > 0"
            >
              <div
                class="bg-white border border-gray-200 p-6 rounded-xl shadow-sm"
              >
                <div
                  class="font-semibold text-blue-600 text-lg mb-4 border-b border-gray-100 pb-3 flex items-center gap-2"
                >
                  <i class="fas fa-bullhorn shrink-0"></i> Active Promotions
                </div>
                <div class="flex flex-col gap-2">
                  <div
                    class="grid grid-cols-[2fr_1.5fr_1fr_1fr_2fr] gap-4 px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest border-b border-gray-100"
                  >
                    <div>Campaign Title</div>
                    <div>ID & Strategy</div>
                    <div>Channels</div>
                    <div>Mode</div>
                    <div>Granted Via</div>
                  </div>
                  <template
                    x-for="camp in host.selectedUserCap?.campaigns"
                    :key="camp.id"
                  >
                    <div
                      class="grid grid-cols-[2fr_1.5fr_1fr_1fr_2fr] gap-4 items-center px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 hover:bg-white hover:shadow-sm transition-all duration-200"
                    >
                      <div
                        class="font-semibold text-gray-800 text-sm break-words"
                        x-text="camp.title"
                      >
                      </div>
                      <div>
                        <div
                          class="font-mono text-gray-500 text-xs break-words mb-1.5"
                          x-text="camp.id"
                        >
                        </div>
                        <span
                          class="inline-block px-2 py-0.5 rounded border tracking-wide text-[10px] bg-blue-50 text-blue-600 border-blue-200 font-medium"
                          x-text="'STRATEGY: ' + camp.strategy"
                        ></span>
                      </div>
                      <div class="flex flex-wrap gap-1">
                        <template
                          x-for="c in (Array.isArray(camp.channels) ? camp.channels : (camp.channels ? [camp.channels] : ['business']))"
                        >
                          <span
                            class="px-2 py-0.5 rounded bg-white text-[9px] text-gray-600 border border-gray-200 font-bold uppercase tracking-tighter"
                            x-text="c"
                          ></span>
                        </template>
                      </div>
                      <div>
                        <span
                          class="inline-block px-2 py-0.5 rounded border tracking-wide text-[10px] bg-amber-50 text-amber-600 border-amber-200 font-medium"
                          x-text="camp.mode || 'banner'"
                        ></span>
                      </div>
                      <div>
                        <template x-if="!camp.source"><span
                            class="text-gray-400 text-xs italic"
                          >Unknown</span></template>
                        <template x-if="camp.source"><span
                            class="inline-block px-2 py-1 rounded-md text-[10px] bg-white text-gray-600 border border-gray-200 shadow-sm break-words font-medium"
                            x-text="camp.source"
                          ></span></template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <div x-show="host.detailTab === 'topics'" class="flex-1">
            <template
              x-if="!host.selectedUserCap?.topics || host.selectedUserCap.topics.length === 0"
            >
              <div
                class="bg-white border-dashed border border-gray-200 p-8 rounded-xl text-center shadow-sm"
              >
                <p class="text-gray-500">
                  No topics actively target this profile.
                </p>
              </div>
            </template>
            <template
              x-if="host.selectedUserCap?.topics && host.selectedUserCap.topics.length > 0"
            >
              <div
                class="bg-white border border-gray-200 p-6 rounded-xl shadow-sm"
              >
                <div
                  class="font-semibold text-blue-600 text-lg mb-4 border-b border-gray-100 pb-3 flex items-center gap-2"
                >
                  <i class="fas fa-layer-group shrink-0"></i> Active Topics
                </div>
                <div class="flex flex-col gap-2">
                  <div
                    class="grid grid-cols-[minmax(200px,2fr)_minmax(150px,1.5fr)_minmax(150px,2fr)] gap-4 px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest border-b border-gray-100"
                  >
                    <div>Topic Title</div>
                    <div>ID & Strategy</div>
                    <div>Granted Via</div>
                  </div>
                  <template
                    x-for="topic in host.selectedUserCap?.topics"
                    :key="topic.id"
                  >
                    <div
                      class="grid grid-cols-[minmax(200px,2fr)_minmax(150px,1.5fr)_minmax(150px,2fr)] gap-4 items-center px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 hover:bg-white hover:shadow-sm transition-all duration-200"
                    >
                      <div
                        class="font-semibold text-gray-800 text-sm break-words"
                        x-text="topic.title"
                      >
                      </div>
                      <div>
                        <div
                          class="font-mono text-gray-500 text-xs break-words mb-1.5"
                          x-text="topic.id"
                        >
                        </div>
                        <span
                          class="inline-block px-2 py-0.5 rounded border tracking-wide text-[10px] bg-blue-50 text-blue-600 border-blue-200 font-medium"
                          x-text="'STRATEGY: ' + topic.strategy"
                        ></span>
                      </div>
                      <div>
                        <template x-if="!topic.source"><span
                            class="text-gray-400 text-xs italic"
                          >Unknown</span></template>
                        <template x-if="topic.source"><span
                            class="inline-block px-2 py-1 rounded-md text-[10px] bg-white text-gray-600 border border-gray-200 shadow-sm break-words font-medium"
                            x-text="topic.source"
                          ></span></template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <div x-show="host.detailTab === 'capabilities'" class="flex-1">
            <template
              x-if="!host.selectedUserCap?.capabilities || host.selectedUserCap.capabilities.length === 0"
            >
              <div
                class="bg-white border-dashed border border-gray-200 p-8 rounded-xl text-center shadow-sm"
              >
                <p class="text-gray-500">
                  No capabilities granted to this profile based on active
                  license rules.
                </p>
              </div>
            </template>
            <div class="flex flex-col gap-5">
              <template
                x-for="cap in host.selectedUserCap?.capabilities"
                :key="typeof cap.category === 'object' ? JSON.stringify(cap.category) : cap.category"
              >
                <div
                  class="bg-white border border-gray-200 p-6 rounded-xl shadow-sm"
                >
                  <div
                    class="font-semibold text-gray-800 text-lg mb-4 border-b border-gray-100 pb-3 flex items-center gap-2"
                  >
                    <i class="fas fa-shield-alt text-emerald-500 shrink-0"></i>
                    <span
                      x-text="typeof cap.category === 'object' ? JSON.stringify(cap.category) : cap.category"
                    ></span>
                  </div>

                  <div class="flex flex-col gap-2">
                    <div
                      class="grid grid-cols-[minmax(200px,1fr)_minmax(150px,2fr)_minmax(150px,2fr)] gap-4 px-3 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-widest border-b border-gray-100"
                    >
                      <div>Permission Key</div>
                      <div>Customers</div>
                      <div>Granted Via</div>
                    </div>

                    <template x-for="perm in (cap.permissions || [])" :key="perm.key">
                      <div
                        class="grid grid-cols-[minmax(200px,1fr)_minmax(150px,2fr)_minmax(150px,2fr)] gap-4 items-center px-4 py-3 bg-gray-50 rounded-lg border border-gray-200 hover:bg-white hover:shadow-sm transition-all duration-200"
                      >
                        <div
                          class="font-mono text-emerald-600 text-xs font-bold break-words"
                          x-text="perm.key"
                        >
                        </div>

                        <div class="flex flex-wrap gap-1.5">
                          <template x-if="perm.customers.length === 0">
                            <span
                              class="inline-block px-2 py-1 rounded-md bg-white text-[10px] font-semibold text-gray-500 border border-gray-200 shadow-sm"
                            >GLOBAL / ALL</span>
                          </template>
                          <template x-for="c in perm.customers">
                            <span
                              class="inline-block px-2 py-1 rounded-md bg-white text-[10px] font-semibold text-blue-600 border border-blue-200 shadow-sm"
                              x-text="c"
                            ></span>
                          </template>
                        </div>

                        <div class="flex flex-wrap gap-1.5">
                          <template
                            x-if="!perm.sources || perm.sources.length === 0"
                          >
                            <span class="text-gray-400 text-xs italic"
                            >Unknown</span>
                          </template>
                          <template x-for="s in perm.sources">
                            <span
                              class="inline-block px-2 py-1 rounded-md text-[10px] bg-white text-gray-600 border border-gray-200 shadow-sm break-words font-medium"
                              x-text="s"
                            ></span>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
        </div>

          <div x-show="host.detailTab === 'domain-objects'" class="flex-1 overflow-y-auto">
            <template x-if="!host.selectedUserCap?.domainObjects || host.selectedUserCap.domainObjects.length === 0">
              <div class="bg-white border-dashed border border-gray-200 p-8 rounded-xl text-center shadow-sm">
                <p class="text-gray-500 text-sm italic py-4">
                  No Domain Objects authorized for this profile.
                </p>
              </div>
            </template>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-8">
              <template x-for="doInst in host.selectedUserCap?.domainObjects" :key="doInst.id">
                <div class="bg-white border border-gray-200 p-5 rounded-xl shadow-sm hover:border-indigo-400 transition-colors">
                  <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center text-lg shadow-sm border border-indigo-100">
                        <i :class="doInst.strategy?.icon || 'fas fa-cube'"></i>
                      </div>
                      <div>
                        <div class="text-[10px] font-black uppercase text-slate-400 tracking-wider mb-0.5" x-text="doInst.strategy?.label"></div>
                        <h4 class="font-bold text-gray-800 leading-tight" x-text="doInst.label"></h4>
                      </div>
                    </div>
                  </div>
                  
                  <div class="space-y-1.5 mb-4 bg-gray-50 p-2 rounded-lg border border-gray-100">
                    <template x-for="(val, prop) in doInst.properties" :key="prop">
                      <div class="flex justify-between text-[10px]">
                        <span class="text-gray-400 font-bold uppercase" x-text="prop"></span>
                        <span class="font-mono text-gray-700 font-semibold" x-text="val"></span>
                      </div>
                    </template>
                    <div class="flex justify-between text-[10px] pt-1 mt-1 border-t border-gray-200">
                      <span class="text-gray-400 font-bold uppercase">Owner</span>
                      <span class="font-bold text-indigo-600" x-text="doInst.owner"></span>
                    </div>
                  </div>

                  <div class="pt-3 border-t border-gray-100 flex flex-wrap gap-1.5">
                    <template x-for="action in doInst.allowedActions" :key="action.id">
                      <span class="px-2 py-1 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded text-[9px] font-bold uppercase flex items-center gap-1.5 shadow-sm">
                        <i :class="action.icon" class="text-[8px]"></i>
                        <span x-text="action.label"></span>
                      </span>
                    </template>
                    <template x-if="doInst.allowedActions.length === 0">
                      <span class="px-2 py-1 bg-gray-50 text-gray-400 border border-gray-100 rounded text-[9px] italic font-medium">Read Only Access</span>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
      </template>
    </div>
  </div>
</div>
