<!-- YAML Editor Overlay (Modular) -->
<template x-if="host.yamlEditor?.active">
  <div
    class="fixed inset-0 z-[100] bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-8"
  >
    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-full max-h-[90vh] flex flex-col overflow-hidden border border-gray-200 animate-in fade-in zoom-in duration-200"
    >
      <div
        class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center text-blue-600"
          >
            <i class="fas fa-code"></i>
          </div>
          <div>
            <h3
              class="text-lg font-bold text-gray-800 m-0"
              x-text="host.yamlEditor.title"
            >
            </h3>
            <p
              class="text-[10px] text-gray-500 uppercase tracking-widest font-bold m-0"
            >
              YAML Configuration Editor
            </p>
          </div>
        </div>
        <div class="flex gap-2">
          <button
            @click="host.yamlEditor.cancel()"
            class="px-4 py-2 text-sm font-semibold text-gray-600 hover:bg-gray-200 rounded-lg transition-colors"
          >
            Cancel
          </button>
          <button
            @click="host.yamlEditor.save()"
            class="px-6 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-lg shadow-blue-200 transition-all active:scale-95"
          >
            Save Changes
          </button>
        </div>
      </div>
      <div class="flex-1 relative">
        <textarea
          x-model="host.yamlEditor.content"
          class="absolute inset-0 w-full h-full p-6 font-mono text-sm bg-slate-900 text-blue-100 focus:outline-none resize-none selection:bg-blue-500/30"
          spellcheck="false"
        ></textarea>
      </div>
      <div
        class="px-6 py-3 bg-gray-50 border-t border-gray-200 flex justify-between items-center text-[10px] font-bold text-gray-400 uppercase tracking-widest"
      >
        <span>Pandino YAML Editor v1.0.0</span>
        <span>UTF-8 Encoding</span>
      </div>
    </div>
  </div>
</template>
