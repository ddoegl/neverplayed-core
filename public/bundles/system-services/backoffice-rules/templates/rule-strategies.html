<div class="flex flex-col h-full bg-slate-50 overflow-hidden">
  <!-- Header -->
  <div class="bg-white border-b px-6 py-4 shrink-0 shadow-sm z-10">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-xl font-bold text-slate-900">
          Rule Strategies (Layer 1)
        </h2>
        <p class="text-sm text-slate-500">
          Core matching primitives used to evaluate business intent.
        </p>
      </div>
      <button
        @click="const s = prompt('Strategy ID:'); if(s) { host.parsedRuleStrategies.push({ id: s, description: '' }); host.saveRuleStrategies(); }"
        class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all active:scale-95"
      >
        + Register Primitive
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-6">
    <div class="max-w-4xl mx-auto space-y-4">
      <template
        x-for="(strat, sIdx) in (host.parsedRuleStrategies || [])"
        :key="sIdx"
      >
        <div
          class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between group hover:border-blue-300 transition-all"
        >
          <div class="flex items-center gap-4">
            <div
              class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center font-mono font-bold text-xs"
            >
              P
            </div>
            <div>
              <div class="flex items-center gap-2">
                <input
                  type="text"
                  x-model="strat.id"
                  @change="host.saveRuleStrategies()"
                  class="font-mono font-bold text-slate-800 bg-transparent border-none outline-none focus:text-blue-600"
                >
              </div>
              <input
                type="text"
                x-model="strat.description"
                placeholder="Description..."
                @change="host.saveRuleStrategies()"
                class="text-xs text-slate-500 bg-transparent border-none outline-none w-96 italic"
              >
            </div>
          </div>
          <button
            @click="if(confirm('Delete strategy?')) { host.parsedRuleStrategies.splice(sIdx, 1); host.saveRuleStrategies(); }"
            class="text-slate-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 p-2"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </template>

      <template x-if="!(host.parsedRuleStrategies || []).length">
        <div
          class="bg-slate-100 rounded-2xl border-2 border-dashed border-slate-200 py-12 text-center text-slate-400"
        >
          <i class="fas fa-microchip text-4xl mb-4 opacity-20"></i>
          <p>No Rule Strategies registered.</p>
        </div>
      </template>
    </div>
  </div>
</div>
