<div
  class="flex flex-col flex-1 h-full overflow-hidden"
  x-data="{ 
  showTopicStrategiesYaml: false,
  selectedTopicStrategyIndex: 0,
  initSelection() {
    const strats = host.parsedTopicStrategies || [];
    if (strats.length > 0 && this.selectedTopicStrategyIndex >= strats.length) {
      this.selectedTopicStrategyIndex = Math.max(0, strats.length - 1);
    }
  },
  addTopicStrategy() {
    let n = 'NEW_TOPIC_STRAT_' + ((host.parsedTopicStrategies || []).length + 1);
    host.parsedTopicStrategies.push({ 
      id: n, 
      operator: 'AND',
      matchers: [{ type: 'matchAlways' }]
    });
    this.selectedTopicStrategyIndex = host.parsedTopicStrategies.length - 1;
    host.saveTopicStrategies();
  },
  deleteTopicStrategy() {
    if (confirm('Delete this Topic Strategy?')) {
      host.parsedTopicStrategies.splice(this.selectedTopicStrategyIndex, 1);
      this.selectedTopicStrategyIndex = Math.max(0, host.parsedTopicStrategies.length - 1);
      host.saveTopicStrategies();
    }
  }
}"
  x-init="$watch('host.parsedTopicStrategies', value => initSelection())"
>
  <div class="flex justify-between items-center mb-4 shrink-0">
    <p class="text-gray-500 text-sm m-0">
      Define how dynamic segments align to users based on features or rules for
      topics.
    </p>
    <button
      @click="host.openTopicStrategiesEditor()"
      class="text-xs font-mono bg-slate-100 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-2 text-slate-500"
    >
      <i class="fas fa-code"></i>
      <span>View YAML Source</span>
    </button>
  </div>

  <!-- TOPIC STRATEGIES FORM -->
  <div
    class="flex-1 overflow-hidden flex flex-row rounded-xl border border-gray-200 bg-white shadow-sm"
  >
    <!-- Sidebar / Directory -->
    <div
      class="w-72 border-r border-gray-200 bg-gray-50 flex flex-col h-full shrink-0"
    >
      <div
        class="p-4 flex justify-between items-center border-b border-gray-200 bg-white"
      >
        <h3
          class="text-gray-700 font-semibold text-sm uppercase tracking-wider m-0"
        >
          Directory
        </h3>
        <button
          @click="addTopicStrategy()"
          class="text-blue-600 hover:text-blue-800 text-xl font-bold leading-none cursor-pointer flex items-center justify-center w-6 h-6 rounded hover:bg-blue-50 transition-colors"
          title="Create Topic Strategy"
        >
          +
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
        <template
          x-for="(strat, idx) in host.parsedTopicStrategies"
          :key="idx"
        >
          <div
            class="px-4 py-3 rounded-lg cursor-pointer border transition-all duration-200 flex flex-col"
            :class="{'bg-blue-50 border-blue-200 text-blue-900 shadow-sm': selectedTopicStrategyIndex === idx, 'bg-white border-gray-100 hover:bg-gray-100 text-gray-600 hover:border-gray-300': selectedTopicStrategyIndex !== idx}"
            @click="selectedTopicStrategyIndex = idx"
          >
            <div
              class="font-semibold tracking-wide truncate text-sm"
              x-text="strat.id"
            >
            </div>
            <div
              class="text-[10px] text-gray-500 font-mono mt-1"
              x-text="(strat.matchers || []).map(m => m.type).join(' + ') || 'global'"
            >
            </div>
          </div>
        </template>
        <template
          x-if="!host.parsedTopicStrategies || host.parsedTopicStrategies.length === 0"
        >
          <div
            class="text-xs text-gray-500 text-center p-4 italic border border-dashed border-gray-200 rounded-lg"
          >
            No topic strategies found.
          </div>
        </template>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-12 bg-slate-50/30 h-full relative">
      <template
        x-if="!host.parsedTopicStrategies || host.parsedTopicStrategies.length === 0"
      >
        <div
          class="flex flex-col items-center justify-center h-full text-slate-300 gap-6 opacity-60"
        >
          <div
            class="w-20 h-20 rounded-full bg-slate-100 flex items-center justify-center text-3xl"
          >
            <i class="fas fa-tags"></i>
          </div>
          <div class="text-center">
            <p
              class="text-lg font-black uppercase tracking-widest text-slate-800 m-0"
            >
              No Topic Strategies
            </p>
            <p class="text-xs font-bold text-slate-400 mt-2">
              Create a strategy from the directory to define audience segments
              for topics.
            </p>
          </div>
        </div>
      </template>

      <!-- Active Strategy Editing -->
      <template
        x-if="host.parsedTopicStrategies && host.parsedTopicStrategies.length > 0 && selectedTopicStrategyIndex >= 0 && selectedTopicStrategyIndex < host.parsedTopicStrategies.length"
      >
        <div
          x-data="{ strat: host.parsedTopicStrategies[selectedTopicStrategyIndex] }"
          x-init="$watch('selectedTopicStrategyIndex', () => { strat = host.parsedTopicStrategies[selectedTopicStrategyIndex] })"
          class="flex flex-col max-w-4xl mx-auto h-full gap-10"
        >
          <!-- Header -->
          <div
            class="flex justify-between items-end shrink-0 border-b border-slate-100 pb-8"
          >
            <div class="space-y-1">
              <div class="flex items-center gap-3">
                <span
                  class="px-2 py-0.5 rounded bg-blue-50 text-[10px] font-black text-blue-500 uppercase tracking-tighter"
                >Domain Strategy</span>
                <span class="w-1.5 h-1.5 rounded-full bg-slate-200"></span>
                <span
                  class="text-[10px] font-bold text-slate-400 font-mono italic"
                  x-text="strat.id"
                ></span>
              </div>
              <h2
                class="text-4xl font-black text-slate-900 tracking-tight m-0"
                x-text="strat.id || 'Untitled Strategy'"
              >
              </h2>
            </div>

            <div class="flex items-center gap-4">
              <button
                @click="deleteTopicStrategy()"
                class="h-10 px-4 rounded-xl border border-red-100 bg-red-50 text-red-600 hover:bg-red-100 transition-all font-black text-[11px] uppercase tracking-widest flex items-center gap-2 shadow-sm active:scale-95"
              >
                <i class="fas fa-trash-alt"></i> Delete
              </button>
            </div>
          </div>

          <!-- Configuration Grid -->
          <div class="grid grid-cols-1 gap-12 pb-20">
            <!-- IDENTITY SECTION -->
            <section class="space-y-6">
              <h3
                class="text-xs font-black uppercase tracking-widest text-slate-800 flex items-center gap-3"
              >
                <div
                  class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center text-blue-600 shadow-sm"
                >
                  <i class="fas fa-id-card text-xs"></i>
                </div>
                Strategy Identity
              </h3>
              <div
                class="p-8 bg-white border border-slate-200 rounded-[2rem] shadow-sm focus-within:ring-4 focus-within:ring-blue-500/5 transition-all"
              >
                <label
                  class="block text-[8px] font-black uppercase text-slate-400 mb-2 tracking-widest pl-1"
                >Unique Identifier / Alias</label>
                <input
                  type="text"
                  x-model="strat.id"
                  @change="host.saveTopicStrategies()"
                  class="w-full bg-slate-50/50 border border-slate-100 rounded-2xl px-5 py-4 text-sm font-black text-blue-600 outline-none focus:bg-white focus:border-blue-400 transition-all shadow-inner"
                  placeholder="e.g. RETAIL_CLIENTS"
                >
              </div>
            </section>

            <!-- LOGIC SECTION -->
            <section class="space-y-6">
              <div class="flex justify-between items-center pr-2">
                <h3
                  class="text-xs font-black uppercase tracking-widest text-slate-800 flex items-center gap-3"
                >
                  <div
                    class="w-8 h-8 rounded-lg bg-emerald-100 flex items-center justify-center text-emerald-600 shadow-sm"
                  >
                    <i class="fas fa-project-diagram text-xs"></i>
                  </div>
                  Segmentation Logic (Terms)
                </h3>

                <div class="flex items-center gap-2">
                  <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button
                      @click="strat.operator = 'AND'; host.saveTopicStrategies();"
                      class="px-3 py-1 text-[9px] font-black rounded-lg transition-all"
                      :class="strat.operator === 'AND' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'"
                    >
                      AND
                    </button>
                    <button
                      @click="strat.operator = 'OR'; host.saveTopicStrategies();"
                      class="px-3 py-1 text-[9px] font-black rounded-lg transition-all"
                      :class="strat.operator === 'OR' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'"
                    >
                      OR
                    </button>
                  </div>

                  <button
                    @click="if(!strat.matchers) strat.matchers = []; strat.matchers.push({ type: 'matchAlways' }); host.saveTopicStrategies();"
                    class="h-8 px-3 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 transition-all font-black text-[9px] uppercase tracking-widest flex items-center gap-2 shadow-md active:scale-95"
                  >
                    <i class="fas fa-plus"></i> Add Term
                  </button>
                </div>
              </div>

              <!-- Matcher List -->
              <div class="space-y-4">
                <!-- Legacy Bridge Alert -->
                <template
                  x-if="strat.type && (!strat.matchers || strat.matchers.length === 0)"
                >
                  <div
                    class="p-8 border-2 border-dashed border-amber-200 bg-amber-50 rounded-[2rem] flex items-center justify-between group/legacy transition-all hover:bg-amber-100/50"
                  >
                    <div class="flex items-center gap-6">
                      <div
                        class="w-14 h-14 rounded-2xl bg-amber-200 flex items-center justify-center text-amber-700 shadow-inner"
                      >
                        <i class="fas fa-history text-xl"></i>
                      </div>
                      <div>
                        <h4
                          class="text-sm font-black text-amber-900 m-0 uppercase tracking-tight"
                        >
                          Legacy Routing Detected
                        </h4>
                        <p
                          class="text-[10px] font-bold text-amber-700/70 m-0 mt-1"
                        >
                          This strategy uses the older point-to-point type:
                          <span class="font-mono" x-text="strat.type"></span>
                        </p>
                      </div>
                    </div>
                    <button
                      @click="
                                strat.matchers = [];
                                strat.operator = 'AND';
                                if(strat.type === 'global') strat.matchers.push({ type: 'matchAlways' });
                                if(strat.type === 'withRole') strat.matchers.push({ type: 'matchRole', value: strat.role });
                                if(strat.type === 'withRoleForCustomer') {
                                    strat.matchers.push({ type: 'matchRole', value: strat.role });
                                    strat.matchers.push({ type: 'matchProperty', key: 'licenseCustomers', value: strat.customer });
                                }
                                if(strat.type === 'withFeature') strat.matchers.push({ type: 'matchFeature', value: strat.feature });
                                if(strat.type === 'withFeatureForCustomer') {
                                    strat.matchers.push({ type: 'matchFeature', value: strat.feature });
                                    strat.matchers.push({ type: 'matchProperty', key: 'licenseCustomers', value: strat.customer });
                                }
                                delete strat.type; delete strat.role; delete strat.feature; delete strat.customer;
                                host.saveTopicStrategies();
                            "
                      class="px-6 py-3 rounded-2xl bg-amber-900 text-amber-100 font-black text-[10px] uppercase tracking-widest shadow-xl hover:scale-105 active:scale-95 transition-all"
                    >
                      Upgrade to Composable
                    </button>
                  </div>
                </template>

                <template
                  x-for="(matcher, mIdx) in (strat.matchers || [])"
                  :key="mIdx"
                >
                  <div
                    class="group/term relative flex items-center gap-4 animate-in slide-in-from-left-4 duration-300"
                    :style="`animation-delay: ${mIdx * 50}ms`"
                  >
                    <!-- Connector Logic -->
                    <template x-if="mIdx > 0">
                      <div
                        class="absolute -top-4 left-6 w-px h-8 bg-slate-200 z-0"
                      >
                      </div>
                    </template>

                    <div
                      class="flex-1 bg-white border border-slate-200 rounded-[1.75rem] p-6 shadow-sm hover:shadow-md hover:border-emerald-300 transition-all flex items-center gap-6 z-10"
                    >
                      <div
                        class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 shrink-0"
                      >
                        <span
                          class="text-[10px] font-black"
                          x-text="mIdx + 1"
                        ></span>
                      </div>

                      <div class="flex-1 grid grid-cols-12 gap-6 items-end">
                        <div class="col-span-4">
                          <label
                            class="block text-[8px] font-black uppercase text-slate-400 mb-1 tracking-widest pl-1"
                          >Matcher Type</label>
                          <select
                            x-model="matcher.type"
                            @change="host.saveTopicStrategies()"
                            class="w-full bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 text-[10px] font-black text-slate-700 outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-400 shadow-inner"
                          >
                            <template
                              x-for="prim in (host.availablePrimitives || [])"
                              :key="prim"
                            >
                              <option
                                :value="prim"
                                x-text="prim"
                                :selected="matcher.type === prim"
                              >
                              </option>
                            </template>
                          </select>
                        </div>

                        <div class="col-span-8">
                          <!-- Dynamic Matcher Inputs (Harmonized) -->

                          <!-- matchRole -->
                          <template x-if="matcher.type === 'matchRole'">
                            <div>
                              <label
                                class="block text-[8px] font-black uppercase text-slate-400 mb-1 tracking-widest pl-1"
                              >Business Function</label>
                              <select
                                x-model="matcher.value"
                                @change="host.saveTopicStrategies()"
                                class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-[10px] font-black text-blue-600 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 shadow-sm"
                              >
                                <option value="">-- Choose Function --</option>
                                <template
                                  x-for="role in (host.availableRoles || [])"
                                  :key="role.id"
                                >
                                  <option
                                    :value="role.id"
                                    x-text="`${role.id} (${role.type})`"
                                    :selected="matcher.value === role.id"
                                  >
                                  </option>
                                </template>
                              </select>
                            </div>
                          </template>

                          <!-- matchFeature -->
                          <template x-if="matcher.type === 'matchFeature'">
                            <div>
                              <label
                                class="block text-[8px] font-black uppercase text-slate-400 mb-1 tracking-widest pl-1"
                              >Feature Requirement</label>
                              <select
                                x-model="matcher.value"
                                @change="host.saveTopicStrategies()"
                                class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-[10px] font-black text-purple-600 outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-400 shadow-sm"
                              >
                                <option value="">-- Choose Feature --</option>
                                <template
                                  x-for="feat in (host.availableFeatures || [])"
                                  :key="feat"
                                >
                                  <option
                                    :value="feat"
                                    x-text="feat"
                                    :selected="matcher.value === feat"
                                  >
                                  </option>
                                </template>
                              </select>
                            </div>
                          </template>

                          <!-- matchProperty -->
                          <template x-if="matcher.type === 'matchProperty'">
                            <div class="flex gap-2">
                              <div class="flex-1">
                                <label
                                  class="block text-[8px] font-black uppercase text-slate-400 mb-1 tracking-widest pl-1"
                                >Property Key</label>
                                <input
                                  type="text"
                                  x-model="matcher.key"
                                  @change="host.saveTopicStrategies()"
                                  class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-[10px] font-black text-slate-700 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 shadow-sm"
                                  placeholder="e.g. userId"
                                >
                              </div>
                              <div class="flex-1">
                                <label
                                  class="block text-[8px] font-black uppercase text-slate-400 mb-1 tracking-widest pl-1"
                                >Comparison Value</label>
                                <template
                                  x-if="matcher.key === 'licenseCustomers'"
                                >
                                  <select
                                    x-model="matcher.value"
                                    @change="host.saveTopicStrategies()"
                                    class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-[10px] font-black text-amber-600 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 shadow-sm"
                                  >
                                    <option value="">
                                      -- Select Customer --
                                    </option>
                                    <template
                                      x-for="cust in (host.allAvailableCustomers || [])"
                                      :key="cust.id"
                                    >
                                      <option
                                        :value="cust.id"
                                        x-text="`${cust.name} (${cust.id})`"
                                        :selected="matcher.value === cust.id"
                                      >
                                      </option>
                                    </template>
                                  </select>
                                </template>
                                <template
                                  x-if="matcher.key !== 'licenseCustomers'"
                                >
                                  <input
                                    type="text"
                                    x-model="matcher.value"
                                    @change="host.saveTopicStrategies()"
                                    class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-[10px] font-black text-amber-600 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 shadow-sm"
                                    placeholder="e.g. true"
                                  >
                                </template>
                              </div>
                            </div>
                          </template>

                          <!-- matchAlways / other -->
                          <template
                            x-if="!['matchRole', 'matchFeature', 'matchProperty'].includes(matcher.type)"
                          >
                            <div
                              class="h-10 flex items-center justify-center border border-dashed border-slate-200 rounded-xl bg-slate-50/30"
                            >
                              <span
                                class="text-[9px] font-bold text-slate-300 uppercase italic"
                              >Unconditional Segment (Broadcast)</span>
                            </div>
                          </template>
                        </div>
                      </div>

                      <!-- Remove Matcher -->
                      <button
                        @click="if(strat.matchers.length > 1) { strat.matchers.splice(mIdx, 1); host.saveTopicStrategies(); } else { alert('Strategy must have at least one matcher.'); }"
                        class="p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover/term:opacity-100 transition-all active:scale-95"
                      >
                        <i class="fas fa-minus-circle"></i>
                      </button>
                    </div>
                  </div>
                </template>

                <template
                  x-if="(!strat.matchers || strat.matchers.length === 0) && !strat.type"
                >
                  <div
                    class="p-12 border border-dashed border-slate-200 rounded-[2.5rem] bg-slate-50/50 flex flex-col items-center justify-center text-center gap-4"
                  >
                    <div
                      class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-emerald-200 shadow-sm"
                    >
                      <i class="fas fa-magic"></i>
                    </div>
                    <div class="space-y-1">
                      <p
                        class="text-xs font-black text-slate-800 uppercase tracking-widest m-0"
                      >
                        No Logic Defined
                      </p>
                      <p class="text-[10px] font-bold text-slate-400 m-0">
                        Click 'Add Term' to define who should receive this
                        topic.
                      </p>
                    </div>
                  </div>
                </template>
              </div>
            </section>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
