<div class="bg-white shadow rounded-lg p-6 max-w-2xl mx-auto mt-8">
  <h2
    class="text-2xl font-bold mb-6"
    x-text="editingPerson.id ? 'Edit Person' : 'New Person'"
  >
  </h2>

  <form @submit.prevent="savePerson" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700"
        >First Name</label>
        <input
          type="text"
          x-model="editingPerson.firstname"
          required
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-orange-500 focus:border-orange-500"
        >
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Last Name</label>
        <input
          type="text"
          x-model="editingPerson.lastname"
          required
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-orange-500 focus:border-orange-500"
        >
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Birth Date</label>
      <input
        type="date"
        x-model="editingPerson.birthdate"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-orange-500 focus:border-orange-500"
      >
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700"
      >Emails (comma separated)</label>
      <textarea
        x-model="editingPerson.emails"
        rows="2"
        placeholder="e.g. john@example.com, john.doe@work.com"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-orange-500 focus:border-orange-500 font-mono text-sm"
      ></textarea>
      <p class="text-xs text-gray-500 mt-1">
        Use commas to separate multiple emails.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700"
      >User IDs (comma separated)</label>
      <textarea
        x-model="editingPerson.userids"
        rows="2"
        placeholder="e.g. 5786432, 9238451"
        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-orange-500 focus:border-orange-500 font-mono text-sm"
      ></textarea>
      <p class="text-xs text-gray-500 mt-1">
        These IDs map the real-life person to their digital user identities.
      </p>
    </div>

    <template x-if="editingPerson.id">
      <div>
        <label class="block text-sm font-medium text-gray-700"
        >ID (Internal)</label>
        <input
          type="text"
          x-model="editingPerson.id"
          disabled
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-gray-50 text-gray-500 font-mono text-sm"
        >
      </div>
    </template>

    <div class="flex justify-end space-x-3 pt-6">
      <button
        type="button"
        @click="loadStep('dashboard')"
        class="bg-gray-200 text-gray-700 px-4 py-2 rounded shadow hover:bg-gray-300"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="bg-orange-600 text-white px-4 py-2 rounded shadow hover:bg-orange-700"
      >
        Save Person
      </button>
    </div>
  </form>
</div>
