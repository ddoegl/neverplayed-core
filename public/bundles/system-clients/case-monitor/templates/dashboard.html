<div class="h-full w-full flex flex-col p-8 bg-slate-50 overflow-hidden">
  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-4">
      <div
        class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-200"
      >
        <i class="fas fa-bars text-2xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-900 leading-tight">
          Case System Monitor
        </h1>
        <p class="text-sm text-slate-500 font-medium">
          Global signature pipeline & document management
        </p>
      </div>
    </div>
    <button
      @click="refresh()"
      class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm"
    >
      <i class="fas fa-sync-alt"></i>
      Refresh Data
    </button>
  </div>

  <!-- Main Content Grid -->
  <div class="flex-1 overflow-y-auto space-y-8 pr-2 custom-scrollbar">
    <template x-for="(cases, type) in casesByType" :key="type">
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <h2
            class="text-xs font-bold uppercase tracking-widest text-slate-400"
            x-text="type"
          >
          </h2>
          <div class="h-px flex-1 bg-slate-200"></div>
          <span
            class="text-[10px] font-bold bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full"
            x-text="cases.length"
          ></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <template x-for="c in cases" :key="c.id">
            <div
              @click="inspectCase(c)"
              class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all cursor-pointer group"
            >
              <div class="flex justify-between items-start mb-4">
                <div
                  class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-colors"
                >
                  <i
                    :class="c.status === 'signed' ? 'fas fa-check-circle text-emerald-500' : 'fas fa-clock'"
                  ></i>
                </div>
                <span
                  class="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md"
                  :class="c.status === 'signed' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'"
                  x-text="c.status"
                ></span>
              </div>

              <h3
                class="font-bold text-slate-900 group-hover:text-indigo-600 transition-colors mb-1 truncate"
                x-text="c.name"
              >
              </h3>
              <p
                class="text-xs text-slate-500 line-clamp-2 mb-4"
                x-text="c.description"
              >
              </p>

              <div
                class="flex items-center justify-between pt-4 border-t border-slate-50"
              >
                <div class="text-[10px] font-mono text-slate-400" x-text="c.id">
                </div>
                <div class="flex -space-x-2">
                  <template x-for="sig in (c.signatures || [])">
                    <div
                      class="w-6 h-6 rounded-full border-2 border-white flex items-center justify-center text-[10px] font-bold"
                      :class="sig.status === 'signed' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'"
                      :title="sig.signee + ' (' + sig.status + ')'"
                    >
                      <i class="fas fa-user"></i>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="allCases.length === 0">
      <div class="flex flex-col items-center justify-center py-24 text-center">
        <div
          class="w-16 h-16 bg-slate-100 text-slate-300 rounded-full flex items-center justify-center mb-4"
        >
          <i class="fas fa-folder-open text-2xl"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800">No Cases Found</h3>
        <p class="text-sm text-slate-500 max-w-xs">
          There are currently no active or closed cases recorded in the system.
        </p>
      </div>
    </template>
  </div>

  <!-- Inspector Modal Overlay -->
  <template x-if="selectedCase">
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div
        class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"
        @click="closeCase()"
      >
      </div>

      <div
        class="relative bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]"
      >
        <!-- Modal Header -->
        <div
          class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50"
        >
          <div class="flex items-center gap-3">
            <div
              class="text-indigo-600 bg-white w-8 h-8 rounded-lg flex items-center justify-center shadow-sm"
            >
              <i class="fas fa-file-invoice"></i>
            </div>
            <h2 class="font-bold text-slate-900" x-text="selectedCase.name">
            </h2>
          </div>
          <button
            @click="closeCase()"
            class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center transition-colors"
          >
            <i class="fas fa-times text-slate-400"></i>
          </button>
        </div>

        <!-- Modal Body -->
        <div class="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
          <!-- Status & Metadata -->
          <div class="grid grid-cols-2 gap-8 font-medium">
            <div>
              <span
                class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2"
              >Case Registry ID</span>
              <code
                class="text-sm text-slate-700 bg-slate-100 px-2 py-1 rounded"
                x-text="selectedCase.id"
              ></code>
            </div>
            <div>
              <span
                class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2"
              >Registration Status</span>
              <span
                class="px-2 py-1 rounded text-xs font-bold uppercase"
                :class="selectedCase.status === 'signed' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'"
                x-text="selectedCase.status"
              ></span>
            </div>
            <div>
              <span
                class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2"
              >Creation Date</span>
              <span
                class="text-sm text-slate-600"
                x-text="formatDate(selectedCase.metadata?.createdAt)"
              ></span>
            </div>
            <div>
              <span
                class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2"
              >Case Type</span>
              <span
                class="text-sm text-slate-600 font-bold"
                x-text="selectedCase.type"
              ></span>
            </div>
          </div>

          <!-- Signatures -->
          <div class="space-y-4">
            <h4
              class="text-xs font-bold text-slate-900 uppercase tracking-widest"
            >
              Required Signatures
            </h4>
            <div class="space-y-2">
              <template
                x-for="sig in selectedCase.signatures"
                :key="sig.personId"
              >
                <div
                  class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100"
                >
                  <div class="flex items-center gap-3">
                    <div
                      class="w-8 h-8 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-400"
                    >
                      <i class="fas fa-user"></i>
                    </div>
                    <div>
                      <div
                        class="text-sm font-bold text-slate-800"
                        x-text="sig.signee"
                      >
                      </div>
                      <div
                        class="text-[10px] text-slate-400 uppercase font-bold"
                        x-text="sig.role"
                      >
                      </div>
                    </div>
                  </div>
                  <span
                    class="text-[10px] font-bold uppercase px-2 py-0.5 rounded shadow-sm"
                    :class="sig.status === 'signed' ? 'bg-emerald-500 text-white' : 'bg-white text-slate-400 border border-slate-200'"
                    x-text="sig.status"
                  ></span>
                </div>
              </template>
            </div>
          </div>

          <!-- Raw Metadata -->
          <div class="space-y-4">
            <h4
              class="text-xs font-bold text-slate-900 uppercase tracking-widest"
            >
              Extended Metadata
            </h4>
            <pre
              class="bg-slate-900 text-slate-300 p-4 rounded-2xl text-[10px] font-mono leading-relaxed overflow-x-auto"
              x-text="JSON.stringify(selectedCase.metadata, null, 2)"
            ></pre>
          </div>
        </div>

        <!-- Footer -->
        <div class="p-6 bg-slate-50 border-t border-slate-100 flex justify-end">
          <button
            @click="closeCase()"
            class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all"
          >
            Done
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #e2e8f0;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #cbd5e1;
  }
</style>
