<div
  class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden border border-gray-200"
>
  <div class="p-8">
    <div class="flex items-center space-x-6 mb-8">
      <div
        class="w-24 h-24 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-3xl"
      >
        <span
          x-text="selectedPerson ? (selectedPerson.firstname[0] + selectedPerson.lastname[0]) : ''"
        ></span>
      </div>
      <div>
        <h2
          class="text-3xl font-bold text-gray-800"
          x-text="selectedPerson ? (selectedPerson.firstname + ' ' + selectedPerson.lastname) : ''"
        >
        </h2>
        <div class="text-gray-500 mt-1 flex items-center space-x-2">
          <i class="fas fa-envelope"></i>
          <span x-text="selectedPerson?.email || 'No email'"></span>
        </div>
        <div class="text-gray-500 mt-1 flex items-center space-x-2">
          <i class="fas fa-birthday-cake"></i>
          <span x-text="selectedPerson?.birthdate || 'No birthdate'"></span>
        </div>
      </div>
    </div>

    <div
      class="border-t border-gray-200 py-6"
      x-data="{
        getLicenseForUser(uid) {
            try {
                return 'OSGi Managed';
            } catch(e) { return 'Unknown'; }
        },
        linkedTenants_legacy() {
            return []; // Legacy tenant resolution disabled
        }
    }"
    >
      <h3 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
        <i class="fas fa-id-badge mr-2 text-gray-400"></i> Identity & Access
      </h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <!-- User IDs / Aliases Block -->
        <div
          class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm relative overflow-hidden"
        >
          <div
            class="absolute top-0 left-0 w-1 h-full"
            :class="personUsers.length > 0 ? 'bg-amber-400' : 'bg-gray-300'"
          >
          </div>
          <p
            class="text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold"
          >
            User IDs / Aliases
          </p>
          <div class="mt-3 space-y-2">
            <template x-for="user in personUsers">
              <div
                class="flex items-center justify-between bg-white p-2 rounded border border-gray-100 shadow-sm"
              >
                <div>
                  <div
                    class="text-xs font-bold text-gray-800"
                    x-text="user.alias || 'No Alias'"
                  >
                  </div>
                  <div
                    class="text-[10px] text-gray-400 font-mono"
                    x-text="'ID: ' + user.id"
                  >
                  </div>
                </div>
                <div class="text-right">
                  <div
                    class="text-[9px] uppercase tracking-tighter font-bold text-amber-600"
                    x-text="user.scaStrategy || 'No SCA'"
                  >
                  </div>
                  <div class="text-[8px] text-gray-300" x-text="user.licenseId">
                  </div>
                </div>
              </div>
            </template>
            <template x-if="personUsers.length === 0">
              <div class="text-gray-400 text-sm italic py-2">
                No user IDs assigned
              </div>
            </template>
          </div>
        </div>

        <!-- Customer of Tenant Block -->
        <div
          class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm relative overflow-hidden"
        >
          <div
            class="absolute top-0 left-0 w-1 h-full"
            :class="linkedTenants.length > 0 ? 'bg-green-400' : 'bg-red-400'"
          >
          </div>
          <p
            class="text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold"
          >
            Customer of Tenant
          </p>

          <template x-if="linkedTenants.length > 0">
            <div class="space-y-3 mt-2">
              <template x-for="tenant in linkedTenants">
                <div>
                  <div class="font-bold text-gray-800" x-text="tenant.name">
                  </div>
                  <div
                    class="text-xs text-gray-400 font-mono bg-gray-200 px-2 py-0.5 mt-1 rounded inline-block"
                    x-text="'ID: ' + tenant.id"
                  >
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="linkedTenants.length === 0">
            <div class="flex items-center text-gray-500 py-2 mt-1">
              <i class="fas fa-unlink mr-2 text-gray-400"></i>
              <span class="italic text-sm">Not linked to any tenant</span>
            </div>
          </template>
        </div>

        <!-- Fellow Status Block -->
        <div
          class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm relative overflow-hidden"
        >
          <div
            class="absolute top-0 left-0 w-1 h-full"
            :class="fellows.find(a => a.person === selectedPerson?.id || a.personId === selectedPerson?.id) ? 'bg-blue-400' : 'bg-gray-400'"
          >
          </div>
          <p
            class="text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold"
          >
            Fellow Of
          </p>
          <div class="mt-3 text-gray-800">
            <template
              x-if="fellows.find(a => a.person === selectedPerson?.id || a.personId === selectedPerson?.id)"
            >
              <div>
                <div class="text-xs text-gray-500 mt-1 flex items-center">
                  <i class="fas fa-building mr-1.5 opacity-70"></i>
                  <span>Fellow: <span
                      class="font-semibold"
                      x-text="
                    (() => {
                        const f = fellows.find(a => a.person === selectedPerson?.id || a.personId === selectedPerson?.id);
                        if (!f || !f.fellowOf) return 'Unknown';
                        const c = companies.find(c => c.id === f.fellowOf);
                        return c ? c.name : f.fellowOf;
                    })()
                  "
                    ></span></span>
                </div>
              </div>
            </template>
            <template
              x-if="!fellows.find(a => a.person === selectedPerson?.id || a.personId === selectedPerson?.id)"
            >
              <div class="text-gray-500 flex items-center text-lg">
                <i class="fas fa-times-circle mr-2"></i> Non-Fellow
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Enter Environment Section -->
      <div
        class="bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-sm relative overflow-hidden"
      >
        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-400"></div>
        <div class="flex items-center justify-between mb-4">
          <p
            class="text-xs uppercase tracking-wider text-gray-500 font-semibold"
          >
            Enter Client Environment
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <!-- Web Browser CTA -->
          <button
            @click="switchEnvironment('web-browser')"
            class="flex items-center gap-4 p-5 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-xl hover:border-indigo-400 hover:bg-slate-50 transition-all group"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:scale-110 transition-transform"
            >
              <i class="fas fa-desktop text-2xl"></i>
            </div>
            <div class="text-left">
              <div class="font-bold text-slate-800 text-lg">Web Browser</div>
              <div class="text-xs text-slate-400 font-medium">
                Desktop Environment
              </div>
            </div>
          </button>

          <!-- Mobile Device CTA -->
          <button
            @click="switchEnvironment('mobile-device')"
            class="flex items-center gap-4 p-5 bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-xl hover:border-blue-400 hover:bg-slate-50 transition-all group"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center group-hover:scale-110 transition-transform"
            >
              <i class="fas fa-mobile-alt text-2xl"></i>
            </div>
            <div class="text-left">
              <div class="font-bold text-slate-800 text-lg">Mobile Device</div>
              <div class="text-xs text-slate-400 font-medium">
                Smartphone Simulation
              </div>
            </div>
          </button>
        </div>
      </div>

      <!-- Markup Content Loading Placeholder if needed, but for now just showing data -->
      <!-- If we want to load the MD content: <div x-html="renderedPersonContent"></div> -->
    </div>

    <div class="mt-8 flex justify-between items-center">
      <button
        @click="loadStep('dashboard')"
        class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors font-medium"
      >
        <i class="fas fa-arrow-left mr-2"></i> Back
      </button>

      <div class="flex space-x-3 items-center">
        <button
          @click="selectFlow('bootstrap-license')"
          class="px-6 py-3 bg-white text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition-colors font-medium flex items-center"
        >
          <i class="fas fa-plus-circle mr-2"></i> New License
        </button>
      </div>
    </div>
  </div>
</div>
