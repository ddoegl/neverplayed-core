<div id="stratum-explorer-root" 
     x-data="{ 
        get isVisible() { return $store.explorer?.visible },
        _renderTimeout: null,
        init() {
            this.$watch('$store.explorer.nodes', () => this.renderD3());
        },
        renderD3() {
            if (!this.isVisible) return;
            if (this._renderTimeout) clearTimeout(this._renderTimeout);
            
            this._renderTimeout = setTimeout(() => {
                this.$nextTick(() => {
                    const container = this.$refs.graphContainer;
                    if (!container) return;
                    console.info('🪐 Explorer: Optical Render Triggered.');
                    globalThis.dispatchEvent(new CustomEvent('explorer-render-request', { detail: { element: container } }));
                });
            }, 100);
        }
     }" 
     x-show="isVisible"
     class="fixed inset-0 z-[110] flex items-center justify-center pointer-events-none"
     x-transition:enter="transition ease-out duration-500"
     x-transition:enter-start="opacity-0 backdrop-blur-0"
     x-transition:enter-end="opacity-100 backdrop-blur-md"
     x-cloak>
    
    <!-- Background Dimmer/Blur -->
    <div class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm pointer-events-auto" @click="$store.explorer.visible = false"></div>

    <!-- Graph Container -->
    <div class="relative bg-slate-900/40 border border-slate-700/50 rounded-[2.5rem] p-8 shadow-3xl w-[80vw] h-[70vh] pointer-events-auto flex flex-col overflow-hidden backdrop-blur-2xl">
        <!-- Decoration Nodes -->
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-purple-500/10 rounded-full blur-3xl"></div>

        <div class="flex items-center justify-between mb-6 z-10">
            <div>
                <h2 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">Areal Network Navigator</h2>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold mt-1">Sovereign Topology • Real-time Optical Tracking</p>
            </div>

            <div class="flex items-center space-x-6">
                <!-- Perspective Toggle -->
                <div class="flex p-1 bg-slate-950/50 rounded-xl border border-slate-800/50">
                    <button @click="$store.explorer.perspective = 'idealist'" 
                            :class="$store.explorer.perspective === 'idealist' ? 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30' : 'text-slate-500 hover:text-slate-300 border-transparent'"
                            class="px-3 py-1.5 rounded-lg text-[9px] font-bold uppercase tracking-widest border transition-all flex items-center space-x-2">
                        <i class="fas fa-sparkles"></i>
                        <span>Idealist</span>
                    </button>
                    <button @click="$store.explorer.perspective = 'realist'" 
                            :class="$store.explorer.perspective === 'realist' ? 'bg-purple-500/20 text-purple-400 border-purple-500/30' : 'text-slate-500 hover:text-slate-300 border-transparent'"
                            class="px-3 py-1.5 rounded-lg text-[9px] font-bold uppercase tracking-widest border transition-all flex items-center space-x-2">
                        <i class="fas fa-cube"></i>
                        <span>Realist</span>
                    </button>
                </div>

                <button @click="$store.explorer.visible = false" class="w-10 h-10 rounded-full bg-slate-800/50 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- SVG Anchor for D3 -->
        <div class="flex-grow rounded-3xl bg-slate-950/30 border border-slate-800/50 relative overflow-hidden flex">
             <!-- Background Layer (Spinning Decor) -->
             <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10 z-0">
                 <i class="fas fa-atom text-8xl text-cyan-500 animate-[spin_10s_linear_infinite]"></i>
             </div>

             <!-- Sidebar for Vault Inspection (z-20) -->
             <div x-show="$store.explorer.activeNode" 
                  x-transition:enter="transition ease-out duration-300"
                  x-transition:enter-start="-translate-x-full opacity-0"
                  x-transition:enter-end="translate-x-0 opacity-100"
                  class="absolute left-0 top-0 bottom-0 w-80 bg-slate-900/90 backdrop-blur-xl border-r border-slate-700/50 z-20 p-6 flex flex-col shadow-2xl"
                  x-cloak>
                  
                  <div class="flex items-center justify-between mb-6">
                      <div>
                          <h3 class="text-sm font-bold text-white uppercase tracking-tighter" x-text="'Vault: ' + $store.explorer.activeNode?.label"></h3>
                          <p class="text-[10px] text-cyan-400 font-mono truncate w-48" x-text="$store.explorer.activeNode?.value"></p>
                      </div>
                      <button @click="$store.explorer.activeNode = null" class="text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
                  </div>

                  <div class="flex-grow overflow-y-auto pr-2 space-y-3 custom-scrollbar">
                      <!-- Stigmergic Marks (Perceptual Trace Recovery) -->
                      <template x-if="$store.explorer.perceptualTrace">
                          <div class="bg-indigo-500/10 border border-indigo-500/30 rounded-2xl p-4 mb-4">
                              <div class="flex items-center space-x-2 mb-3">
                                  <i class="fas fa-microscope text-indigo-400"></i>
                                  <span class="text-[9px] uppercase tracking-[0.2em] font-bold text-indigo-300">Stigmergic Trace Recovery</span>
                              </div>
                              <div class="space-y-2">
                                  <div class="flex items-center justify-between">
                                      <span class="text-[10px] text-slate-400">Status</span>
                                      <span :class="$store.explorer.perceptualTrace.result ? 'text-emerald-400' : 'text-rose-400'" 
                                            class="text-[10px] font-bold uppercase tracking-widest"
                                            x-text="$store.explorer.perceptualTrace.result ? 'Sensed' : 'Occluded'"></span>
                                  </div>
                                  <div class="flex items-center justify-between">
                                      <span class="text-[10px] text-slate-400">Niche</span>
                                      <span class="text-[10px] text-cyan-400 font-mono" x-text="$store.explorer.perceptualTrace.context.realm"></span>
                                  </div>
                                  <div class="flex items-center justify-between">
                                      <span class="text-[10px] text-slate-400">Persona</span>
                                      <span class="text-[10px] text-purple-400 uppercase font-bold" x-text="$store.explorer.perceptualTrace.context.persona"></span>
                                  </div>
                                  <div class="mt-3 pt-3 border-t border-indigo-500/20">
                                      <div class="text-[8px] uppercase text-indigo-400/60 font-bold mb-1">Active Senses (Matches)</div>
                                      <div class="flex flex-wrap gap-1">
                                          <template x-for="match in ($store.explorer.perceptualTrace.matches || [])">
                                              <span class="bg-indigo-500/20 text-indigo-300 text-[8px] px-1.5 py-0.5 rounded border border-indigo-500/20" x-text="match"></span>
                                          </template>
                                          <template x-if="!$store.explorer.perceptualTrace.matches?.length">
                                              <span class="text-slate-600 text-[8px] italic">No active senses matched.</span>
                                          </template>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </template>

                      <div class="flex items-center space-x-2 mb-2 px-1">
                          <i class="fas fa-database text-slate-500 text-[10px]"></i>
                          <span class="text-[9px] uppercase tracking-widest font-bold text-slate-500">Structural Vault Data</span>
                      </div>

                      <template x-if="$store.explorer.loadingVault">
                          <div class="flex flex-col items-center justify-center h-40 space-y-2 opacity-50">
                              <i class="fas fa-satellite-dish animate-pulse text-cyan-400"></i>
                              <span class="text-[9px] uppercase tracking-widest text-slate-500">Scanning Stratum...</span>
                          </div>
                      </template>
                      
                      <template x-for="item in $store.explorer.vaultKeys" :key="item.key">
                          <div class="bg-slate-950/50 border border-slate-800/50 rounded-xl p-3 hover:border-cyan-500/30 transition-all group">
                              <div class="flex items-center justify-between mb-2">
                                  <span class="text-[10px] font-mono text-cyan-200 truncate w-40" x-text="item.key"></span>
                                  <span class="text-[8px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 uppercase font-bold" x-text="item.probe.tier"></span>
                              </div>
                              <div class="text-[9px] text-slate-400 font-mono break-all line-clamp-2 group-hover:line-clamp-none transition-all" x-text="typeof item.value === 'object' ? JSON.stringify(item.value) : item.value"></div>
                          </div>
                      </template>

                      <template x-if="!$store.explorer.loadingVault && $store.explorer.vaultKeys.length === 0">
                          <div class="text-center py-10 opacity-30">
                              <i class="fas fa-box-open text-2xl mb-2"></i>
                              <p class="text-[9px] uppercase tracking-widest font-bold">Vault Empty</p>
                          </div>
                      </template>
                  </div>
             </div>

             <!-- Foreground Layer (D3 SVG Mount) (z-10) -->
             <div x-ref="graphContainer" class="absolute inset-0 z-10"></div>
        </div>

        <div class="mt-6 flex items-center justify-between text-[10px] text-slate-500 font-mono">
            <span>Graph Mode: Force-Directed (Sovereignty Centered)</span>
            <div class="flex space-x-4">
                 <div class="flex items-center space-x-1"><div class="w-2 h-2 rounded-full bg-cyan-400"></div><span>Who</span></div>
                 <div class="flex items-center space-x-1"><div class="w-2 h-2 rounded-full bg-purple-400"></div><span>Where</span></div>
                 <div class="flex items-center space-x-1"><div class="w-2 h-2 rounded-full bg-amber-400"></div><span>How</span></div>
            </div>
        </div>

        <!-- Forensic Log Pane (Live Perceptual Stream) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] z-30 pointer-events-none"
             x-data="{ expanded: false }">
            <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-2xl border border-slate-700/50 rounded-2xl shadow-3xl overflow-hidden transition-all duration-500"
                 :class="expanded ? 'h-64' : 'h-12'">
                
                <!-- Header -->
                <div class="h-12 px-6 flex items-center justify-between border-b border-slate-800/50 bg-slate-800/30 cursor-pointer"
                     @click="expanded = !expanded">
                    <div class="flex items-center space-x-3">
                        <div class="flex items-center space-x-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="text-[9px] font-black uppercase tracking-[0.2em] text-slate-400">Forensic Perceptual Stream</span>
                        </div>
                        <template x-if="$store.plexusTracing?.sensingLog?.length">
                            <span class="bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full text-[9px] font-mono border border-indigo-500/30" 
                                  x-text="$store.plexusTracing.sensingLog.length"></span>
                        </template>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-[8px] text-slate-500 uppercase font-bold tracking-widest" x-show="!expanded">Click to expand forensic history</span>
                        <i class="fas text-slate-500 transition-transform duration-300" :class="expanded ? 'fa-chevron-down' : 'fa-chevron-up'"></i>
                    </div>
                </div>

                <!-- Log Content -->
                <div class="h-52 overflow-y-auto p-4 font-mono text-[10px] space-y-1 custom-scrollbar bg-black/20" x-show="expanded" x-transition>
                    <template x-for="log in ($store.plexusTracing?.sensingLog || [])" :key="log.timestamp + '-' + (log.id || 'anon')">
                        <div x-show="log" class="flex items-start space-x-4 py-1.5 border-b border-slate-800/30 last:border-0 hover:bg-white/5 px-2 rounded transition-colors">
                            <span class="text-slate-600 shrink-0" x-text="log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : '??:??:??'"></span>
                            <span :class="log.result ? 'text-emerald-400' : 'text-rose-400'" class="font-black shrink-0 w-16" x-text="log.result ? 'SENSED' : 'OCCLUDED'"></span>
                            <span class="text-indigo-400 font-bold shrink-0 w-32 truncate" x-text="log.id"></span>
                            <div class="flex flex-wrap gap-1">
                                <template x-for="match in (log.matches || [])">
                                    <span class="text-[8px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700/50" x-text="match"></span>
                                </template>
                                <template x-if="!log.result && !log.matches?.length">
                                    <span class="text-rose-500/40 italic text-[9px]">Perceptual Occlusion</span>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template x-if="!$store.plexusTracing?.sensingLog?.length">
                        <div class="h-full flex flex-col items-center justify-center text-slate-700 italic space-y-2">
                            <i class="fas fa-eye-slash text-2xl opacity-20"></i>
                            <p>No perceptual events captured in this session.</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .node-label {
        font-family: 'Inter', sans-serif;
        font-size: 10px;
        fill: #94a3b8;
        font-weight: 500;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }
    .node-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #f8fafc;
        pointer-events: none;
    }
    .link {
        stroke: rgba(148, 163, 184, 0.1);
        stroke-width: 1.5px;
    }
    .node-group {
        cursor: pointer;
        pointer-events: all;
    }
    .node-group circle.hit-area {
        fill: transparent;
        stroke: none;
    }
    .node-group circle.visual {
        stroke-width: 2px;
        transition: stroke-width 0.2s ease, r 0.2s ease;
    }
    .node-group:hover circle.visual {
        stroke-width: 4px;
        r: 12;
    }
</style>
