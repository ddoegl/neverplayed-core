<div
  class="flex flex-col h-full overflow-hidden p-6"
  x-data="{
    view: 'assignment',
    editingBundle: null,
    bulkAssigningBundle: null,
    selectedUsers: [],
    bundleSearch: '',
    
    get targetUser() {
        if (!activeLicense || !selectedUserId) return null;
        return activeLicense?.USERS?.find(u => u.id === selectedUserId);
    },
    get permissionBundles() {
        if (!activeLicense) return [];
        // Extract and normalize bundles to ensure consistency (UPPERCASE_UNDERSCORE)
        return (activeLicense.PERMISSIONBUNDLES || []).map(b => {
            const name = Object.keys(b)[0];
            const rawKeys = b[name] || [];
            const normalizedKeys = rawKeys.map(k => String(k).toUpperCase().replace(/:/g, '_'));
            const entry = {};
            entry[name] = normalizedKeys;
            return entry;
        });
    },
    get allSystemPermissions() {
        if (!activeLicense || !window.getAvailablePermissionKeys) return [];
        return window.getAvailablePermissionKeys(this.backoffice.parsedRules, activeLicense);
    },
    
    // --- USER ASSIGNMENT ---
    toggleBundle(bundleObj, userId = null) {
        const targetId = userId || selectedUserId;
        if (!targetId) return;
        
        const user = activeLicense?.USERS?.find(u => u.id === targetId);
        if (!user) return;

        if (!user.permissionbundles) user.permissionbundles = [];
        let bundleName = Object.keys(bundleObj)[0];
        let idx = user.permissionbundles.indexOf(bundleName);
        if (idx > -1) {
            user.permissionbundles.splice(idx, 1);
        } else {
            user.permissionbundles.push(bundleName);
        }
        syncLicensesToYaml();
    },
    hasBundle(bundleObj, userId = null) {
        const targetId = userId || selectedUserId;
        if (!targetId) return false;
        
        const user = activeLicense.USERS.find(u => u.id === targetId);
        if (!user || !user.permissionbundles) return false;

        let bundleName = Object.keys(bundleObj)[0];
        return user.permissionbundles.includes(bundleName);
    },

    // --- BULK ASSIGNMENT ---
    startBulkAssign(bundleObj) {
        this.bulkAssigningBundle = bundleObj;
        const bundleName = Object.keys(bundleObj)[0];
        this.selectedUsers = (activeLicense.USERS || [])
            .filter(u => u.permissionbundles && u.permissionbundles.includes(bundleName))
            .map(u => u.id);
    },
    applyBulkAssignment() {
        const bundleName = Object.keys(this.bulkAssigningBundle)[0];
        (activeLicense.USERS || []).forEach(u => {
            if (!u.permissionbundles) u.permissionbundles = [];
            const hasIt = u.permissionbundles.includes(bundleName);
            const shouldHaveIt = this.selectedUsers.includes(u.id);
            
            if (shouldHaveIt && !hasIt) {
                u.permissionbundles.push(bundleName);
            } else if (!shouldHaveIt && hasIt) {
                u.permissionbundles = u.permissionbundles.filter(b => b !== bundleName);
            }
        });
        syncLicensesToYaml();
        this.bulkAssigningBundle = null;
    },

    // --- REGISTRY MANAGEMENT ---
    startCreateBundle() {
        this.editingBundle = { name: '', keys: [], isExisting: false };
        this.bundleSearch = '';
    },
    startEditBundle(bundleObj) {
        let name = Object.keys(bundleObj)[0];
        // Normalize keys on load to ensure they match system keys (UPPERCASE_UNDERSCORES)
        let rawKeys = bundleObj[name] || [];
        let normalizedKeys = rawKeys.map(k => k.toUpperCase().replace(/:/g, '_'));
        this.editingBundle = { name: name, keys: normalizedKeys, isExisting: true };
        this.bundleSearch = '';
    },
    async saveBundle() {
        if (!this.editingBundle.name) {
            alert('Please provide a bundle name');
            return;
        }
        if (activeLicense && !activeLicense.PERMISSIONBUNDLES) activeLicense.PERMISSIONBUNDLES = [];
        
        const newEntry = {};
        newEntry[this.editingBundle.name] = this.editingBundle.keys;

        if (this.editingBundle.isExisting) {
            const idx = activeLicense?.PERMISSIONBUNDLES?.findIndex(b => Object.keys(b)[0] === this.editingBundle.name);
            if (idx > -1) activeLicense.PERMISSIONBUNDLES[idx] = newEntry;
        } else {
            activeLicense?.PERMISSIONBUNDLES?.push(newEntry);
        }
        
        syncLicensesToYaml();
        this.editingBundle = null;
    },
    deleteBundle(bundleName) {
        if (confirm(`Are you sure you want to delete bundle '${bundleName}' from the registry?`)) {
            if (activeLicense) activeLicense.PERMISSIONBUNDLES = (activeLicense.PERMISSIONBUNDLES || []).filter(b => Object.keys(b)[0] !== bundleName);
            activeLicense?.USERS?.forEach(u => {
                if (u.permissionbundles) u.permissionbundles = u.permissionbundles.filter(b => b !== bundleName);
            });
            syncLicensesToYaml();
        }
    },
    getAssignedUsers(bundleObj) {
        if (!activeLicense) return [];
        const bundleName = Object.keys(bundleObj)[0];
        return (activeLicense.USERS || []).filter(u => u.permissionbundles && u.permissionbundles.includes(bundleName));
    }
  }"
>
  <!-- Header -->
  <div class="mb-6 shrink-0">
    <button
      @click="loadStep('dashboard')"
      class="text-sm text-gray-500 hover:text-indigo-600 mb-2 flex items-center gap-1.5 transition-colors font-medium"
    >
      <i class="fas fa-arrow-left"></i> Back to Users
    </button>
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800 tracking-tight">
          Permission Management
        </h2>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-gray-500 text-sm">Target User:</span>
          <select 
            x-model="selectedUserId"
            class="bg-white border border-gray-200 rounded-md px-2 py-1 text-sm font-bold text-indigo-600 focus:border-indigo-500 outline-none transition-all"
          >
            <option value="">-- Choose User --</option>
            <template x-for="u in (activeLicense?.USERS || [])" :key="u.id">
              <option :value="u.id" x-text="(u.firstname + ' ' + u.lastname) + (u.id === selectedUserId ? ' (Active)' : '')"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200">
        <button
          @click="view = 'assignment'"
          :class="view === 'assignment' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500 hover:text-gray-800'"
          class="px-4 py-1.5 rounded-md text-xs font-bold transition-all"
        >
          User Assignment
        </button>
        <button
          @click="view = 'registry'"
          :class="view === 'registry' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500 hover:text-gray-800'"
          class="px-4 py-1.5 rounded-md text-xs font-bold transition-all"
        >
          Bundle Registry
        </button>
      </div>
    </div>
  </div>

  <!-- Main View: User Assignment -->
  <div
    class="flex-1 overflow-y-auto bg-gray-50/50 rounded-xl border border-gray-200 shadow-sm p-6"
    x-show="view === 'assignment'"
  >
    <div class="mb-6 flex justify-between items-center">
      <h3 class="text-sm font-bold text-gray-500 uppercase tracking-widest">
        Active Bundles for User
      </h3>
      <p class="text-[11px] text-gray-400 italic">
        Assign bundles to grant extra permissions regardless of roles.
      </p>
    </div>
    <div class="space-y-4">
      <template x-for="(bundle, bIdx) in permissionBundles" :key="bIdx">
        <div
          class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm flex flex-col transition-all hover:border-indigo-200 hover:shadow-md"
        >
          <div class="flex justify-between items-center mb-4">
            <div
              class="font-bold text-gray-800 text-sm flex items-center gap-3"
            >
              <div
                class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center border border-indigo-100 shrink-0"
              >
                <i class="fas fa-layer-group text-lg"></i>
              </div>
              <div>
                <span
                  x-text="Object.keys(bundle)[0]"
                  class="text-base tracking-tight"
                ></span>
                <div
                  class="text-[10px] text-gray-400 font-medium uppercase tracking-wider mt-0.5"
                >
                  Permission Bundle
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button
                @click="startBulkAssign(bundle)"
                class="flex items-center space-x-2 text-xs font-bold text-indigo-600 uppercase cursor-pointer bg-white px-4 py-2 rounded-xl border border-indigo-200 shadow-sm transition-all hover:bg-indigo-50 active:scale-95"
              >
                <i class="fas fa-users-cog"></i>
                <span>Bulk Assign...</span>
              </button>
              <label
                class="flex items-center space-x-2 text-xs font-bold text-gray-700 uppercase cursor-pointer bg-gray-50 px-4 py-2 rounded-xl border border-gray-200 shadow-sm transition-all hover:bg-gray-100 active:scale-95"
                :class="hasBundle(bundle) ? 'bg-indigo-600 border-indigo-700 text-white hover:bg-indigo-700' : ''"
                :title="!selectedUserId ? 'Select a user in the header first' : ''"
              >
                <input
                  type="checkbox"
                  :disabled="!selectedUserId"
                  :checked="hasBundle(bundle)"
                  @change="toggleBundle(bundle)"
                  class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4 disabled:opacity-50"
                >
                <span
                  x-text="hasBundle(bundle) ? 'Assigned' : 'Assign to User'"
                ></span>
              </label>
            </div>
          </div>

          <!-- Assigned Users Tags -->
          <div class="mb-4 flex flex-wrap gap-2 items-center min-h-[24px]">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mr-1">Assigned to:</span>
            <template x-for="user in getAssignedUsers(bundle)" :key="user.id">
              <span 
                class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold transition-all"
                :class="user.id === selectedUserId ? 'bg-indigo-600 text-white shadow-sm ring-2 ring-indigo-200' : 'bg-gray-100 text-gray-600 border border-gray-200'"
                x-text="user.firstname + ' ' + user.lastname"
              ></span>
            </template>
            <template x-if="getAssignedUsers(bundle).length === 0">
              <span class="text-[10px] italic text-gray-400 font-medium">No users assigned</span>
            </template>
          </div>

          <!-- Grouped Permissions Display -->
          <div
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pt-4 border-t border-gray-100"
          >
            <template
              x-for="category in Object.keys(allSystemPermissions || {})"
              :key="category"
            >
              <div
                x-show="bundle[Object.keys(bundle)[0]].some(pk => allSystemPermissions[category].includes(pk))"
                class="space-y-1.5 text-left"
              >
                <div
                  class="text-[9px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 flex items-center gap-1.5"
                >
                  <span class="w-1 h-1 rounded-full bg-indigo-400"></span>
                  <span x-text="category"></span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  <template
                    x-for="permKey in bundle[Object.keys(bundle)[0]].filter(pk => allSystemPermissions[category].includes(pk))"
                    :key="permKey"
                  >
                    <span
                      class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-mono font-bold bg-gray-50 text-gray-600 border border-gray-100"
                      x-text="permKey"
                    ></span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Main View: Bundle Registry -->
  <div
    class="flex-1 overflow-y-auto bg-gray-50/50 rounded-xl border border-gray-200 shadow-sm p-6"
    x-show="view === 'registry'"
  >
    <div class="mb-6 flex justify-between items-center">
      <h3 class="text-sm font-bold text-gray-500 uppercase tracking-widest">
        Global Bundle Registry
      </h3>
      <button
        @click="startCreateBundle()"
        class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-2 border border-indigo-700"
      >
        <i class="fas fa-plus"></i> Define New Bundle
      </button>
    </div>

    <div class="grid grid-cols-1 gap-3">
      <template x-for="(bundle, bIdx) in permissionBundles" :key="'reg_'+bIdx">
        <div
          class="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between shadow-sm group hover:border-indigo-300"
        >
          <div class="flex items-center gap-4">
            <div
              class="w-10 h-10 rounded-xl bg-gray-100 text-gray-500 flex items-center justify-center border border-gray-200 group-hover:bg-indigo-50 group-hover:text-indigo-600 group-hover:border-indigo-100 transition-colors"
            >
              <i class="fas fa-cube"></i>
            </div>
            <div>
              <div
                class="font-bold text-gray-800 text-sm"
                x-text="Object.keys(bundle)[0]"
              >
              </div>
              <div
                class="text-[10px] text-gray-400 font-medium"
                x-text="bundle[Object.keys(bundle)[0]].length + ' permissions included'"
              >
              </div>
              <!-- Inline Permissions List -->
              <div class="mt-2 flex flex-wrap gap-1.5">
                <template x-for="pk in bundle[Object.keys(bundle)[0]]" :key="pk">
                  <span class="px-1 py-0.5 rounded bg-gray-50 text-[9px] font-mono text-gray-500 border border-gray-100" x-text="pk"></span>
                </template>
              </div>
            </div>
          </div>
          <div class="flex gap-2">
            <button
              @click="startEditBundle(bundle)"
              class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"
              title="Edit Bundle"
            >
              <i class="fas fa-edit"></i>
            </button>
            <button
              @click="deleteBundle(Object.keys(bundle)[0])"
              class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
              title="Delete Bundle"
            >
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- BUNDLE EDITOR OVERLAY -->
  <div
    x-show="editingBundle"
    x-transition
    class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-12"
    x-cloak
  >
    <div
      class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"
      @click="editingBundle = null"
    >
    </div>

    <template x-if="editingBundle">
      <div
        class="bg-white w-full max-w-4xl h-full max-h-[90vh] rounded-3xl shadow-2xl relative flex flex-col overflow-hidden border border-white/20"
      >
        <!-- Editor Header -->
        <div class="p-6 border-b border-gray-100 shrink-0 bg-white">
          <div class="flex items-center justify-between mb-4">
            <h3
              class="text-xl font-bold text-gray-800"
              x-text="editingBundle.isExisting ? 'Modify Bundle Registry' : 'Create New Bundle Registry'"
            >
            </h3>
            <div class="flex gap-2">
              <button
                @click="editingBundle = null"
                class="px-4 py-2 text-sm font-semibold text-gray-500 hover:text-gray-800 transition-colors"
              >
                Cancel
              </button>
              <button
                @click="saveBundle()"
                class="px-6 py-2 bg-indigo-600 text-white text-sm font-bold rounded-xl shadow-lg border border-indigo-700 hover:bg-indigo-700 active:scale-95 transition-all"
              >
                Save Bundle
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label
                class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 ml-1"
              >Bundle Identifier</label>
              <input
                type="text"
                x-model="editingBundle.name"
                :disabled="editingBundle.isExisting"
                placeholder="e.g. accounting-bundle"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:bg-white focus:border-indigo-500 outline-none transition-all disabled:opacity-50 font-bold"
              >
            </div>
            <div>
              <label
                class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 ml-1"
              >Search Permissions</label>
              <div class="relative">
                <i
                  class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-300"
                ></i>
                <input
                  type="text"
                  x-model="bundleSearch"
                  placeholder="Filter keys..."
                  class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:bg-white focus:border-indigo-500 outline-none transition-all"
                >
              </div>
            </div>
          </div>
        </div>

        <!-- Editor Body -->
        <div class="flex-1 overflow-y-auto p-6 bg-gray-50/50">
          <div class="flex items-center justify-between mb-4 px-2">
          <div
            class="text-xs font-bold text-gray-500 uppercase tracking-wider"
            x-text="'Available Permissions (' + (allSystemPermissions ? Object.values(allSystemPermissions || {}).reduce((acc, val) => acc + (val?.length || 0), 0) : 0) + ' total)'"
          >
          </div>
          <button
            @click="if(editingBundle && editingBundle.keys.length === 0) { editingBundle.keys = Object.values(allSystemPermissions || {}).flat() } else if(editingBundle) { editingBundle.keys = [] }"
            class="text-[11px] font-bold text-indigo-600 hover:text-indigo-800 bg-white px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm"
          >
            <span
              x-text="editingBundle && editingBundle.keys.length > 0 ? 'Deselect All' : 'Select All'"
            ></span>
          </button>
          </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-8 bg-gray-50/20">
          <template x-for="category in Object.keys(allSystemPermissions || {})" :key="category">
            <div x-show="allSystemPermissions[category].some(k => !bundleSearch || k.toLowerCase().includes(bundleSearch.toLowerCase()))" class="space-y-4">
              <div class="flex items-center gap-3">
                 <div class="h-[1px] flex-1 bg-gray-200"></div>
                 <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.3em] whitespace-nowrap" x-text="category"></h4>
                 <div class="h-[1px] flex-1 bg-gray-200"></div>
              </div>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <template
                  x-for="pk in allSystemPermissions[category].filter(k => !bundleSearch || k.toLowerCase().includes(bundleSearch.toLowerCase()))"
                  :key="pk"
                >
                  <label
                    class="flex items-center p-4 bg-white border border-gray-100 rounded-xl cursor-pointer hover:bg-indigo-50/30 transition-all group"
                    :class="(editingBundle && editingBundle.keys.includes(pk)) ? 'bg-indigo-50 border-indigo-200 text-indigo-900 shadow-sm' : 'hover:border-gray-300 shadow-sm'"
                  >
                    <input
                      type="checkbox"
                      :value="pk"
                      x-model="editingBundle.keys"
                      class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-4"
                    >
                    <div class="flex flex-col min-w-0">
                      <span
                        class="text-sm font-bold font-mono tracking-tight truncate"
                        x-text="pk"
                      ></span>
                    </div>
                  </label>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Editor Footer info -->
        <div
          class="p-4 bg-indigo-600 text-white shrink-0 flex items-center justify-between px-8 shadow-inner"
        >
          <div class="flex items-center gap-3">
            <i class="fas fa-info-circle opacity-50"></i>
            <span class="text-xs font-bold tracking-wide uppercase"
            >New bundle will grant all selected keys to assigned users</span>
          </div>
          <div
            class="font-mono text-xs font-bold bg-white/20 px-3 py-1 rounded-full text-white"
            x-text="(editingBundle ? editingBundle.keys.length : 0) + ' Selected'"
          >
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- BULK ASSIGNMENT MODAL -->
  <div
    x-show="bulkAssigningBundle"
    x-transition
    class="fixed inset-0 z-[110] flex items-center justify-center p-4 sm:p-12"
    x-cloak
  >
    <div
      class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"
      @click="bulkAssigningBundle = null"
    >
    </div>

    <template x-if="bulkAssigningBundle">
      <div
        class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl relative flex flex-col overflow-hidden border border-white/20"
      >
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-white">
          <div>
            <h3 class="text-xl font-bold text-gray-800">Bulk Assignment</h3>
            <p class="text-xs text-gray-400 mt-1 uppercase font-bold tracking-wider">
              Bundle: <span x-text="Object.keys(bulkAssigningBundle)[0]" class="text-indigo-600"></span>
            </p>
          </div>
          <button
            @click="bulkAssigningBundle = null"
            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 transition-colors"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="p-6 bg-gray-50/50 flex-1 overflow-y-auto max-h-[60vh]">
          <div class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">
            Select Users to grant this bundle
          </div>
          <div class="grid grid-cols-1 gap-2">
            <template x-for="u in (activeLicense?.USERS || [])" :key="u.id">
              <label 
                class="flex items-center p-3 rounded-xl border border-gray-100 hover:border-indigo-200 transition-all cursor-pointer bg-white group"
                :class="selectedUsers.includes(u.id) ? 'bg-indigo-50 border-indigo-100' : 'hover:bg-gray-50'"
              >
                <input 
                  type="checkbox" 
                  :value="u.id" 
                  x-model="selectedUsers"
                  class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-4"
                >
                <div class="flex flex-col">
                  <span class="text-sm font-bold text-gray-800" x-text="u.firstname + ' ' + u.lastname"></span>
                  <span class="text-[10px] text-gray-400 font-mono" x-text="u.id"></span>
                </div>
              </label>
            </template>
          </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-100 flex justify-between items-center px-6">
          <div class="text-xs font-bold text-indigo-600">
            <span x-text="selectedUsers.length"></span> Users Selected
          </div>
          <div class="flex gap-2">
            <button
              @click="bulkAssigningBundle = null"
              class="px-4 py-2 text-sm font-semibold text-gray-500 hover:text-gray-800 transition-colors"
            >
              Cancel
            </button>
            <button
              @click="applyBulkAssignment()"
              class="px-6 py-2 bg-indigo-600 text-white text-sm font-bold rounded-xl shadow-lg border border-indigo-700 hover:bg-indigo-700 active:scale-95 transition-all"
            >
              Apply Changes
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
