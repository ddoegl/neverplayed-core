<div class="flex flex-col flex-1 h-full overflow-hidden p-6">
  <div class="mb-6 shrink-0">
    <h2 class="text-2xl font-bold text-gray-800">User Management</h2>
    <p class="text-gray-500 text-sm mt-1">
      Manage users mapped to your company's license (<span
        x-text="currentLicense"
        class="font-medium"
      ></span>).
    </p>
  </div>

  <div
    class="flex-1 overflow-y-auto bg-gray-50/50 rounded-xl relative border border-gray-200 shadow-sm flex flex-col"
  >
    <template x-if="!activeLicense">
      <div
        class="flex flex-col items-center justify-center h-full text-gray-400 gap-3 p-12"
      >
        <i class="fas fa-exclamation-triangle text-4xl opacity-50"></i>
        <p>
          Your profile does not have an active license context or the license
          could not be found.
        </p>
      </div>
    </template>

    <template x-if="activeLicense">
      <!-- USERS CRUD (Duplicated from Backoffice licenses.html) -->
      <div class="flex flex-col flex-1">
        <div
          class="p-6 border-b border-gray-200 bg-white flex justify-between items-center shrink-0"
        >
          <h3
            class="text-lg font-semibold text-gray-800 flex items-center gap-2 m-0"
          >
            <i class="fas fa-users text-indigo-500"></i> License Users
          </h3>
          <div class="flex gap-2">
            <button
              @click="loadStep('holder-registry')"
              class="text-xs bg-white hover:bg-gray-50 text-indigo-600 font-semibold px-3 py-1.5 rounded-lg shadow-sm transition-colors flex items-center gap-1.5 border border-indigo-200"
            >
              <i class="fas fa-id-badge"></i> Holder Registry
            </button>
            <button
              @click="if(!activeLicense.USERS) activeLicense.USERS = []; activeLicense.USERS.push({ id: Math.floor(1000000 + Math.random() * 9000000).toString(), firstname: 'New', lastname: 'User', owner: null, holder: null, channel: ['business'] }); syncLicensesToYaml()"
              class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3 py-1.5 rounded-lg shadow-sm transition-colors flex items-center gap-1.5 border border-indigo-700"
            >
              <i class="fas fa-plus"></i> Create User Record
            </button>
          </div>
        </div>

        <div class="p-6 flex-1 overflow-y-auto bg-gray-50/50">
          <div class="flex flex-col gap-3">
            <template
              x-for="(userObj, uIdx) in (activeLicense?.USERS || [])"
              :key="userObj.id || 'usr_' + uIdx"
            >
              <div
                class="bg-white border border-gray-200 rounded-xl p-4 flex gap-4 shadow-sm relative group items-center"
              >
                <div
                  class="flex-1 grid grid-cols-1 md:grid-cols-9 gap-4 items-center w-full"
                >
                  <!-- ID / Admin Group -->
                  <div class="md:col-span-3 flex gap-3 items-center">
                    <div class="flex-1">
                      <label
                        class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                      >ID</label>
                      <input
                        type="text"
                        :value="userObj.id"
                        @change="userObj.id = $event.target.value; syncAllPersonUserIds();"
                        class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs text-emerald-600 font-bold focus:border-indigo-500 focus:bg-white outline-none"
                      >
                    </div>
                    <div class="flex-1">
                      <label
                        class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                      >Alias</label>
                      <input
                        type="text"
                        :value="userObj.alias || ''"
                        @change="userObj.alias = $event.target.value || null; syncLicensesToYaml();"
                        placeholder="e.g. Robby"
                        class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs text-indigo-600 focus:border-indigo-500 focus:bg-white outline-none"
                      >
                    </div>
                    <div class="flex-none pt-4">
                      <label
                        class="flex items-center space-x-1.5 text-[10px] font-semibold text-gray-700 uppercase cursor-pointer bg-gray-50 px-2 py-1.5 rounded-md border border-gray-200 shadow-sm"
                      >
                        <input
                          type="checkbox"
                          x-model="userObj.administrator"
                          @change="syncLicensesToYaml()"
                          class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 w-3 h-3"
                        >
                        <span>Admin</span>
                      </label>
                    </div>
                  </div>

                  <!-- Names Group -->
                  <div
                    class="md:col-span-4 flex gap-3 items-center border-l md:border-l-gray-100 md:pl-4"
                  >
                    <div
                      class="flex-1"
                      :title="userObj.owner ? 'Inherited from Owner Person' : 'Editable Name'"
                    >
                      <label
                        class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                      >First Name</label>
                      <input
                        type="text"
                        :disabled="userObj.owner"
                        :value="userObj.owner ? (persons.find(p => p.id === userObj.owner)?.firstname || userObj.firstname) : userObj.firstname"
                        @change="if(!userObj.owner) { userObj.firstname = $event.target.value; syncLicensesToYaml(); }"
                        class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs text-gray-800 focus:border-indigo-500 focus:bg-white outline-none disabled:opacity-50 disabled:bg-gray-100"
                      >
                    </div>
                    <div
                      class="flex-1"
                      :title="userObj.owner ? 'Inherited from Owner Person' : 'Editable Name'"
                    >
                      <label
                        class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                      >Last Name</label>
                      <input
                        type="text"
                        :disabled="userObj.owner"
                        :value="userObj.owner ? (persons.find(p => p.id === userObj.owner)?.lastname || userObj.lastname) : userObj.lastname"
                        @change="if(!userObj.owner) { userObj.lastname = $event.target.value; syncLicensesToYaml(); }"
                        class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-xs text-gray-800 focus:border-indigo-500 focus:bg-white outline-none disabled:opacity-50 disabled:bg-gray-100"
                      >
                    </div>
                  </div>

                  <div class="col-span-2">
                    <label
                      class="block text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1"
                    >Assignment / Possession</label>
                    <div
                      class="w-full bg-gray-50 border border-gray-100 rounded-md px-2 py-1.5 min-h-[32px] flex items-center"
                    >
                      <!-- Case 1: Corporate Owner -->
                      <template x-if="userObj.owner">
                        <span
                          class="text-[11px] font-bold text-blue-600 flex items-center"
                          title="Corporate Ownership"
                        >
                          <i class="fas fa-crown mr-1.5 text-amber-500"></i>
                          <span
                            x-text="(persons.find(p => p.id === userObj.owner)?.firstname + ' ' + persons.find(p => p.id === userObj.owner)?.lastname) || (userObj.firstname + ' ' + userObj.lastname)"
                          ></span>
                        </span>
                      </template>
                      <!-- Case 2: Private Holder -->
                      <template x-if="!userObj.owner && userObj.holder">
                        <span
                          class="text-[11px] font-bold text-indigo-600 flex items-center"
                          title="Private Possession"
                        >
                          <i class="fas fa-handshake mr-1.5"></i>
                          <span
                            x-text="(persons.find(p => p.id === userObj.holder)?.firstname + ' ' + persons.find(p => p.id === userObj.holder)?.lastname) || (userObj.firstname + ' ' + userObj.lastname)"
                          ></span>
                        </span>
                      </template>
                      <!-- Case 3: Unassigned -->
                      <template x-if="!userObj.owner && !userObj.holder">
                        <span class="text-[11px] text-gray-400 italic"
                        >Unassigned / Pool</span>
                      </template>
                    </div>
                  </div>

                  <div class="col-span-2 border-l border-gray-100 pl-4">
                    <label
                      class="block text-[9px] text-amber-600 uppercase tracking-widest font-bold mb-1"
                    ><i class="fas fa-shield-alt mr-0.5"></i> SCA
                      Strategy</label>
                    <select
                      :disabled="userObj.owner"
                      @change="userObj.scaStrategy = $event.target.value; syncLicensesToYaml()"
                      class="w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-[11px] text-gray-800 focus:border-blue-500 outline-none appearance-none disabled:bg-gray-50 disabled:text-gray-500"
                    >
                      <option value="" :selected="!userObj.scaStrategy">
                        No SCA
                      </option>
                      <template
                        x-for="strat in (parsedSCAStrategies || [])"
                        :key="strat.id"
                      >
                        <option
                          :value="strat.id"
                          x-text="strat.id"
                          :selected="userObj.scaStrategy === strat.id"
                        >
                        </option>
                      </template>
                    </select>
                  </div>
                </div>

                <div
                  class="flex-none border-l border-gray-100 pl-4 h-full flex items-center justify-center gap-2"
                >
                  <button
                    @click="activeLicense?.USERS?.splice(uIdx, 1); syncAllPersonUserIds();"
                    class="text-red-400 hover:text-red-700 w-8 h-8 flex items-center justify-center bg-gray-50 hover:bg-red-50 rounded-lg border border-gray-200 hover:border-red-200 transition-colors shadow-sm opacity-0 group-hover:opacity-100 focus:opacity-100"
                    title="Delete User"
                  >
                    <i class="fas fa-trash-alt"></i>
                  </button>
                  <button
                    @click="selectedUserId = userObj.id; loadStep('manage-permissions')"
                    class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-200 transition-colors shadow-sm text-[11px] font-semibold flex items-center gap-1.5 opacity-0 group-hover:opacity-100 focus:opacity-100"
                  >
                    <i class="fas fa-shield-halved"></i> Permissions
                  </button>
                </div>
                <!-- Assigned Bundles Badges -->
                <div class="mt-1.5 flex flex-wrap gap-1">
                  <template
                    x-for="bundle in userObj.permissionbundles || []"
                    :key="bundle"
                  >
                    <span
                      class="inline-flex items-center px-1.5 py-0.5 rounded text-[8px] font-bold bg-indigo-50 text-indigo-600 border border-indigo-100 uppercase tracking-tighter"
                      x-text="bundle"
                    ></span>
                  </template>
                  <template
                    x-if="!(userObj.permissionbundles && userObj.permissionbundles.length)"
                  >
                    <span class="text-[8px] text-gray-400 italic"
                    >No bundles assigned</span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
