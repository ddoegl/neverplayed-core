<div class="p-4" x-init="$dispatch('set-modal-width', 'max-w-4xl')">
  <div class="grid grid-cols-4 gap-4">
    <!-- Main Card: Email Preview -->
    <div class="col-span-2 bg-white p-6 rounded shadow-md">
      <div class="prose mb-4"></div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2"
        >Subject</label>
        <input
          type="text"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          value="Connect Invitation 123 8476 445"
          readonly
        />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Body</label>
        <div
          class="border p-4 h-96 overflow-y-auto bg-gray-50 text-sm"
          x-html="emailContent"
        >
          <!-- Email Content Injected Here -->
        </div>
      </div>
    </div>

    <!-- Sidebar: Options -->
    <div
      class="col-span-2 bg-white p-6 rounded shadow-md flex flex-col justify-between"
    >
      <div>
        <div class="mb-6">
          <p class="font-bold">
            An invitation with the following ID has been created:
          </p>
          <div
            class="text-2xl font-mono text-center my-2 select-all bg-gray-100 p-2 rounded"
            x-text="invitation.code"
          >
          </div>
        </div>

        <p class="mb-4 text-sm">
          Send this invitation email on behalf of <strong
            x-text="invitation.companyName || (isBootstrappedLicense() ? 'Personal License' : 'Bike Value Logistics GmbH')"
          ></strong>
          using your own secure email service.
        </p>

        <div class="space-y-2 mb-6">
          <button
            class="w-full bg-blue-100 text-blue-700 font-semibold py-2 px-4 rounded hover:bg-blue-200"
            @click="window.location.href='mailto:?subject=Connect Invitation&body=...'"
          >
            Send via Mailto Link
          </button>
          <div class="flex space-x-2">
            <button class="flex-1 text-blue-600 hover:underline">
              Copy to Clipboard
            </button>
            <button class="flex-1 text-blue-600 hover:underline">
              Save Text
            </button>
          </div>
        </div>

        <hr class="my-4" />

        <p class="mb-4 text-sm">
          Do you want the d-Connect team to send the invitation email on behalf
          of Bike Value Logistics GmbH?
        </p>

        <div class="flex items-center mb-4">
          <input type="checkbox" id="send-on-behalf" class="mr-2">
          <label for="send-on-behalf" class="text-sm"
          >Yes, please send this email on available</label>
        </div>
      </div>

      <div class="flex space-x-4 mt-8">
        <button
          class="bg-blue-600 text-white font-bold py-2 px-4 rounded flex-1"
          @click="completeInvitation()"
        >
          Confirm
        </button>
        <button
          class="bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded flex-1"
          @click="$dispatch('set-modal-width', 'max-w-md'); loadStep('security-setup')"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
