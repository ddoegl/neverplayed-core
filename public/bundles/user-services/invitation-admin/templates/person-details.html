<div>
  <div x-show="currentStep === 'details' || currentStep === 'person-details'">
    <!-- View 2: Form (Type & Person) -->
    <div>
      <div class="mb-6 text-center">
        <template x-if="INVITATION_TYPE_REGISTRY[invitationType]">
          <div>
            <div
              class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-50 text-blue-600 mb-4 border border-blue-100 shadow-sm"
            >
              <i
                class="text-2xl"
                :class="INVITATION_TYPE_REGISTRY[invitationType].icon"
              ></i>
            </div>
            <h2
              class="text-2xl font-black text-slate-800 uppercase tracking-tight"
              x-text="INVITATION_TYPE_REGISTRY[invitationType].title"
            >
            </h2>
            <p
              class="text-slate-500 text-sm mt-1"
              x-text="INVITATION_TYPE_REGISTRY[invitationType].description"
            >
            </p>
          </div>
        </template>
        <template x-if="!INVITATION_TYPE_REGISTRY[invitationType]">
          <h2
            class="text-2xl font-black text-slate-800 uppercase tracking-tight"
          >
            New Invitation
          </h2>
        </template>
      </div>
      <div class="h-px bg-slate-100 w-full mb-6"></div>

      <!-- New Person Fields -->
      <div
        x-show="showNewPersonForm"
        class="mt-4 border p-4 rounded bg-gray-50 transition-all"
        x-transition
      >
        <h4 class="font-bold mb-2 text-sm text-gray-600">
          Personal Details
        </h4>
        <div class="mb-2">
          <label class="text-xs">First Name</label>
          <input
            type="text"
            x-model="form.newPerson.firstname"
            class="block w-full p-2 border rounded"
            placeholder="First Name"
          >
        </div>
        <div class="mb-2">
          <label class="text-xs">Last Name</label>
          <input
            type="text"
            x-model="form.newPerson.lastname"
            class="block w-full p-2 border rounded"
            placeholder="Last Name"
          >
        </div>
        <div class="mb-2">
          <label class="text-xs">Birth Date</label>
          <input
            type="date"
            x-model="form.newPerson.birthdate"
            class="block w-full p-2 border rounded"
          >
        </div>
        <div class="mb-2">
          <label class="text-xs">Email <span class="text-red-500"
            >*</span></label>
          <input
            type="email"
            x-model="form.newPerson.email"
            class="block w-full p-2 border rounded"
            :class="{ 'border-red-400': !form.newPerson.email }"
            placeholder="Email (required)"
            required
          >
          <p x-show="!form.newPerson.email" class="text-xs text-red-500 mt-1">
            Email is required
          </p>
        </div>
        <div class="mb-2">
          <label class="text-xs">Phone</label>
          <input
            type="tel"
            x-model="form.newPerson.phone"
            class="block w-full p-2 border rounded"
            placeholder="Phone"
          >
        </div>
      </div>

      <div class="flex space-x-2 mt-8">
        <button
          class="flex-1 bg-gray-300 text-gray-700 px-4 py-2 rounded"
          @click="closeModal()"
        >
          Cancel
        </button>
        <button
          class="flex-1 bg-blue-600 text-white px-4 py-2 rounded"
          :class="{ 'opacity-50 cursor-not-allowed': !form.newPerson.email }"
          :disabled="!form.newPerson.email"
          @click="form.newPerson.email && loadStep('security-setup')"
        >
          Continue
        </button>
      </div>
    </div>
  </div>
</div>
