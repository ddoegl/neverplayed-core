<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Invitation Dashboard</h1>
    <button
      class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
      @click="inviteNewPerson(null)"
    >
      <i class="fas fa-plus mr-2"></i> New Invitation
    </button>
  </div>

  <div class="bg-white shadow-md rounded my-6 overflow-x-auto">
    <table class="min-w-full table-auto">
      <thead>
        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
          <th class="py-3 px-6 text-left">Invitee</th>
          <th class="py-3 px-6 text-left">Email</th>
          <th class="py-3 px-6 text-center">Code</th>
          <th class="py-3 px-6 text-center">Date</th>
          <th class="py-3 px-6 text-center">Status</th>
          <th class="py-3 px-6 text-center">Actions</th>
        </tr>
      </thead>
      <tbody class="text-gray-600 text-sm font-light">
        <template x-for="inv in filteredInvitations" :key="inv.id">
          <tr class="border-b border-gray-200 hover:bg-gray-100">
            <td class="py-3 px-6 text-left whitespace-nowrap">
              <span
                class="font-medium"
                x-text="(inv.firstname || inv.firstName) + ' ' + (inv.lastname || inv.lastName)"
              ></span>
            </td>
            <td class="py-3 px-6 text-left">
              <span x-text="inv.targetEmail || inv.email"></span>
            </td>
            <td class="py-3 px-6 text-center">
              <span
                class="bg-gray-200 py-1 px-3 rounded text-xs font-mono select-all"
                x-text="inv.code"
              ></span>
            </td>
            <td class="py-3 px-6 text-center">
              <span x-text="new Date(inv.createdAt).toLocaleDateString()"></span
              >
            </td>
            <td class="py-3 px-6 text-center">
              <span
                class="py-1 px-3 rounded text-xs"
                :class="{
                                    'bg-yellow-200 text-yellow-600': inv.status === 'pending',
                                    'bg-blue-200 text-blue-600': inv.status === 'sent',
                                    'bg-green-200 text-green-600': inv.status === 'redeemed',
                                    'bg-indigo-200 text-indigo-600': inv.status === 'admitted',
                                    'bg-red-200 text-red-600': inv.status === 'rejected'
                                }"
                x-text="inv.status"
              ></span>
            </td>
            <td class="py-3 px-6 text-center">
              <div class="flex item-center justify-center">
                <button
                  class="w-4 mr-2 transform hover:text-purple-500 hover:scale-110"
                  title="Resend"
                  @click="openInvitationConfirmation(inv.code)"
                >
                  <i class="fas fa-envelope"></i>
                </button>
                <button
                  x-show="inv.status === 'redeemed'"
                  class="w-4 mr-2 transform hover:text-blue-500 hover:scale-110"
                  title="Admit"
                  @click="startAdmission(inv.code)"
                >
                  <i class="fas fa-check-circle"></i>
                </button>
              </div>
            </td>
          </tr>
        </template>
        <tr x-show="filteredInvitations.length === 0">
          <td colspan="6" class="py-3 px-6 text-center text-gray-400">
            No invitations found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
