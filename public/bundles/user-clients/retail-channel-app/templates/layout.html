<div class="flex flex-col h-full bg-white relative">
  <!-- Status Bar Simulation -->
  <div class="h-6 flex justify-between items-center px-6 pt-2 shrink-0">
    <span class="text-[10px] font-bold">9:41</span>
    <div class="flex gap-1.5 items-center">
      <i class="fas fa-signal text-[10px]"></i>
      <i class="fas fa-wifi text-[10px]"></i>
      <i class="fas fa-battery-full text-[10px]"></i>
    </div>
  </div>

  <!-- Main Content Slot -->
  <div class="flex-1 overflow-hidden">
    {{{flowContent}}}
  </div>

  <!-- Navigation Menu Overlay -->
  <div
    x-show="isMenuOpen"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="translate-y-full"
    x-transition:enter-end="translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="translate-y-0"
    x-transition:leave-end="translate-y-full"
    class="absolute inset-0 bg-white z-50 flex flex-col"
    style="display: none"
  >
    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
      <h2 class="text-xl font-bold text-gray-800">Navigation</h2>
      <button
        @click="toggleMenu()"
        class="p-2 text-gray-500 hover:text-gray-800"
      >
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 grid grid-cols-2 gap-4">
      <template
        x-for="step in steps.filter(s => s.id !== 'redeem-invite' && s.id !== 'cases' && s.id !== 'signing')"
        :key="step.id"
      >
        <!-- Filter out 'Redeem Invitation' if it matches by title/id if needed, 
             but typically we show all in menu -->
        <button
          @click="loadStep(step.id)"
          class="flex flex-col items-center justify-center p-6 bg-slate-50 rounded-2xl gap-3 transition-all active:scale-95 active:bg-slate-100 hover:shadow-sm"
        >
          <div
            class="w-12 h-12 rounded-xl bg-white shadow-sm flex items-center justify-center text-blue-600"
          >
            <i :class="step.icon" class="text-2xl"></i>
          </div>
          <span
            class="text-xs font-semibold text-gray-700"
            x-text="step.name"
          ></span>
        </button>
      </template>

      <!-- Explicit Case Management button for the 'cases' flow -->
      <button
        @click="loadStep('cases')"
        class="flex flex-col items-center justify-center p-6 bg-slate-50 rounded-2xl gap-3 transition-all active:scale-95 active:bg-slate-100 hover:shadow-sm"
      >
        <div
          class="w-12 h-12 rounded-xl bg-white shadow-sm flex items-center justify-center text-blue-600"
        >
          <i class="fas fa-folder-open text-2xl"></i>
        </div>
        <span class="text-xs font-semibold text-gray-700">Case Management</span>
      </button>
    </div>

    <!-- Padding for Home Indicator -->
    <div class="h-8 shrink-0"></div>
  </div>

  <!-- Bottom Navigation -->
  <nav
    class="h-20 bg-white/80 backdrop-blur-md border-t border-gray-100 flex justify-around items-center px-8 pb-4 shrink-0"
  >
    <!-- Home Button -->
    <button
      @click="loadStep('user-home-retail')"
      class="flex flex-col items-center gap-1 transition-colors"
      :class="currentStep === 'user-home-retail' ? 'text-blue-600' : 'text-gray-400'"
    >
      <i class="fas fa-home text-xl"></i>
      <span class="text-[10px] font-medium">Home</span>
    </button>

    <!-- Menu Button -->
    <button
      @click="toggleMenu()"
      class="flex flex-col items-center gap-1 transition-colors"
      :class="isMenuOpen ? 'text-blue-600' : 'text-gray-400'"
    >
      <i class="fas fa-bars text-xl"></i>
      <span class="text-[10px] font-medium">Menu</span>
    </button>
  </nav>

  <!-- Home Indicator -->
  <div
    class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-gray-200 rounded-full"
  >
  </div>
</div>
