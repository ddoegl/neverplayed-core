<div
  class="flex flex-col items-center justify-center min-h-[400px] p-8 text-center bg-gray-50 rounded-3xl border-2 border-gray-200 animate-fadeIn"
>
  <div
    class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-sm"
  >
    <i class="fas fa-lock text-2xl"></i>
  </div>

  <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">
    Set Desktop PIN
  </h2>
  <p class="text-gray-500 text-sm mb-10 text-center max-w-sm mx-auto">
    Create a secure 6-digit PIN for this desktop application.
  </p>

  <div class="w-full max-w-xs space-y-4 mb-10">
    <input
      type="password"
      placeholder="New PIN"
      class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-center text-xl tracking-widest focus:ring-2 focus:ring-blue-500 outline-none"
    >
    <input
      type="password"
      placeholder="Confirm PIN"
      class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-center text-xl tracking-widest focus:ring-2 focus:ring-blue-500 outline-none"
    >
  </div>

  <button
    @click="loadStep('success')"
    class="w-full max-w-xs bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95"
  >
    Complete Setup
  </button>
</div>
