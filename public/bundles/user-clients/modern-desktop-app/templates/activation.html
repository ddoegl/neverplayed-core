<div
  class="flex flex-col items-center justify-center min-h-[400px] p-8 text-center bg-gray-50 rounded-3xl border-2 border-gray-200 animate-fadeIn"
>
  <div
    class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-sm"
  >
    <i class="fas fa-barcode text-2xl"></i>
  </div>

  <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">
    Activate Desktop Token
  </h2>
  <p class="text-gray-500 text-sm mb-10 text-center max-w-sm mx-auto">
    Enter your User ID and the activation code shown on your mobile device or
    PDF.
  </p>

  <div class="w-full max-w-xs space-y-4 mb-10">
    <div class="text-left">
      <label
        class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 ml-1"
      >User ID</label>
      <input
        type="text"
        placeholder="e.g. 12345678"
        class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
    </div>
    <div class="text-left">
      <label
        class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5 ml-1"
      >Activation Code</label>
      <input
        type="text"
        placeholder="XXXX-XXXX-XXXX"
        class="w-full font-mono bg-white border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
      >
    </div>
  </div>

  <div class="flex flex-col gap-3 w-full max-w-xs mx-auto">
    <button
      @click="loadStep('define-pin')"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95"
    >
      Continue
    </button>
    <button
      @click="loadStep('welcome')"
      class="text-gray-400 hover:text-gray-600 text-sm font-medium py-2"
    >
      Cancel
    </button>
  </div>
</div>
