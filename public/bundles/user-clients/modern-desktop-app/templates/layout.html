<div
  class="fixed inset-0 z-50 flex items-center justify-center p-8 bg-slate-900/60 backdrop-blur-md"
>
  <!-- Window Container -->
  <div
    class="w-full max-w-4xl h-[600px] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-slate-200 animate-modalScale"
  >
    <!-- Title Bar -->
    <div
      class="h-12 bg-slate-50 border-b border-slate-200 flex justify-between items-center px-4 shrink-0"
    >
      <div class="flex items-center gap-2">
        <div class="flex gap-1.5">
          <div class="w-3 h-3 rounded-full bg-red-400"></div>
          <div class="w-3 h-3 rounded-full bg-amber-400"></div>
          <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
        </div>
        <div
          class="ml-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2"
        >
          <i class="fas fa-shield-alt"></i>
          Modern Token Desktop Application
        </div>
      </div>
      <button
        @click="await selectFlow('user-home')"
        class="text-slate-400 hover:text-slate-600 transition-colors"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto bg-gray-50/30">
      {{{flowContent}}}
    </div>
  </div>
</div>

<style>
  @keyframes modalScale {
    from {
      opacity: 0;
      transform: scale(0.98) translateY(10px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  .animate-modalScale {
    animation: modalScale 0.3s ease-out forwards;
  }
</style>
