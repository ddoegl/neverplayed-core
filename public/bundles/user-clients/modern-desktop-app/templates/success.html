<div
  class="flex flex-col items-center justify-center min-h-[400px] p-8 text-center bg-gray-50 rounded-3xl border-2 border-gray-200 animate-fadeIn"
>
  <div
    class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-6 shadow-sm"
  >
    <i class="fas fa-check-double text-3xl"></i>
  </div>

  <h2 class="text-2xl font-bold text-gray-900 mb-2">Desktop Token Active</h2>
  <p class="text-gray-500 text-sm mb-10 max-w-xs mx-auto">

  </p>

  <div

    <div class="flex items-center gap-3 text-left">
      <div

        <i class="fas fa-desktop"></i>
      </div>
      <div>
        <div
          class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"
        >
          Device Name
        </div>
        <div class="text-sm font-semibold text-gray-800">My Work Station</div>
      </div>
    </div>
  </div>

  <button
    @click="selectFlow('user-home')"
    class="w-full max-w-xs bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95"
