<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm"
>
  <!-- Phone Frame -->
  <div
    class="relative w-[360px] h-[740px] bg-black rounded-[60px] shadow-2xl border-[8px] border-slate-800 overflow-hidden flex flex-col transform animate-modalScale"
  >
    <!-- Camera/Speaker area -->
    <div
      class="absolute top-0 left-1/2 -translate-x-1/2 h-8 w-40 bg-slate-800 rounded-b-3xl z-10 flex items-center justify-center gap-2"
    >
      <div class="w-2 h-2 rounded-full bg-slate-700"></div>
      <div class="w-12 h-1 rounded-full bg-slate-700"></div>
    </div>

    <!-- Content Area -->
    <div class="flex-1 bg-white overflow-y-auto mt-4 px-1 pb-1">
      {{{flowContent}}}
    </div>

    <!-- Home Indicator -->
    <div class="h-10 w-full bg-white flex items-center justify-center pb-2">
      <div class="w-32 h-1.5 bg-slate-200 rounded-full"></div>
    </div>
  </div>

  <!-- Back to real life button -->
  <button
    @click="await selectFlow('user-home')"
    class="absolute top-8 right-8 bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-full text-xs font-bold backdrop-blur-md transition-all active:scale-95"
  >
    <i class="fas fa-times mr-2"></i> Close Simulation
  </button>
</div>

<style>
  @keyframes modalScale {
    from {
      opacity: 0;
      transform: scale(0.9) translateY(20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  .animate-modalScale {
    animation: modalScale 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
</style>
