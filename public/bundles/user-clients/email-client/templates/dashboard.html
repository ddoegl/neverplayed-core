<div class="flex flex-col h-full bg-slate-50 overflow-hidden">
  <!-- Header -->
  <div class="p-4 pt-12 bg-white border-b flex items-center justify-between">
    <h1 class="text-xl font-bold text-slate-900 line-clamp-1">Inbox</h1>
    <button
      @click="refreshInbox()"
      class="p-2 text-slate-400 hover:text-blue-600 transition-colors"
    >
      <i class="fas fa-sync-alt"></i>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="p-4 bg-white border-b">
    <div class="relative">
      <i
        class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"
      ></i>
      <input
        type="text"
        placeholder="Search mail"
        class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-blue-500"
      >
    </div>
  </div>

  <!-- Email List -->
  <div class="flex-1 overflow-y-auto">
    <template x-if="emails.length === 0">
      <div
        class="flex flex-col items-center justify-center h-full text-slate-400 space-y-4 p-8 text-center"
      >
        <div
          class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center"
        >
          <i class="fas fa-envelope-open text-3xl"></i>
        </div>
        <p>No messages in your inbox.</p>
      </div>
    </template>

    <div class="divide-y divide-slate-100">
      <template x-for="email in emails" :key="email.id">
        <div
          @click="viewEmail(email)"
          class="p-4 bg-white hover:bg-slate-50 cursor-pointer transition-colors active:bg-slate-100"
        >
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-slate-900" x-text="email.from"></span>
            <span
              class="text-xs text-slate-400"
              x-text="formatDate(email.timestamp)"
            ></span>
          </div>
          <div
            class="text-sm font-semibold text-slate-800 mb-1"
            x-text="email.subject"
          >
          </div>
          <div class="text-xs text-slate-500 line-clamp-2" x-text="email.body">
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Compose Button -->
  <div class="absolute bottom-6 right-6">
    <button
      class="w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center text-xl hover:scale-105 transition-transform active:scale-95 shadow-blue-500/30"
    >
      <i class="fas fa-pen"></i>
    </button>
  </div>
</div>
