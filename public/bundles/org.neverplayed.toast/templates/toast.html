<!-- Toast Notification HUD — org.neverplayed.toast v1.0.0 -->
<div class="fixed bottom-6 right-6 z-[9999] flex flex-col-reverse items-end gap-3 pointer-events-none"
     x-cloak>

    <template x-for="toast in toasts" :key="toast.id">
        <div
            class="pointer-events-auto flex items-start gap-3 min-w-[280px] max-w-sm
                   rounded-2xl border px-4 py-3
                   backdrop-blur-md shadow-2xl
                   transition-all duration-300"
            :class="{
                'bg-slate-900/85 border-slate-700/60': toast.type === 'info',
                'bg-emerald-950/85 border-emerald-700/60': toast.type === 'success',
                'bg-amber-950/85 border-amber-700/60': toast.type === 'warning',
                'bg-red-950/85 border-red-700/60': toast.type === 'error',
                'opacity-100 translate-x-0': toast.visible,
                'opacity-0 translate-x-8': !toast.visible
            }"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-x-8"
            x-transition:enter-end="opacity-100 translate-x-0"
            x-transition:leave="transition ease-in duration-250"
            x-transition:leave-start="opacity-100 translate-x-0"
            x-transition:leave-end="opacity-0 translate-x-8"
        >
            <!-- Status Icon -->
            <div class="mt-0.5 flex-shrink-0 w-5 h-5 flex items-center justify-center">
                <i class="fas text-sm"
                   :class="{
                       'fa-info-circle text-cyan-400': toast.type === 'info',
                       'fa-check-circle text-emerald-400': toast.type === 'success',
                       'fa-exclamation-triangle text-amber-400': toast.type === 'warning',
                       'fa-times-circle text-red-400': toast.type === 'error'
                   }">
                </i>
            </div>

            <!-- Message -->
            <p class="flex-1 text-xs font-mono leading-relaxed"
               :class="{
                   'text-slate-200': toast.type === 'info',
                   'text-emerald-200': toast.type === 'success',
                   'text-amber-200': toast.type === 'warning',
                   'text-red-200': toast.type === 'error'
               }"
               x-text="toast.message">
            </p>

            <!-- Dismiss Button -->
            <button
                @click="dismiss(toast.id)"
                class="flex-shrink-0 ml-1 text-slate-500 hover:text-white transition-colors duration-150 focus:outline-none"
                aria-label="Dismiss notification"
            >
                <i class="fas fa-times text-[10px]"></i>
            </button>
        </div>
    </template>
</div>
