<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Realms Shell | Never Played</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <script type="importmap">
      {
        "imports": {
          "@pandino/pandino": "https://esm.sh/@pandino/pandino@0.8.33",
          "@pandino/pandino-api": "https://esm.sh/@pandino/pandino-api@0.8.33",
          "@pandino/persistence-manager-api": "https://esm.sh/@pandino/persistence-manager-api@0.8.33",
          "@pandino/persistence-manager-localstorage": "https://esm.sh/@pandino/persistence-manager-localstorage@0.8.33",
          "@pandino/event-api": "https://esm.sh/@pandino/event-api@0.8.33",
          "@pandino/log-api": "https://esm.sh/@pandino/log-api@0.8.33",
          "alpinejs": "https://esm.sh/alpinejs@3.13.5",
          "shared-types": "./shared-types.js",
          "core-types": "./core-types.js",
          "osgi-base": "./osgi-base.js",
          "@neverplayed/shared-ui/": "./bundles/org.neverplayed.shared-ui/",
          "@neverplayed/selection-service/": "./bundles/org.neverplayed.selection-service/",
          "@neverplayed/do-registry/": "./bundles/org.neverplayed.do-registry/",
          "@neverplayed/realm.real-life/": "./bundles/org.neverplayed.realm.real-life/",
          "@neverplayed/visual-editor/": "./bundles/org.neverplayed.visual-editor/",
          "@neverplayed/showcase/": "./bundles/org.neverplayed.showcase/",
          "@neverplayed/config-admin/": "./bundles/org.neverplayed.config-admin/",
          "@neverplayed/event-monitor/": "./bundles/org.neverplayed.event-monitor/"
        }
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.12.0/cdn/themes/light.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.12.0/cdn/shoelace-autoloader.js"
    ></script>

    <style>
      [x-cloak] {
        display: none !important;
      }
      body {
        background: #f8fafc;
      }
    </style>
  </head>
  <body
    x-data="shellLoader"
    class="h-screen flex flex-col overflow-hidden sl-theme-light"
  >
    <!-- Global Header -->
    <header
      class="h-12 bg-slate-900 text-white flex items-center justify-between px-6 shadow-md z-30 shrink-0"
    >
      <div class="flex items-center space-x-3">
        <img src="branding.svg" class="w-6 h-6" />
        <span
          class="font-bold text-sm tracking-tight text-slate-200"
        >neverplayed <span class="text-blue-400">realms</span></span>
      </div>

      <div class="flex items-center space-x-6">
        <!-- Universe Switcher UI -->
        <div x-data="realmSwitcher" x-cloak class="relative">
          <button
            @click="open = !open"
            class="flex items-center space-x-2 bg-slate-800/50 hover:bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 transition-all group"
          >
            <div class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse">
            </div>
            <span
              class="text-[11px] font-medium tracking-wide text-slate-300 group-hover:text-white"
              x-text="activeTitle || 'Loading...'"
            ></span>
            <i
              class="fas fa-chevron-down text-[9px] text-slate-500 group-hover:text-blue-400 transition-transform"
              :class="open ? 'rotate-180' : ''"
            ></i>
          </button>

          <div
            x-show="open"
            @click.away="open = false"
            x-transition
            class="absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden z-50"
          >
            <div class="px-3 py-2 border-b border-slate-800">
              <span
                class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"
              >Contexts</span>
            </div>
            <div class="max-h-64 overflow-y-auto py-1">
              <template x-for="r in realms" :key="r.id">
                <button
                  @click="switchRealm(r.id)"
                  class="w-full flex items-center justify-between px-3 py-2 hover:bg-slate-800/50 group"
                >
                  <div class="flex flex-col items-start">
                    <span
                      class="text-xs font-medium"
                      :class="r.id === activeId ? 'text-blue-400' : 'text-slate-300 group-hover:text-white'"
                      x-text="r.title"
                    ></span>
                    <span
                      class="text-[9px] text-slate-500 font-mono"
                      x-text="r.id"
                    ></span>
                  </div>
                  <i
                    x-show="r.id === activeId"
                    class="fas fa-check text-[10px] text-blue-400"
                  ></i>
                </button>
              </template>
            </div>
          </div>
        </div>

        <div class="text-[10px] font-mono text-slate-500">
          <span x-show="!kernelReady">Initial Shielding...</span>
          <span x-show="kernelReady">Secure Kernel Active</span>
        </div>
      </div>
    </header>

    <!-- App Container -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar managed by org.neverplayed.shell-sidebar -->
      <aside
        id="shell-sidebar-root"
        class="w-auto bg-white z-20 overflow-hidden flex flex-col"
      >
      </aside>

      <!-- Main Content managed by org.neverplayed.shell-host -->
      <main class="flex-1 overflow-y-auto relative bg-slate-50">
        <template x-if="kernelReady">
          <div
            id="shell-host-root"
            class="h-full w-full relative"
            x-data="shellHost"
          >
            <div
              id="flow-content"
              x-ref="flowContent"
              x-ignore
              class="h-full w-full"
            >
            </div>

            <!-- Global Overlay (Loader) -->
            <div
              x-show="!ready"
              class="absolute inset-0 bg-slate-50/80 backdrop-blur-sm flex flex-col items-center justify-center space-y-4 z-50"
            >
              <i class="fas fa-spinner fa-spin text-blue-500 text-2xl"></i>
              <span
                class="text-slate-400 text-[10px] font-mono uppercase tracking-widest"
                x-text="status"
              ></span>
            </div>
          </div>
        </template>

        <!-- Kernel Boot Progress -->
        <div
          x-show="!kernelReady"
          class="h-full flex flex-col items-center justify-center space-y-4"
        >
          <i class="fas fa-shield-alt fa-spin text-blue-400 text-2xl"></i>
          <span
            class="text-slate-400 text-[10px] font-mono uppercase tracking-widest text-center px-20"
            x-text="bootStatus"
          ></span>
          <div
            x-show="error"
            class="text-red-500 text-xs font-mono mt-4 text-center px-10"
          >
            <p class="font-bold uppercase tracking-wider">
              Kernel Panic: Boot Failure
            </p>
            <p x-text="error"></p>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import loaderConfiguration from "https://esm.sh/@pandino/loader-configuration-dom@0.8.33";
      import Pandino from "https://esm.sh/@pandino/pandino@0.8.33";
      import Alpine from "https://esm.sh/alpinejs@3.13.5";
      import { REALM_MANAGER_SERVICE } from "shared-types";

      // 1. Initialize Central Orchestration State
      Alpine.store("platform", { kernelReady: false });

      Alpine.data("shellLoader", () => ({
        kernelReady: false,
        bootStatus: "Shielding Phase: Core Initialization...",
        error: null,

        init() {
          this.boot();
        },
        async boot() {
          try {
            const pandino = new Pandino({ ...loaderConfiguration });
            await pandino.init();
            await pandino.start();

            const context = pandino.getBundleContext();
            globalThis.Alpine = Alpine;
            globalThis.pandinoContext = context;

            // 2. Load Orchestrator
            this.bootStatus = "Loading Orchestration Layer...";
            const rmBundle = await context.installBundle(
              "./bundles/org.neverplayed.realm-manager/manifest.json",
            );
            if (rmBundle.getState() < 32) await rmBundle.start();

            // 3. Handshake with Orchestrator (Wait for full context leap)
            const rmRef = context.getServiceReference(
              REALM_MANAGER_SERVICE,
            );
            if (rmRef) {
              const rm = context.getService(rmRef);
              this.bootStatus = "Synthesizing Framework...";
              await rm.waitReady();
            }

            // 4. Final Activation Buffer (Telemetry Bridge)
            this.bootStatus = "Igniting UI Layer...";
            await new Promise((r) => setTimeout(r, 150));

            this.kernelReady = true;
            Alpine.store("platform").kernelReady = true;
          } catch (err) {
            console.error("Boot Failure:", err);
            this.error = err.message;
          }
        },
      }));

      // --- UI Components ---
      Alpine.data("realmSwitcher", () => ({
        open: false,
        realms: [],
        activeId: null,
        activeTitle: "",

        async init() {
          this.$watch("$store.platform.kernelReady", (val) => {
            if (val) this.sync();
          });
          if (Alpine.store("platform").kernelReady) this.sync();
        },

        async sync() {
          const context = globalThis.pandinoContext;
          if (!context) return;
          const rmRef = context.getServiceReference(
            REALM_MANAGER_SERVICE,
          );
          const rm = context.getService(rmRef);
          this.realms = rm.getOrderedRealms();
          this.activeId = rm.getActiveRealm();
          const active = this.realms.find((r) =>
            r.id === this.activeId
          );
          this.activeTitle = active ? active.title : "Warping...";
        },

        async switchRealm(id) {
          this.open = false;
          const context = globalThis.pandinoContext;
          if (!context) return;
          const rm = context.getService(
            context.getServiceReference(REALM_MANAGER_SERVICE),
          );
          await rm.switchRealm(id);
          this.sync();
        },
      }));

      Alpine.start();
    </script>
  </body>
</html>
